// ──────────────────────────────────────────

const $  = id  => document.getElementById(id);

function isFinished(status) {
  if (!status) return false;
  return ['FINISHED', 'FT', 'AET', 'PEN'].includes(status.toUpperCase());
}

function showToast(msg, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  const bgClass = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
  toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold fade-up transition-opacity duration-300 flex items-center justify-center`;
  toast.innerHTML = type === 'success' ? `✓ &nbsp;${msg}` : `⚠ &nbsp;${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
}

function skeletonCard() {
  return `<div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 animate-pulse space-y-4">
    <div class="h-4 bg-slate-200 rounded w-1/3"></div>
    <div class="flex justify-between items-center"><div class="w-12 h-8 bg-slate-200 rounded"></div><div class="w-20 h-10 bg-slate-200 rounded"></div><div class="w-12 h-8 bg-slate-200 rounded"></div></div>
    <div class="h-12 bg-slate-200 rounded w-full"></div>
  </div>`;

function scorerSkeleton() {

function loading(el) {

function flag(team, imgCls = 'w-8 h-6') {
  if (!team?.flag_url) return `<span class="text-2xl leading-none">🏳️</span>`;
  if (team.flag_url.startsWith('http') || team.flag_url.startsWith('/')) {
    return `<img src="${team.flag_url}" class="${imgCls} object-cover rounded-sm shadow-sm" alt="${team.name}" />`;
  }
  return `<span class="text-3xl leading-none">${team.flag_url}</span>`;
}

function fmtTime(ts) { return new Date(ts).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }); }

function fmtDate(ts) { 
  const d = new Date(ts);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  return `${day}.${month}`;
}

function formatRelativeDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const tmrw = new Date(); tmrw.setDate(today.getDate() + 1);
  
  const time = fmtTime(ts);
  if (d.toDateString() === today.toDateString()) return 'Heute ' + time;
  if (d.toDateString() === tmrw.toDateString()) return 'Morgen ' + time;
  
  return `${fmtDate(ts)} ${time}`;
}

function isLocked(m) { return new Date(m.kickoff_time) <= new Date(); }
function phases()    { 
  const p = [...new Set(S.matches.map(m => m.phase).filter(Boolean))];
  p.push('Bonusfragen'); 
  return p;
}

function phaseTabs(activePhase, onclickFn) {
  return phases().map(p => `
    <button onclick="${onclickFn}('${p}')"
      class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-all
             ${p === activePhase ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">
      ${p}
    </button>`).join('');
}

function getFinalScore(m, type) {
  if (type === 'home') return m.home_score_extratime !== null ? m.home_score_extratime : m.home_score;
  if (type === 'away') return m.away_score_extratime !== null ? m.away_score_extratime : m.away_score;
  return null;
}

// Zentrale Logik für Live-Punkte & reguläre Punkte
function calcBetPoints(m, b) {
  if (!m || !b) return 0;
  
  const locked = isLocked(m);
  if (!locked) return 0; // Spiel läuft noch nicht
  
  // Wenn das Spiel vom Backend abgerechnet wurde, hat das Backend das letzte Wort
  if (isFinished(m.status) && b.points_awarded !== null && b.points_awarded !== undefined) {
     return b.points_awarded;
  }

  const mh = getFinalScore(m, 'home');
  const ma = getFinalScore(m, 'away');
  if (mh === null || ma === null) return 0; // Kein Zwischenstand vorhanden

  const bh = b.home_score;
  const ba = b.away_score;
  let pts = 0;

  if (mh === bh && ma === ba) pts += 3;
  else if (mh - ma === bh - ba) pts += 2;
  else if ((mh > ma && bh > ba) || (mh < ma && bh < ba)) pts += 1;

  if (m.first_goalscorer_id && b.first_goalscorer_id === m.first_goalscorer_id) {
    pts += 1;
  }
  
  return pts;
}

function jumpToMatch(phase, matchId) {
  goTo('tippen');
  if (S.bettingPhase !== phase) setBettingPhase(phase);
  setTimeout(() => {
    const el = $(`match-card-${matchId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function focusNextMatchInput(currentMatchId) {
  const inputs = Array.from(document.querySelectorAll('input[id^="h-"]'));
  const currentIndex = inputs.findIndex(inp => inp.id === `h-${currentMatchId}`);
  if (currentIndex >= 0 && currentIndex < inputs.length - 1) {
    const nextInput = inputs[currentIndex + 1];
    if (!nextInput.disabled) {
      setTimeout(() => {
        nextInput.focus();
        nextInput.closest('[id^="match-card-"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 50);
    }
  }
}

function togglePw() {
  const inp = $('inp-password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// ──────────────────────────────────────────
// AUTH
// ──────────────────────────────────────────
function switchTab(mode) {
  S.authMode = mode;
  $('tab-login').className    = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${mode==='login'    ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'}`;
  $('tab-register').className = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${mode==='register' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'}`;
  $('name-field').classList.toggle('hidden', mode !== 'register');
  $('auth-btn').textContent = mode === 'login' ? 'Anmelden' : 'Registrieren';
  $('auth-error').classList.add('hidden');
  $('auth-success').classList.add('hidden');
}

async function handleAuth() {
  const email = $('inp-email').value.trim();
  const pw    = $('inp-password').value;
  const name  = $('inp-name').value.trim();
  const btn   = $('auth-btn');
  const errEl = $('auth-error');
  const okEl  = $('auth-success');

  errEl.classList.add('hidden');
  okEl.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner spinner-white w-5 h-5"></div>`;
  
  try {
    if (S.authMode === 'login') {
      const { error } = await db.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    } else {
      if (!name) throw new Error('Bitte gib einen Anzeigenamen ein.');
      const { error } = await db.auth.signUp({ email, password: pw, options: { data: { display_name: name } } });
      if (error) throw error;
      okEl.textContent = '✓ Konto erstellt! (Bitte E-Mail bestätigen, falls in Supabase aktiviert)';
      okEl.classList.remove('hidden');
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  } finally {
    if (S.authMode === 'login') btn.textContent = 'Anmelden';
    else btn.textContent = 'Registrieren';
    btn.disabled = false;
  }
}

// ──────────────────────────────────────────
// DATA FETCHING
// ──────────────────────────────────────────
async function triggerSoftRefresh() {
  const btn = $('btn-refresh');
  if (btn) btn.classList.add('animate-spin');
  await fetchData(false);
  if (btn) btn.classList.remove('animate-spin');
}

async function fetchData(showLoadingState = true) {
  if (showLoadingState) loading($('main'));

  try {
    const [matchRes, betRes, profRes, teamsRes, rankRes] = await Promise.all([
      db.from('matches').select('*, home_team:teams!home_team_id(id,name,flag_url), away_team:teams!away_team_id(id,name,flag_url), first_goalscorer:players!first_goalscorer_id(id,name)').order('kickoff_time', { ascending: true }),
      db.from('bets').select('*, goalscorer:players!first_goalscorer_id(id,name)').eq('user_id', S.user.id),
      db.from('profiles').select('id,display_name'),
      db.from('teams').select('*').order('name', { ascending: true }),
      db.from('user_rankings').select('*')
    ]);

    if (matchRes.error) throw matchRes.error;
    if (betRes.error) throw betRes.error;
    if (profRes.error) throw profRes.error;
    if (teamsRes.error) throw teamsRes.error;
    if (rankRes.error) throw rankRes.error;

    S.matches     = matchRes.data || [];
    S.teams       = teamsRes.data || [];
    S.bets = {};
    (betRes.data || []).forEach(b => { S.bets[b.match_id] = b; });

    // Leaderboard aus Profiles und User_Rankings mergen
    const profiles = profRes.data || [];
    const rankings = rankRes.data || [];
    
    S.leaderboard = profiles.map(p => {
      const r = rankings.find(x => x.user_id === p.id);
      return {
        id: p.id,
        display_name: p.display_name,
        total_points: r && r.total_points !== null ? Number(r.total_points) : 0,
        total_bets: r ? Number(r.total_bets) : 0
      };
    }).sort((a, b) => b.total_points - a.total_points);

    // Live-Punkte Injektion
    const liveMatches = S.matches.filter(m => isLocked(m) && !isFinished(m.status));
    const livePointsMap = {}; 

    if (liveMatches.length > 0) {
      const liveMatchIds = liveMatches.map(m => m.id);
      const { data: liveBets } = await db.from('bets').select('user_id, match_id, home_score, away_score, first_goalscorer_id').in('match_id', liveMatchIds);
      
      (liveBets || []).forEach(b => {
        const m = S.matches.find(x => x.id === b.match_id);
        const pts = calcBetPoints(m, b);
        if (pts > 0) livePointsMap[b.user_id] = (livePointsMap[b.user_id] || 0) + pts;
      });
    }

    S.liveLeaderboard = S.leaderboard.map(p => ({
        ...p,
        total_points: (p.total_points || 0) + (livePointsMap[p.id] || 0)
    })).sort((a, b) => b.total_points - a.total_points);

    const ph = phases();
    if (!S.bettingPhase  || !ph.includes(S.bettingPhase))  S.bettingPhase  = ph[0];
    if (!S.overviewPhase || !ph.includes(S.overviewPhase)) S.overviewPhase = ph[0];

    renderView();
  } catch (err) {
    if (showLoadingState) $('main').innerHTML = `<div class="p-5 text-center"><p class="text-red-500 font-bold mb-2">Fehler beim Laden</p><p class="text-sm text-slate-500">${err.message}</p></div>`;
    else showToast('Fehler beim Aktualisieren', 'error');
  }
}

function goTo(view) {
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  renderView();
}

function renderView() {
  const main = $('main');
  switch (S.view) {
    case 'dashboard':  renderDashboard(main); break;
    case 'tippen':     renderBetting(main); break;
    case 'uebersicht': renderOverviewShell(main); loadOverviewData(); break;
    case 'tabelle':    renderTabelleShell(main); loadTabelleData('total'); break;
    case 'profil':     renderProfile(main); break;
  }
}

function renderDashboard(main) {
  const me    = S.liveLeaderboard.find(p => p.id === S.user.id);
  const rank  = (S.liveLeaderboard.findIndex(p => p.id === S.user.id) + 1) || '–';
  const pts   = me?.total_points ?? 0;
  const total = S.liveLeaderboard.length;
  const now  = new Date();
  
  let activeMatches = S.matches.filter(m => isLocked(m) && !isFinished(m.status));
  const hasLiveMatches = activeMatches.length > 0;

  if (!hasLiveMatches) {
    const upcoming = S.matches.filter(m => !isLocked(m));
    if (upcoming.length > 0) {
      const nextTime = upcoming[0].kickoff_time;
      activeMatches = upcoming.filter(m => m.kickoff_time === nextTime);
    }
  }

  // Find the first untipped match where score OR scorer is missing
  const nextUntipped = S.matches.find(m => {
    if (isLocked(m)) return false;
    const b = S.bets[m.id];
    if (!b) return true;
    if (b.home_score === null || b.home_score === undefined || b.home_score === '') return true;
    if (b.away_score === null || b.away_score === undefined || b.away_score === '') return true;
    // Wenn first_goalscorer_id null ist und der Name nicht "Kein Torschütze" lautet, fehlt der Torschütze
    if (b.first_goalscorer_id === null && (!b.goalscorer || b.goalscorer.name !== 'Kein Torschütze')) return true;
    return false;
  });

  let warningHtml = '';
  if (nextUntipped && !activeMatches.find(m => m.id === nextUntipped.id)) {
    const diffMs = new Date(nextUntipped.kickoff_time) - now;
    let countdownStr = '';
    if (diffMs > 0) {
      const d = Math.floor(diffMs / 86400000);
      const h = Math.floor((diffMs % 86400000) / 3600000);
      const m = Math.floor((diffMs % 3600000) / 60000);
      if (d > 0) countdownStr = `In: ${String(d).padStart(2, '0')}:${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      else countdownStr = `In: ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    } else {
      countdownStr = `Jetzt`;
    }

    warningHtml = `
      <div class="bg-white border border-slate-100 p-4 rounded-3xl shadow-sm flex items-center justify-between gap-4">
        <div>
          <h4 class="font-extrabold text-slate-800 text-sm">Nächster offener Tipp</h4>
          <p class="text-xs text-slate-500 font-medium mt-0.5">${countdownStr} &nbsp;·&nbsp; ${nextUntipped.home_team?.name} - ${nextUntipped.away_team?.name}</p>
        </div>
        <button onclick="jumpToMatch('${nextUntipped.phase}', ${nextUntipped.id})" class="bg-slate-900 text-white font-bold text-xs px-4 py-2.5 rounded-xl shrink-0 active:scale-95 transition">Tippen</button>
      </div>`;
  }

  let nextHtml = '';
  if (activeMatches.length > 0) {
    const isLiveGroup = hasLiveMatches;
    const cardTitle = activeMatches.length > 1 ? 'Nächste Spiele' : 'Nächstes Spiel';
    
    const matchRows = activeMatches.map(m => {
      const bet = S.bets[m.id];
      const isCurrentlyLive = isLocked(m) && !isFinished(m.status);
      
      const scorerHtml = m.first_goalscorer ? `<div class="text-[9px] text-slate-500 mt-1 font-bold">⚽ ${m.first_goalscorer.name}</div>` : '';
      const displayScore = isCurrentlyLive 
        ? `<div class="text-red-500 font-extrabold">${m.home_score ?? 0}:${m.away_score ?? 0}</div><div class="text-[9px] text-red-500 uppercase animate-pulse leading-none mt-1">Live</div>${scorerHtml}`
        : formatRelativeDate(m.kickoff_time);

      let action = '';
      if (!bet && !isLocked(m)) {
        action = `<button onclick="jumpToMatch('${m.phase}', ${m.id})" class="w-full mt-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm active:scale-95 transition">Jetzt tippen</button>`;
      } else if (bet) {
        action = `<div class="mt-3 bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-100 flex justify-between items-center">
          <div class="font-extrabold text-lg tracking-tight">${bet.home_score ?? ''}:${bet.away_score ?? ''}</div>
          <div class="text-slate-500 text-xs text-right leading-tight font-medium w-3/4 truncate">⚽ ${bet.goalscorer?.name || 'Kein Torschütze'}</div>
        </div>`;
        if (!isLocked(m)) {
            action += `<button onclick="jumpToMatch('${m.phase}', ${m.id})" class="mt-2 w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 rounded-xl text-xs transition">Tipp ändern</button>`;
        }
      }

      return `

            <div class="w-1/3 flex flex-col items-center text-center space-y-1.5">${flag(m.home_team)}<div class="text-xs font-bold text-slate-600 truncate w-full">${m.home_team?.name || 'Heim'}</div></div>

    }).join('');

    nextHtml = `
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-extrabold text-slate-800 tracking-tight">${isLiveGroup ? '<span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>Live Matches</span>' : cardTitle}</h3>
        </div>
        ${matchRows}
      </div>`;
  }

  const lbRows = S.liveLeaderboard.map((p, i) => {
    const isMe   = p.id === S.user.id;

    return `<div class="flex justify-between items-center px-3 py-2.5 rounded-xl ${isMe ? 'bg-blue-50 ring-1 ring-blue-200' : 'hover:bg-slate-50'} transition">
      <div class="flex items-center gap-3">
        <div class="w-6 text-center text-base leading-none">${medal}</div>
        <div class="font-semibold text-sm ${isMe ? 'text-blue-700' : 'text-slate-700'}">${p.display_name || '?'}</div>
      </div>
      <div class="font-extrabold text-sm mono">${p.total_points ?? 0} <span class="text-xs font-normal text-slate-400">Pkt</span></div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="p-4 space-y-5 max-w-lg mx-auto fade-up">
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
          <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Deine Platzierung</p>
          <div class="text-4xl font-extrabold tracking-tight text-slate-900">Platz ${rank} <span class="text-xl font-semibold text-slate-300">/ ${total}</span></div>
        </div>
        <div class="text-right">
          <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Punkte</p>
          <p class="text-4xl font-extrabold tracking-tight text-slate-900">${pts}</p>
        </div>
      </div>
      
      ${warningHtml}
      ${nextHtml}
      
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
        <h3 class="font-extrabold text-slate-800 tracking-tight mb-4">Gesamtwertung</h3>
        <div class="space-y-1">${lbRows || '<p class="text-center text-slate-400 text-sm py-4">Noch keine Spieler.</p>'}</div>
      </div>
    </div>`;

              ? `<span class="text-emerald-600 font-bold">${bet.goalscorer?.name || 'Kein Torschütze'}</span>`

          <span class="text-xs font-bold text-slate-400 mono">${fmtDate(m.kickoff_time)}</span>${badge}

              <div class="text-4xl font-extrabold ${isLive ? 'text-red-500' : 'text-slate-900'} mono tracking-wider">${finalH}:${finalA}</div>

          </div>

            <div class="text-xs text-slate-400 font-bold uppercase tracking-wide mb-2">Dein Tipp</div>

          </button>
        </div>
      </div>
    </div>`;
}

async function triggerAutoSave(matchId) {
  const hVal = $(`h-${matchId}`)?.value;
  const aVal = $(`a-${matchId}`)?.value;
  if (hVal === '' || aVal === '' || hVal === undefined || aVal === undefined) return;
  await performSave(matchId, parseInt(hVal), parseInt(aVal));
}

async function performSave(matchId, h, a) {
  const pending  = S.pendingScorer[matchId];
  const existing = S.bets[matchId];
  const scorerId = pending !== undefined ? (pending.id ?? null) : (existing?.first_goalscorer_id ?? null);
  
  if (existing && existing.home_score === h && existing.away_score === a && existing.first_goalscorer_id === scorerId) return;

  const backup = existing ? { ...existing } : null;
  const newBet = {
    id: existing?.id || crypto.randomUUID(),
    user_id: S.user.id,
    match_id: matchId,
    home_score: h,
    away_score: a,
    first_goalscorer_id: scorerId,
    goalscorer: pending !== undefined ? { name: pending.name } : existing?.goalscorer
  };
  S.bets[matchId] = newBet;
  
  const btn = $(`sb-${matchId}`);
  if (btn) btn.classList.add('opacity-50');

  try {
    if (backup) {
      const { error } = await db.from('bets').update({ home_score: h, away_score: a, first_goalscorer_id: scorerId, updated_at: new Date().toISOString() }).eq('id', backup.id);
      if (error) throw error;
    } else {
      const { error } = await db.from('bets').insert({ id: newBet.id, user_id: S.user.id, match_id: matchId, home_score: h, away_score: a, first_goalscorer_id: scorerId });
      if (error) throw error;
    }
    
    delete S.pendingScorer[matchId];
    if (btn) btn.classList.remove('opacity-50');
    showToast('Tipp gespeichert');
  } catch (e) {
    if (backup) S.bets[matchId] = backup;
    else delete S.bets[matchId];
    
    renderBettingContent(); 
    showToast('Fehler beim Speichern', 'error');
  }
}

async function openScorer(matchId) {
  $('modal-scorer').classList.remove('hidden');
  const list = $('scorer-list');
  list.innerHTML = scorerSkeleton();

  const m = S.matches.find(x => x.id === matchId);
  if (!m) return;

  const { data: lineups } = await db.from('match_lineups').select('player_id').eq('match_id', matchId);
  const lineupPlayerIds = new Set((lineups || []).map(l => l.player_id));

  const { data: players, error } = await db.from('players')
    .select('id,name,position,tournament_goals,team_id')
    .in('team_id', [m.home_team_id, m.away_team_id]);

  if (error) { list.innerHTML = `<p class="text-red-500 text-sm text-center">${error.message}</p>`; return; }

  const posMap = { 'Goalkeeper': 'TW', 'Defender': 'ABW', 'Midfielder': 'MF', 'Attacker': 'ST' };
  const posWeight = { 'Attacker': 1, 'Midfielder': 2, 'Defender': 3, 'Goalkeeper': 4 };

  (players || []).sort((a, b) => {
    const aStart = lineupPlayerIds.has(a.id);
    const bStart = lineupPlayerIds.has(b.id);
    if (aStart !== bStart) return aStart ? -1 : 1;

    const aGoals = a.tournament_goals || 0;
    const bGoals = b.tournament_goals || 0;
    if (aGoals !== bGoals) return bGoals - aGoals;

    const wA = posWeight[a.position] || 99; 
    const wB = posWeight[b.position] || 99;
    if (wA !== wB) return wA - wB;

    return a.name.localeCompare(b.name);
  });

  const homePlayers = (players || []).filter(p => p.team_id === m.home_team_id);
  const awayPlayers = (players || []).filter(p => p.team_id === m.away_team_id);

  (players || []).forEach(p => { S.playerCache[p.id] = p; });

  const renderPlayer = (p) => {
    const isStarter = lineupPlayerIds.has(p.id);
    const posText = posMap[p.position] || p.position || '?';
    const goalsBadge = (p.tournament_goals > 0) ? `<span class="ml-auto text-[9px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-extrabold shadow-sm">${p.tournament_goals} ⚽</span>` : '';
    const starterDot = isStarter ? `<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full shadow-sm"></span>` : '';

    return `
      <button onclick="pickScorer(${matchId}, ${p.id})" class="relative w-full text-left px-2.5 py-2 rounded-xl border transition flex flex-col gap-0.5 ${isStarter ? 'bg-white border-blue-200 shadow-sm' : 'bg-slate-50/50 border-slate-100 hover:bg-slate-50'}">
        ${starterDot}
        <span class="font-${isStarter?'bold':'medium'} text-slate-${isStarter?'900':'600'} text-[11px] truncate w-full">${p.name}</span>
        <div class="flex items-center w-full mt-0.5 h-4">
          <span class="text-[9px] font-extrabold text-slate-400 tracking-wider">${posText}</span>
          ${goalsBadge}
        </div>
      </button>`;
  };

  list.innerHTML = `
    <button onclick="pickScorer(${matchId}, null)" class="w-full text-center px-4 py-3 rounded-2xl border-2 border-dashed border-slate-200 hover:border-slate-300 font-bold text-slate-500 active:bg-slate-50 transition text-sm mb-4 bg-white">
      🚫 &nbsp;Kein Torschütze (0:0)
    </button>
    <div class="grid grid-cols-2 gap-3 items-start">
      <div class="space-y-2">
        <div class="flex items-center justify-center gap-2 pb-2 mb-2 border-b-2 border-slate-200">
          ${flag(m.home_team, 'w-5 h-4')}
          <span class="font-extrabold text-[11px] uppercase tracking-wide truncate text-slate-800">${m.home_team?.name || 'Heim'}</span>
        </div>
        <div class="space-y-2">
          ${homePlayers.length ? homePlayers.map(renderPlayer).join('') : '<p class="text-[10px] text-slate-400 text-center py-2">Keine Spieler</p>'}
        </div>
      </div>
      <div class="space-y-2">
        <div class="flex items-center justify-center gap-2 pb-2 mb-2 border-b-2 border-slate-200">
          ${flag(m.away_team, 'w-5 h-4')}
          <span class="font-extrabold text-[11px] uppercase tracking-wide truncate text-slate-800">${m.away_team?.name || 'Gast'}</span>
        </div>
        <div class="space-y-2">
          ${awayPlayers.length ? awayPlayers.map(renderPlayer).join('') : '<p class="text-[10px] text-slate-400 text-center py-2">Keine Spieler</p>'}

async function renderBonusOverview(cards) {
  const [qRes, bRes] = await Promise.all([
    db.from('extra_questions').select('*').order('deadline', { ascending: true }),
    db.from('extra_bets').select('*')
  ]);

  if (qRes.error) { cards.innerHTML = `<p class="p-4 text-red-500">${qRes.error.message}</p>`; return; }
  
  const questions = qRes.data || [];
  if (!questions.length) { cards.innerHTML = '<p class="text-center text-slate-400 mt-12 font-medium">Keine Bonusfragen verfügbar.</p>'; return; }

  const byQ = {};
  (bRes.data || []).forEach(b => { (byQ[b.question_id] ??= []).push(b); });

  cards.innerHTML = questions.map(q => {
    const locked = new Date(q.deadline) <= new Date();
    const qBets = byQ[q.id] || [];
    
    let displayRows = S.leaderboard.map(player => {
      return { player, bet: qBets.find(x => x.user_id === player.id) };
    });

    displayRows.sort((a, b) => {
      if (a.player.id === S.user.id) return -1;
      if (b.player.id === S.user.id) return 1;
      
      if (locked) {
        const ptA = a.bet?.points_awarded || 0;
        const ptB = b.bet?.points_awarded || 0;
        if (ptA !== ptB) return ptB - ptA;
      } else {
        const aHasBet = !!a.bet;
        const bHasBet = !!b.bet;
        if (aHasBet && !bHasBet) return -1;
        if (!aHasBet && bHasBet) return 1;
      }
      return a.player.display_name.localeCompare(b.player.display_name);
    });

    const rows = displayRows.map(({ player, bet }) => {
      const isMe = player.id === S.user.id;
      const show = locked || isMe;
      
      let ans = '-';
      let ptHtml = '';

      if (bet) {
        if (!show) {
          ans = '<span class="text-slate-400 font-medium">Verdeckt</span>';
        } else {
          ans = bet.bet_value || '-';
          if (q.answer_type === 'teams') {
            const t = S.teams.find(x => x.name === bet.bet_value);
            if (t && t.flag_url && !t.flag_url.startsWith('http') && !t.flag_url.startsWith('/')) {
              ans = `${t.flag_url} ${bet.bet_value}`;
            }
          }
          ptHtml = locked ? `<span class="font-bold ${(bet.points_awarded || 0) > 0 ? 'text-blue-500' : 'text-slate-500'}">${bet.points_awarded ?? 0}</span>` : '';
        }
      } else {
        ans = '<span class="text-slate-300">-</span>';
        if (locked) ptHtml = '<span class="text-slate-300">0</span>';
      }

      return `<div class="flex items-center px-3 py-2 text-[11px] sm:text-xs border-b border-slate-50 last:border-0 ${isMe ? 'bg-blue-50/60' : 'hover:bg-slate-50'}">
        <span class="w-[35%] truncate font-${isMe?'bold text-blue-700':'semibold text-slate-700'} pr-1">${player.display_name||'?'}</span>
        <span class="w-[50%] truncate pl-1 text-slate-800 font-medium">${ans}</span>
        <span class="w-[15%] text-right">${ptHtml}</span>
      </div>`;
    }).join('');

    let headerRight = '';
    if (locked) {
       headerRight = q.correct_answer 
         ? `<span class="text-[10px] text-emerald-400 font-bold truncate">Lösung: ${q.correct_answer}</span>` 
         : `<span class="text-[10px] text-slate-400 font-medium">Ausstehend</span>`;
    } else {
       headerRight = `<div class="text-[10px] font-bold mono bg-slate-900 px-2 py-1 rounded-md border border-slate-700 whitespace-nowrap shrink-0">Frist: ${fmtDate(q.deadline)}</div>`;
    }

    return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="bg-slate-800 text-white px-3 py-2 flex justify-between items-center gap-2">
        <div class="font-bold text-[11px] sm:text-xs truncate">${q.question_text}</div>
        <div class="flex items-center justify-end shrink-0">${headerRight}</div>
      </div>
      <div class="flex flex-col">${rows}</div>
    </div>`;
  }).join('');
}

async function loadOverviewData() {
  const cards = $('ov-cards');
  if (!cards) return;
  loading(cards);

  if (S.overviewPhase === 'Bonusfragen') {
    return renderBonusOverview(cards);
  }

  const phaseMatches = S.matches.filter(m => m.phase === S.overviewPhase);
  if (!phaseMatches.length) { cards.innerHTML = '<p class="text-center text-slate-400 mt-12 font-medium">Keine Spiele in dieser Phase.</p>'; return; }

  const { data: allBets, error } = await db.from('bets').select(`*, goalscorer:players!first_goalscorer_id(id,name)`).in('match_id', phaseMatches.map(m => m.id));
  if (error) { cards.innerHTML = `<p class="text-red-500 text-sm p-4 text-center">${error.message}</p>`; return; }

  const byMatch = {};
  (allBets || []).forEach(b => { (byMatch[b.match_id] ??= []).push(b); });

  cards.innerHTML = phaseMatches.map(m => {
    const locked = isLocked(m);
    const isLive = locked && !isFinished(m.status);
    const fnH = getFinalScore(m, 'home'), fnA = getFinalScore(m, 'away');
    const ext = m.home_score_extratime !== null ? ' n.V.' : '';
    
    // Anpassung: Datum/Uhrzeit oder "Heute"/"Morgen" anzeigen
    let statusHtml = '';
    if (isFinished(m.status)) {
      statusHtml = `<span class="mono">${fnH}:${fnA}${ext}</span>`;
    } else if (isLive) {
      statusHtml = `<span class="text-red-400 animate-pulse font-extrabold">LIVE ${fnH??0}:${fnA??0}</span>`;
    } else {
      statusHtml = formatRelativeDate(m.kickoff_time); // Rendert "Heute 15:00" oder "12.06. 15:00"
    }

    // Anpassung: Echten ersten Torschützen in den Header holen
    let actualScorerHeader = '';
    if (locked && m.first_goalscorer) {
       actualScorerHeader = `<span class="text-[10px] text-emerald-400 font-bold truncate">⚽ ${m.first_goalscorer.name}</span>`;
    } else if (locked && isFinished(m.status) && !m.first_goalscorer_id) {
       actualScorerHeader = `<span class="text-[10px] text-slate-400 font-medium">⚽ Keiner</span>`;
    }

    const matchBets = byMatch[m.id] || [];
    matchBets.forEach(b => b._pts = calcBetPoints(m, b));

    let displayRows = S.leaderboard.map(player => {
      const b = matchBets.find(x => x.user_id === player.id);
      return { player, bet: b, pts: b ? b._pts : 0 };
    });

    // Anpassung: Erweiterte Sortierungslogik
    if (locked) {
      displayRows.sort((a, b) => b.pts - a.pts); // Nach Punkten sortieren wenn gesperrt
    } else {
      // Wenn das Spiel noch nicht gestartet ist
      displayRows.sort((a, b) => {
        if (a.player.id === S.user.id) return -1; // Ich stehe immer ganz oben
        if (b.player.id === S.user.id) return 1;
        
        const aHasBet = !!a.bet;
        const bHasBet = !!b.bet;
        
        if (aHasBet && !bHasBet) return -1; // Leute die getippt haben vor denen, die nicht getippt haben
        if (!aHasBet && bHasBet) return 1;
        
        return a.player.display_name.localeCompare(b.player.display_name); // Alphabetisch für den Rest
      });
    }

    const rows = displayRows.map(({ player, bet, pts }) => {
      const isMe = player.id === S.user.id;
      const show = locked || isMe;
      
      let bh = '-';
      let ba = '-';
      let scorerHtml = '';
      let ptHtml = '';

      // Anpassung: Für die einzeilige Tabelle die Texte kürzen ("Verdeckt" statt "Tipp verdeckt", "Keiner" etc.)
      if (bet) {
        if (!show) {
          bh = '?'; ba = '?';
          scorerHtml = '<span class="text-slate-400 font-medium">???</span>';
        } else {
          bh = bet.home_score ?? '?';
          ba = bet.away_score ?? '?';
          ptHtml = locked ? `<span class="font-bold ${isLive ? 'text-blue-500' : 'text-slate-500'}">${pts}</span>` : '';
          
          if (m.first_goalscorer_id && locked) {
            scorerHtml = bet.first_goalscorer_id === m.first_goalscorer_id
              ? `<span class="text-emerald-600 font-bold">⚽ ${bet.goalscorer?.name || 'Keiner'}</span>`
              : `<span class="text-red-500">⚽ ${bet.goalscorer?.name || 'Keiner'}</span>`;
          } else {
            scorerHtml = `<span class="text-slate-600">⚽ ${bet.goalscorer?.name || 'Keiner'}</span>`;
          }
        }
      } else {
        bh = '-'; ba = '-';
        scorerHtml = '<span class="text-slate-300">-</span>';
        if (locked) ptHtml = '<span class="text-slate-300">0</span>';
      }

      // Anpassung: Kompaktes, einzeiliges Flex-Layout mit Prozentualen Breiten
      return `<div class="flex items-center px-3 py-2 text-[11px] sm:text-xs border-b border-slate-50 last:border-0 ${isMe ? 'bg-blue-50/60' : 'hover:bg-slate-50'}">
        <span class="w-[30%] truncate font-${isMe?'bold text-blue-700':'semibold text-slate-700'} pr-1">${player.display_name||'?'}</span>
        <span class="w-[15%] text-center font-extrabold mono text-slate-900">${bh}:${ba}</span>
        <span class="w-[45%] truncate pl-1">${scorerHtml}</span>
        <span class="w-[10%] text-right">${ptHtml}</span>
      </div>`;
    }).join('');

    const hn = (m.home_team?.name || 'HM').substring(0,3).toUpperCase();
    const an = (m.away_team?.name || 'GS').substring(0,3).toUpperCase();
    const hFlag = flag(m.home_team, 'w-4 h-3 rounded-[2px] shadow-sm');
    const aFlag = flag(m.away_team, 'w-4 h-3 rounded-[2px] shadow-sm');

    return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="bg-slate-800 text-white px-3 py-2 flex justify-between items-center gap-2">
        <div class="font-bold text-[11px] sm:text-xs flex items-center gap-1.5 shrink-0">${hFlag} <span>${hn}-${an}</span> ${aFlag}</div>
        <div class="flex items-center gap-2 overflow-hidden justify-end">
          ${actualScorerHeader}
          <div class="text-[10px] font-bold mono bg-slate-900 px-2 py-1 rounded-md border border-slate-700 whitespace-nowrap shrink-0">${statusHtml}</div>
        </div>
      </div>
      <div class="flex flex-col">${rows}</div>
    </div>`;
  }).join('');
}

async function loadTabelleData(filterType) {
  const container = $('table-content');
  if (!container) return;
  container.innerHTML = `<div class="flex justify-center py-12"><div class="spinner w-6 h-6"></div></div>`;

  if (!S.allBetsCache && filterType !== 'total') {
    // Hole alle abgerechneten ODER laufenden Spiele (kickoff <= now)
    const { data, error } = await db.from('bets')
      .select('user_id, home_score, away_score, first_goalscorer_id, points_awarded, match:matches!inner(id, phase, home_score, away_score, home_score_extratime, away_score_extratime, status, kickoff_time, first_goalscorer_id)')
      .lte('match.kickoff_time', new Date().toISOString());
      
    if (error) { container.innerHTML = `<p class="text-red-500 text-sm">${error.message}</p>`; return; }
    S.allBetsCache = data || [];
  }

  let ranked = [];

  if (filterType === 'total') {
    ranked = S.liveLeaderboard.map(p => ({ id: p.id, display_name: p.display_name, value: p.total_points ?? 0 }));
  } else {
    const scores = {};
    S.leaderboard.forEach(p => scores[p.id] = { name: p.display_name, val: 0 });

    S.allBetsCache.forEach(b => {
      if (!scores[b.user_id]) return;
      const m = b.match;
      const finalH = m.home_score_extratime !== null ? m.home_score_extratime : m.home_score;
      const finalA = m.away_score_extratime !== null ? m.away_score_extratime : m.away_score;
      
      const pts = calcBetPoints(m, b);

      if (filterType === 'exact') {
        if (finalH !== null && b.home_score === finalH && b.away_score === finalA) scores[b.user_id].val++;
      } 
      else if (filterType === 'trend') {
        const isExact = b.home_score === finalH && b.away_score === finalA;
        if (!isExact && finalH !== null) {
          const betDiff = b.home_score - b.away_score;
          const matchDiff = finalH - finalA;
          if ((betDiff > 0 && matchDiff > 0) || (betDiff < 0 && matchDiff < 0) || (betDiff === 0 && matchDiff === 0)) {
            scores[b.user_id].val++;
          }
        }
      } 
      else if (filterType.startsWith('phase_')) {
        const targetPhase = filterType.replace('phase_', '');
        if (m.phase === targetPhase) scores[b.user_id].val += pts;
      }
    });

    ranked = Object.keys(scores).map(id => ({ id, display_name: scores[id].name, value: scores[id].val }));
    ranked.sort((a, b) => b.value - a.value);
  }

  const unit = filterType === 'total' || filterType.startsWith('phase_') ? 'Pkt' : 'x';

  container.innerHTML = `<div class="space-y-1">` + ranked.map((p, i) => {
    const isMe = p.id === S.user.id;
    const rankNum = i + 1;
    const medal = rankNum === 1 ? '🥇' : rankNum === 2 ? '🥈' : rankNum === 3 ? '🥉' : `<span class="font-bold text-slate-400 text-sm">${rankNum}.</span>`;
    
    return `<div class="flex justify-between items-center px-3 py-2.5 rounded-xl ${isMe ? 'bg-blue-50 ring-1 ring-blue-200' : 'hover:bg-slate-50'} transition">
      <div class="flex items-center gap-3">
        <div class="w-6 text-center text-base leading-none">${medal}</div>
        <div class="font-semibold text-sm ${isMe ? 'text-blue-700' : 'text-slate-700'}">${p.display_name || '?'}</div>
      </div>
      <div class="font-extrabold text-sm mono">${p.value} <span class="text-xs font-normal text-slate-400">${unit}</span></div>
    </div>`;
  }).join('') + (ranked.length === 0 ? '<p class="text-center text-sm text-slate-400 py-4">Keine Daten verfügbar.</p>' : '') + `</div>`;
}

async function renderBonusInsideBetting(container) {
  container.innerHTML = `<div class="flex justify-center py-12"><div class="spinner w-6 h-6"></div></div>`;
  
  const [qRes, bRes] = await Promise.all([
    db.from('extra_questions').select('*').order('deadline', { ascending: true }),
    db.from('extra_bets').select('*').eq('user_id', S.user.id)
  ]);

  if (qRes.error) { container.innerHTML = `<p class="p-4 text-red-500">${qRes.error.message}</p>`; return; }
  const questions = qRes.data || [];
  
  if (!questions.length) {
    container.innerHTML = `<p class="text-slate-400 bg-white p-5 rounded-2xl border border-slate-100 text-center shadow-sm">Derzeit keine Bonusfragen verfügbar.</p>`;
    return;
  }

  const betsMap = {};
  (bRes.data || []).forEach(b => betsMap[b.question_id] = b);

  const html = questions.map(q => {
    const locked = new Date(q.deadline) <= new Date();
    const myBet  = betsMap[q.id]?.bet_value || '';
    const ptsAw  = betsMap[q.id]?.points_awarded;
    
    let inputHtml = '';
    
    if (q.answer_type === 'teams') {
      const opts = S.teams.map(t => {
        // Native Dropdowns unterstützen keine Bilder. Wenn Flagge ein Emoji ist, zeigen, sonst weglassen.
        const flagPrefix = (!t.flag_url || t.flag_url.startsWith('http') || t.flag_url.startsWith('/')) ? '' : t.flag_url + ' ';
        const sel = myBet === t.name ? 'selected' : '';
        return `<option value="${t.name}" ${sel}>${flagPrefix}${t.name}</option>`;
      }).join('');
      
      inputHtml = `<select id="q-${q.id}" ${locked ? 'disabled' : ''} class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl bg-white outline-none focus:border-blue-400 transition text-sm font-semibold disabled:bg-slate-50 disabled:opacity-60 shadow-sm">
        <option value="" disabled ${!myBet ? 'selected' : ''}>Bitte wählen...</option>
        ${opts}
      </select>`;
    } else {
      inputHtml = `<input id="q-${q.id}" type="text" value="${myBet}" placeholder="Deine Antwort..." ${locked ? 'disabled' : ''} class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl bg-white outline-none focus:border-blue-400 transition text-sm font-semibold disabled:bg-slate-50 disabled:opacity-60 shadow-sm" />`;
    }
    
    const badge = locked 
      ? (ptsAw !== null && ptsAw !== undefined ? `<span class="bg-slate-100 text-slate-500 text-xs font-extrabold px-3 py-1.5 rounded-full ml-3 shrink-0">${ptsAw} Pkt erreicht</span>` : `<span class="bg-red-50 text-red-500 text-xs font-extrabold px-3 py-1.5 rounded-full ml-3 shrink-0">Abgelaufen</span>`)
      : `<span class="bg-yellow-100 text-yellow-700 text-xs font-extrabold px-3 py-1.5 rounded-full shrink-0 ml-3">+${q.points} Pkt</span>`;

    return `
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-extrabold text-lg tracking-tight">${q.question_text}</h3>
            <p class="text-xs text-slate-400 mt-1">Frist: ${fmtDate(q.deadline)} ${fmtTime(q.deadline)}</p>
          </div>
          ${badge}
        </div>
        ${inputHtml}
        ${!locked ? `<button id="btn-q-${q.id}" onclick="saveBonus(${q.id})" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl active:scale-95 transition shadow-sm">Speichern</button>` : ''}
      </div>`;
  }).join('');

  container.innerHTML = html;
}

async function saveBonus(qId) {
  const val = $(`q-${qId}`).value.trim();
  if (!val) return alert('Bitte etwas eintragen!');
  
  const btn = $(`btn-q-${qId}`);
  btn.disabled = true; btn.innerHTML = `<div class="spinner spinner-white w-5 h-5"></div>`;
  
  try {
    const { data: existing } = await db.from('extra_bets').select('id').eq('user_id', S.user.id).eq('question_id', qId).maybeSingle();
    
    if (existing) {
      const { error } = await db.from('extra_bets').update({ bet_value: val }).eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await db.from('extra_bets').insert({ user_id: S.user.id, question_id: qId, bet_value: val });
      if (error) throw error;
    }
    btn.textContent = '✓ Gespeichert'; btn.style.background = '#10b981';
    setTimeout(() => { btn.textContent = 'Speichern'; btn.style.background = ''; btn.disabled=false; }, 2000);
  } catch (e) {
    alert(e.message); btn.textContent = 'Speichern'; btn.disabled=false;
  }
}

        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-extrabold text-white shrink-0" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">${initial}</div>
          <div><h3 class="font-extrabold text-xl tracking-tight">${p?.display_name || 'Spieler'}</h3><p class="text-sm text-slate-400">${S.user?.email || ''}</p></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100"><div class="text-3xl font-extrabold tracking-tight mono text-blue-600">${pts}</div><div class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wide">Punkte</div></div>
          <div class="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100"><div class="text-3xl font-extrabold tracking-tight mono text-blue-600">${rank}</div><div class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wide">Platz</div></div>
        </div>
        <button onclick="db.auth.signOut()" class="w-full py-3.5 px-4 text-center text-red-500 font-bold text-sm border-2 border-red-100 rounded-2xl bg-red-50 active:bg-red-100 transition">Abmelden</button>
      </div>
    </div>`;
}

// ──────────────────────────────────────────
// BOOT — auth state listener
// ──────────────────────────────────────────
async function handleSession(session) {
  S.user = session.user;

  let prof = null;
  for (let i = 0; i < 4; i++) {
    const { data } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (data) { prof = data; break; }
    await new Promise(r => setTimeout(r, 400));
  }
  S.profile = prof;

  $('auth-screen').classList.add('hidden');
  const app = $('app-screen');
  app.classList.remove('hidden'); app.classList.add('flex');
  $('header-user').textContent = `Hallo, ${(prof?.display_name || 'Du').split(' ')[0]} 👋`;

  goTo('dashboard');
  await fetchData();
}

function handleSignOut() {
  S.user = null; S.profile = null;
  $('auth-screen').classList.remove('hidden');
  const app = $('app-screen');
  app.classList.add('hidden'); app.classList.remove('flex');
}

async function initApp() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await handleSession(session);
  }

  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && S.user?.id !== session?.user?.id) {
      await handleSession(session);
    } else if (event === 'SIGNED_OUT') {
      handleSignOut();
    }
  });
}

initApp();
</script>
