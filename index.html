<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WM 2026 Tipprunde</title>
  
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  
  <style>
    * { font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .mono { font-family: 'DM Mono', monospace; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse-soft { 0%,100% { opacity:1; } 50% { opacity:.6; } }

    .spinner {
      display: inline-block; border-radius: 50%;
      border: 2.5px solid rgba(0,0,0,0.08);
      border-top-color: #3b82f6;
      animation: spin 0.7s linear infinite;
    }
    .spinner-white { border-color: rgba(255,255,255,0.25); border-top-color: white; }
    .fade-up { animation: fadeUp .2s ease both; }
    .pulse-badge { animation: pulse-soft 2s ease-in-out infinite; }

    /* Nav */
    .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; flex:1; height:100%; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:0.01em; transition:color .15s; }
    .nav-item.active { color:#2563eb; }
    .nav-item svg { width:20px; height:20px; }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    #auth-screen { background: radial-gradient(ellipse 80% 60% at 50% -10%, #1e3a5f 0%, #0f172a 60%); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900" style="height:100dvh; overflow:hidden;">

<!-- ═══════════════════════════════════════════
     TOAST CONTAINER
════════════════════════════════════════════ -->
<div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

<!-- ═══════════════════════════════════════════
     AUTH SCREEN
════════════════════════════════════════════ -->
<div id="auth-screen" class="fixed inset-0 flex items-center justify-center p-5 z-50">
  <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl fade-up">
    <div class="text-center mb-7">
      <div class="text-5xl mb-3 leading-none">🏆</div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">WM 2026 Tipprunde</h1>
      <p class="text-slate-400 text-sm mt-1 font-medium">Zeig was du drauf hast</p>
    </div>

    <div class="flex bg-slate-100 rounded-2xl p-1 mb-6 gap-1">
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-slate-900">Anmelden</button>
      <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400">Registrieren</button>
    </div>

    <div id="auth-error"   class="hidden text-red-700   text-sm p-3 rounded-xl mb-4 bg-red-50   border border-red-200"></div>
    <div id="auth-success" class="hidden text-green-700 text-sm p-3 rounded-xl mb-4 bg-green-50 border border-green-200"></div>

    <div class="space-y-3">
      <div id="name-field" class="hidden">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Anzeigename</label>
        <input id="inp-name" type="text" placeholder="Dein Name im Spiel" onkeydown="if(event.key==='Enter')handleAuth()" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition bg-slate-50" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">E-Mail</label>
        <input id="inp-email" type="email" placeholder="email@beispiel.de" onkeydown="if(event.key==='Enter')handleAuth()" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition bg-slate-50" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Passwort</label>
        <div class="relative">
          <input id="inp-password" type="password" placeholder="Mindestens 6 Zeichen" onkeydown="if(event.key==='Enter')handleAuth()" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition bg-slate-50 pr-10" />
          <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button id="auth-btn" onclick="handleAuth()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 mt-1">
        Anmelden
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     APP SHELL
════════════════════════════════════════════ -->
<div id="app-screen" class="hidden flex-col" style="height:100dvh;">
  <!-- Header -->
  <header class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shrink-0 border-b border-slate-800">

      <span class="text-yellow-400 text-xl">🏆</span> WM 2026
    </h1>
    <span id="header-user" class="text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 font-semibold text-slate-300"></span>
  </header>

  <!-- Main scroll area -->
  <main id="main" class="flex-1 overflow-y-auto" style="padding-bottom:5.5rem;"></main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex z-20" style="height:calc(3.75rem + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);">
    <button class="nav-item" data-view="dashboard"  onclick="goTo('dashboard')">

    </button>
    <button class="nav-item" data-view="uebersicht" onclick="goTo('uebersicht')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Übersicht
    </button>
    <button class="nav-item" data-view="bonus"      onclick="goTo('bonus')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Bonus
    </button>
    <button class="nav-item" data-view="profil"     onclick="goTo('profil')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Profil
    </button>
  </nav>
</div>

<!-- ═══════════════════════════════════════════
     GOALSCORER MODAL
════════════════════════════════════════════ -->
<div id="modal-scorer" class="hidden fixed inset-0 z-50 flex flex-col justify-end" style="background:rgba(15,23,42,0.7); backdrop-filter:blur(6px);">
  <div class="flex-1" onclick="closeScorer()"></div>
  <div class="bg-white rounded-t-3xl max-h-[82vh] flex flex-col w-full max-w-lg mx-auto shadow-2xl fade-up">

    <div id="scorer-list" class="overflow-y-auto p-4 space-y-4" style="padding-bottom: calc(1rem + env(safe-area-inset-bottom));">

</div>

<!-- ═══════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════ -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.error('Service Worker Registrierung fehlgeschlagen:', err));
  });
}

// ──────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────
const SUPABASE_URL      = 'https://kuzxrwzydddykliunhvg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1enhyd3p5ZGRkeWtsaXVuaHZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDE0OTMsImV4cCI6MjA5NTQxNzQ5M30.dnIGUpCh2DvPbVi8r-iCdHXKaIIBz_6lbSGTR_ys57U';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ──────────────────────────────────────────
// STATE
// ──────────────────────────────────────────
const S = {
  user:          null,
  profile:       null,
  matches:       [],
  bets:          {},
  leaderboard:   [],
  view:          'dashboard',
  bettingPhase:  null,
  overviewPhase: null,
  pendingScorer: {},
  playerCache:   {},
  authMode:      'login',
};

// ──────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────
const $  = id  => document.getElementById(id);

function showToast(msg, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  const bgClass = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
  toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold fade-up transition-opacity duration-300 flex items-center justify-center`;
  toast.innerHTML = type === 'success' ? `✓ &nbsp;${msg}` : `⚠ &nbsp;${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
}

function skeletonCard() {
  return `<div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 animate-pulse space-y-4">
    <div class="h-4 bg-slate-200 rounded w-1/3"></div>
    <div class="flex justify-between items-center"><div class="w-12 h-8 bg-slate-200 rounded"></div><div class="w-20 h-10 bg-slate-200 rounded"></div><div class="w-12 h-8 bg-slate-200 rounded"></div></div>
    <div class="h-12 bg-slate-200 rounded w-full"></div>
  </div>`;
}

function loading(el) { 
  el.innerHTML = `<div class="max-w-lg mx-auto p-4 space-y-4 fade-up">${skeletonCard()}${skeletonCard()}${skeletonCard()}</div>`; 
}

function flag(team, imgCls = 'w-8 h-6') {
  if (!team?.flag_url) return '<span class="text-2xl block mx-auto text-center">🏳️</span>';
  if (team.flag_url.startsWith('http') || team.flag_url.startsWith('/')) {
    return `<img src="${team.flag_url}" class="${imgCls} object-cover rounded-sm shadow-sm mx-auto" alt="${team.name}" />`;
  }
  return `<span class="text-3xl leading-none block mx-auto text-center">${team.flag_url}</span>`;
}

function fmtTime(ts) { return new Date(ts).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' }); }

function formatRelativeDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const tmrw = new Date(); tmrw.setDate(today.getDate() + 1);
  
  const time = fmtTime(ts);
  if (d.toDateString() === today.toDateString()) return 'Heute ' + time;
  if (d.toDateString() === tmrw.toDateString()) return 'Morgen ' + time;
  
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  return `${day}.${month}. ${time}`;
}

function isLocked(m) { return new Date(m.kickoff_time) <= new Date(); }
function phases()    { return [...new Set(S.matches.map(m => m.phase).filter(Boolean))]; }

function phaseTabs(activePhase, onclickFn) {
  return phases().map(p => `
    <button onclick="${onclickFn}('${p}')"
      class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-all
             ${p === activePhase ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">
      ${p}
    </button>`).join('');
}

// Result nach 120min präferieren (laut Kontext)
function getFinalScore(m, type) {
  if (type === 'home') return m.home_score_extratime !== null ? m.home_score_extratime : m.home_score;
  if (type === 'away') return m.away_score_extratime !== null ? m.away_score_extratime : m.away_score;
  return null;
}

function jumpToMatch(phase, matchId) {
  goTo('tippen');
  if (S.bettingPhase !== phase) setBettingPhase(phase);
  setTimeout(() => {
    const el = $(`match-card-${matchId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function togglePw() {
  const inp = $('inp-password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// ──────────────────────────────────────────
// AUTH
// ──────────────────────────────────────────
function switchTab(mode) {
  S.authMode = mode;
  $('tab-login').className    = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${mode==='login'    ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'}`;
  $('tab-register').className = `flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${mode==='register' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'}`;
  $('name-field').classList.toggle('hidden', mode !== 'register');
  $('auth-btn').textContent = mode === 'login' ? 'Anmelden' : 'Registrieren';
  $('auth-error').classList.add('hidden');
  $('auth-success').classList.add('hidden');
}

async function handleAuth() {
  const email = $('inp-email').value.trim();
  const pw    = $('inp-password').value;
  const name  = $('inp-name').value.trim();
  const btn   = $('auth-btn');
  const errEl = $('auth-error');
  const okEl  = $('auth-success');

  errEl.classList.add('hidden');
  okEl.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner spinner-white w-5 h-5"></div>`;
  
  try {
    if (S.authMode === 'login') {
      const { error } = await db.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    } else {
      if (!name) throw new Error('Bitte gib einen Anzeigenamen ein.');
      const { error } = await db.auth.signUp({ email, password: pw, options: { data: { display_name: name } } });
      if (error) throw error;
      okEl.textContent = '✓ Konto erstellt! (Bitte E-Mail bestätigen, falls in Supabase aktiviert)';
      okEl.classList.remove('hidden');
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  } finally {
    if (S.authMode === 'login') btn.textContent = 'Anmelden';
    else btn.textContent = 'Registrieren';
    btn.disabled = false;
  }
}

// ──────────────────────────────────────────
// DATA FETCHING
// ──────────────────────────────────────────
async function fetchData() {
  loading($('main'));

  try {
    const [matchRes, betRes, lbRes] = await Promise.all([
      db.from('matches').select('*, home_team:teams!home_team_id(id,name,flag_url), away_team:teams!away_team_id(id,name,flag_url), first_goalscorer:players!first_goalscorer_id(id,name)').order('kickoff_time', { ascending: true }),
      db.from('bets').select('*, goalscorer:players!first_goalscorer_id(id,name)').eq('user_id', S.user.id),
      db.from('profiles').select('id,display_name,total_points').order('total_points', { ascending: false }),
    ]);

    if (matchRes.error) throw matchRes.error;
    if (betRes.error) throw betRes.error;
    if (lbRes.error) throw lbRes.error;

    S.matches     = matchRes.data || [];
    S.leaderboard = lbRes.data    || [];
    S.bets = {};
    (betRes.data || []).forEach(b => { S.bets[b.match_id] = b; });

    const ph = phases();
    if (!S.bettingPhase  || !ph.includes(S.bettingPhase))  S.bettingPhase  = ph[0];
    if (!S.overviewPhase || !ph.includes(S.overviewPhase)) S.overviewPhase = ph[0];

    renderView();
  } catch (err) {
    $('main').innerHTML = `<div class="p-5 text-center"><p class="text-red-500 font-bold mb-2">Fehler beim Laden</p><p class="text-sm text-slate-500">${err.message}</p></div>`;
  }
}

// ──────────────────────────────────────────
// NAVIGATION
// ──────────────────────────────────────────
function goTo(view) {
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  renderView();
}

function renderView() {
  const main = $('main');
  switch (S.view) {
    case 'dashboard':  renderDashboard(main); break;
    case 'tippen':     renderBetting(main); break;
    case 'uebersicht': renderOverviewShell(main); loadOverviewData(); break;
    case 'bonus':      renderBonus(main); break;
    case 'profil':     renderProfile(main); break;
  }
}

// ──────────────────────────────────────────
// DASHBOARD
// ──────────────────────────────────────────
function renderDashboard(main) {
  const me    = S.leaderboard.find(p => p.id === S.user.id);
  const rank  = (S.leaderboard.findIndex(p => p.id === S.user.id) + 1) || '–';
  const pts   = me?.total_points ?? 0;
  const total = S.leaderboard.length;

  const now  = new Date();
  const next = S.matches.find(m => new Date(m.kickoff_time) > now && m.status !== 'FINISHED') || S.matches[0];

  let nextHtml = '';
  if (next) {
    const bet    = S.bets[next.id];
    const scoreOrTime = next.status === 'FINISHED'
      ? `${getFinalScore(next,'home')} : ${getFinalScore(next,'away')}${next.home_score_extratime !== null ? ' n.V.' : ''}`
      : formatRelativeDate(next.kickoff_time) + ' Uhr';
    const badge = next.status === 'FINISHED'
      ? `<span class="text-xs font-bold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">Beendet</span>`
      : `<span class="text-xs font-bold bg-red-100 text-red-500 px-2.5 py-1 rounded-full pulse-badge">Bald</span>`;

    let action = '';
    if (next.status !== 'FINISHED' && !bet) {
      action = `<button onclick="jumpToMatch('${next.phase}', ${next.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition">Jetzt Tipp abgeben &rsaquo;</button>`;
    } else if (next.status !== 'FINISHED' && bet) {
      action = `<div class="bg-slate-50 px-4 py-3 rounded-xl text-center border border-slate-100">
        <span class="text-slate-400 text-xs font-bold uppercase tracking-wide">Dein Tipp</span>
        <div class="text-2xl font-extrabold mt-1 tracking-tight">${bet.home_score} : ${bet.away_score}</div>
        <div class="text-slate-400 text-xs mt-0.5">⚽ ${bet.goalscorer?.name || 'Kein Torschütze'}</div>
        <button onclick="jumpToMatch('${next.phase}', ${next.id})" class="mt-3 w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-sm transition">Tipp ändern</button>
      </div>`;
    }

    nextHtml = `
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-extrabold text-slate-800 tracking-tight">Nächstes Spiel</h3>${badge}
        </div>
        <div class="flex justify-between items-center mb-4">
          <div class="text-center w-1/3 space-y-1.5">${flag(next.home_team)}<div class="text-xs font-bold text-slate-600 truncate">${next.home_team?.name || 'Heim'}</div></div>
          <div class="text-center font-bold text-sm bg-slate-100 px-4 py-2 rounded-xl mono tracking-widest">${scoreOrTime}</div>
          <div class="text-center w-1/3 space-y-1.5">${flag(next.away_team)}<div class="text-xs font-bold text-slate-600 truncate">${next.away_team?.name || 'Gast'}</div></div>
        </div>
        ${action}
      </div>`;
  }

  const lbRows = S.leaderboard.map((p, i) => {
    const isMe   = p.id === S.user.id;

  const curAway = bet?.away_score ?? '';
  const pending = S.pendingScorer[m.id];
  const sName   = pending?.name ?? bet?.goalscorer?.name ?? '';
  const sHint   = sName ? `<span class="font-bold text-slate-800">${sName}</span>` : `<span class="text-slate-400">Torschütze auswählen …</span>`;

        <span class="text-xs font-bold text-slate-400 mono">${formatRelativeDate(m.kickoff_time)}</span>${badge}
      </div>
      <div class="p-5">
        <div class="flex justify-between items-center mb-5">
          <div class="text-center flex-1 space-y-1.5">${flag(m.home_team)}<div class="text-xs font-bold text-slate-600 truncate">${m.home_team?.name||'Heim'}</div></div>
          <div class="flex gap-2 items-center px-3">

              oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length===1) triggerAutoSave(${m.id});"
              onblur="triggerAutoSave(${m.id})"
              class="w-14 h-16 text-center text-2xl font-extrabold bg-slate-100 border-2 border-slate-200 rounded-2xl outline-none focus:border-blue-400 focus:ring-0 disabled:opacity-40 disabled:bg-slate-100 transition mono" />

async function triggerAutoSave(matchId) {
  const hVal = $(`h-${matchId}`)?.value;
  const aVal = $(`a-${matchId}`)?.value;
  // Nur speichern, wenn beide Felder ausgefüllt sind (0-9)
  if (hVal === '' || aVal === '' || hVal === undefined || aVal === undefined) return;
  await performSave(matchId, parseInt(hVal), parseInt(aVal));
}

async function performSave(matchId, h, a) {
  const pending  = S.pendingScorer[matchId];
  const existing = S.bets[matchId];
  const scorerId = pending !== undefined ? (pending.id ?? null) : (existing?.first_goalscorer_id ?? null);
  
  // Nichts tun, wenn sich de facto nichts geändert hat
  if (existing && existing.home_score === h && existing.away_score === a && existing.first_goalscorer_id === scorerId) return;

  // 1. Optimistic UI Update & Cache Backup
  const backup = existing ? { ...existing } : null;
  const newBet = {
    id: existing?.id || crypto.randomUUID(), // Fix für not-null uuid Fehler
    user_id: S.user.id,
    match_id: matchId,
    home_score: h,
    away_score: a,
    first_goalscorer_id: scorerId,
    goalscorer: pending !== undefined ? { name: pending.name } : existing?.goalscorer
  };
  S.bets[matchId] = newBet;
  
  // UI-Indikator
  const btn = $(`sb-${matchId}`);
  if (btn) btn.classList.add('opacity-50');

  try {
    if (backup) {
      const { error } = await db.from('bets').update({ home_score: h, away_score: a, first_goalscorer_id: scorerId, updated_at: new Date().toISOString() }).eq('id', backup.id);
      if (error) throw error;
    } else {
      const { error } = await db.from('bets').insert({ id: newBet.id, user_id: S.user.id, match_id: matchId, home_score: h, away_score: a, first_goalscorer_id: scorerId });
      if (error) throw error;
    }
    
    delete S.pendingScorer[matchId];
    if (btn) btn.classList.remove('opacity-50');
    showToast('Tipp gespeichert');
  } catch (e) {
    // 2. Rollback bei Fehler (verhindert False-State im Cache)
    if (backup) S.bets[matchId] = backup;
    else delete S.bets[matchId];
    
    renderBetting($('main')); // Render completely reverts inputs to backup state
    showToast('Fehler beim Speichern', 'error');
    console.error("Save error:", e);
  }
}

async function openScorer(matchId) {
  $('modal-scorer').classList.remove('hidden');
  const list = $('scorer-list');
  list.innerHTML = `<div class="flex justify-center py-8"><div class="spinner w-6 h-6"></div></div>`;

  const m = S.matches.find(x => x.id === matchId);
  if (!m) return;

  // Zuerst Lineups (Startelf) abfragen
  const { data: lineups, error: lErr } = await db.from('match_lineups').select('player_id').eq('match_id', matchId);
  const lineupPlayerIds = new Set((lineups || []).map(l => l.player_id));
  const hasLineup = lineupPlayerIds.size > 0;

  // Dann alle Spieler der Teams laden
  const { data: players, error } = await db.from('players')
    .select('id,name,team:teams!team_id(id,name)')
    .in('team_id', [m.home_team_id, m.away_team_id])
    .order('name');

  if (error) { list.innerHTML = `<p class="text-red-500 text-sm text-center">${error.message}</p>`; return; }

  const starters = [];
  const bench = [];

  (players || []).forEach(p => {
    S.playerCache[p.id] = p;
    if (hasLineup) {
      if (lineupPlayerIds.has(p.id)) starters.push(p);
      else bench.push(p);
    } else {
      bench.push(p); // Ohne offizielle Aufstellung sind alle im Gesamtkader
    }
  });

  const playerBtn = (p, isStarter) => `
    <button onclick="pickScorer(${matchId}, ${p.id})" class="w-full text-left px-4 py-3 rounded-xl border transition flex justify-between items-center ${isStarter ? 'bg-slate-50 border-slate-200 active:bg-blue-50' : 'bg-white border-slate-100 active:bg-blue-50'}">
      <span class="font-${isStarter?'bold':'medium'} text-slate-${isStarter?'900':'600'} text-sm">${p.name}</span>
      <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-lg">${p.team?.name||''}</span>
    </button>`;

  list.innerHTML = `
    <button onclick="pickScorer(${matchId}, null)" class="w-full text-left px-4 py-3.5 rounded-2xl border-2 border-dashed border-slate-200 hover:border-slate-300 font-bold text-slate-600 active:bg-slate-50 transition text-sm mb-2">🚫 &nbsp;Kein Torschütze (0:0)</button>
    ${hasLineup && starters.length ? `<div><h4 class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-3 mt-2">Offizielle Startelf</h4><div class="space-y-2">${starters.map(p => playerBtn(p, true)).join('')}</div></div>` : ''}
    ${bench.length ? `<div><h4 class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-3 mt-4">${hasLineup ? 'Bank / Restkader' : 'Gesamter Kader (Aufstellung ausstehend)'}</h4><div class="space-y-2">${bench.map(p => playerBtn(p, false)).join('')}</div></div>` : ''}
    ${!players?.length ? '<p class="text-center text-slate-400 text-sm py-4">Keine Spieler gefunden.</p>' : ''}`;
}

function pickScorer(matchId, playerId) {
  const player = playerId != null ? S.playerCache[playerId] : null;
  S.pendingScorer[matchId] = { id: playerId, name: player?.name || 'Kein Torschütze' };
  const btn = $(`sb-${matchId}`);
  if (btn) btn.innerHTML = `<span class="font-bold text-slate-800">${S.pendingScorer[matchId].name}</span><span class="text-slate-400 text-lg leading-none">›</span>`;
  closeScorer();
  
  // Auto-Save nach Torschützenauswahl triggern
  triggerAutoSave(matchId);
}
function closeScorer() { $('modal-scorer').classList.add('hidden'); }

async function loadOverviewData() {
  const cards = $('ov-cards');
  if (!cards) return;
  loading(cards);

  const phaseMatches = S.matches.filter(m => m.phase === S.overviewPhase);
  if (!phaseMatches.length) { cards.innerHTML = '<p class="text-center text-slate-400 mt-12 font-medium">Keine Spiele in dieser Phase.</p>'; return; }

  const { data: allBets, error } = await db.from('bets').select(`*, user:profiles!user_id(id,display_name), goalscorer:players!first_goalscorer_id(id,name)`).in('match_id', phaseMatches.map(m => m.id));
  if (error) { cards.innerHTML = `<p class="text-red-500 text-sm p-4 text-center">${error.message}</p>`; return; }

  const byMatch = {};
  (allBets || []).forEach(b => { (byMatch[b.match_id] ??= []).push(b); });

  cards.innerHTML = phaseMatches.map(m => {
    const locked = isLocked(m);
    const fnH = getFinalScore(m, 'home'), fnA = getFinalScore(m, 'away');
    const ext = m.home_score_extratime !== null ? ' n.V.' : '';
    const status = m.status === 'FINISHED' ? `<span class="mono">${fnH}:${fnA}${ext}</span>` : locked ? 'LIVE' : fmtTime(m.kickoff_time);

    const bets = byMatch[m.id] || [];
    const rows = bets.length ? bets.map(b => {
      const isMe  = b.user_id === S.user.id;
      const show  = locked || m.status === 'FINISHED';
      const bh    = show ? b.home_score : '?';
      const ba    = show ? b.away_score : '?';
      const sc    = show ? (b.goalscorer?.name || 'Kein Torschütze') : '?';
      const pt    = show && m.status === 'FINISHED' ? `<span class="text-xs font-bold text-slate-400 w-8 text-right block">${b.points_awarded??0} P</span>` : '';
      return `<div class="flex items-center justify-between px-3 py-2 text-sm ${isMe ? 'bg-blue-50/60' : ''}">
        <span class="w-1/3 truncate font-${isMe?'bold':'medium'} text-${isMe?'blue-700':'slate-600'}">${b.user?.display_name||'?'}</span>
        <span class="w-1/4 text-center font-extrabold mono text-slate-900">${bh}:${ba}</span>
        <div class="flex items-center gap-2 w-5/12 justify-end"><span class="text-xs text-slate-400 truncate text-right" title="${sc}">${sc}</span>${pt}</div>
      </div>`;
    }).join('') : `<div class="px-3 py-3 text-center text-xs text-slate-400">Noch keine Tipps.</div>`;

    const hn = (m.home_team?.name || 'HM').substring(0,3).toUpperCase();
    const an = (m.away_team?.name || 'GS').substring(0,3).toUpperCase();

    return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="bg-slate-800 text-white px-4 py-2.5 flex justify-between items-center"><div class="font-bold text-sm">${hn} – ${an}</div><div class="text-xs font-bold mono bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700">${status}</div></div>
      <div class="divide-y divide-slate-100">${rows}</div>
    </div>`;
  }).join('');
}

async function renderBonus(main) {
  loading(main);
  
  const [qRes, bRes] = await Promise.all([
    db.from('extra_questions').select('*').order('deadline', { ascending: true }),
    db.from('extra_bets').select('*').eq('user_id', S.user.id)
  ]);

  if (qRes.error) { main.innerHTML = `<p class="p-4 text-red-500">${qRes.error.message}</p>`; return; }
  const questions = qRes.data || [];
  
  if (!questions.length) {
    main.innerHTML = `<div class="p-4 max-w-lg mx-auto fade-up"><h2 class="text-2xl font-extrabold mb-5 tracking-tight">Bonusfragen</h2><p class="text-slate-400 bg-white p-5 rounded-2xl border border-slate-100 text-center">Derzeit keine Bonusfragen verfügbar.</p></div>`;
    return;
  }

  const betsMap = {};
  (bRes.data || []).forEach(b => betsMap[b.question_id] = b);

  const html = questions.map(q => {
    const locked = new Date(q.deadline) <= new Date();
    const myBet  = betsMap[q.id]?.bet_value || '';
    const ptsAw  = betsMap[q.id]?.points_awarded;
    
    // Ohne die Info im Kontext, was "answer_type" genau beinhaltet, nutze ich hier einen Fallback (Text-Input).
    const inputHtml = `<input id="q-${q.id}" type="text" value="${myBet}" placeholder="Deine Antwort..." ${locked ? 'disabled' : ''} class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl bg-white outline-none focus:border-blue-400 transition text-sm font-semibold disabled:bg-slate-50 disabled:opacity-60" />`;
    
    const badge = locked 
      ? (ptsAw !== null && ptsAw !== undefined ? `<span class="bg-slate-100 text-slate-500 text-xs font-extrabold px-3 py-1.5 rounded-full ml-3 shrink-0">${ptsAw} Pkt erreicht</span>` : `<span class="bg-red-50 text-red-500 text-xs font-extrabold px-3 py-1.5 rounded-full ml-3 shrink-0">Abgelaufen</span>`)
      : `<span class="bg-yellow-100 text-yellow-700 text-xs font-extrabold px-3 py-1.5 rounded-full shrink-0 ml-3">+${q.points} Pkt</span>`;

    return `
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-extrabold text-lg tracking-tight">${q.question_text}</h3>
            <p class="text-xs text-slate-400 mt-1">Frist: ${fmtDate(q.deadline)} ${fmtTime(q.deadline)} Uhr</p>
          </div>
          ${badge}
        </div>
        ${inputHtml}
        ${!locked ? `<button id="btn-q-${q.id}" onclick="saveBonus(${q.id})" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl active:scale-95 transition">Speichern</button>` : ''}
      </div>`;
  }).join('');

  main.innerHTML = `<div class="p-4 max-w-lg mx-auto fade-up"><h2 class="text-2xl font-extrabold mb-5 tracking-tight">Bonusfragen</h2><div class="space-y-4">${html}</div></div>`;
}

async function saveBonus(qId) {
  const val = $(`q-${qId}`).value.trim();
  if (!val) return alert('Bitte etwas eintragen!');
  
  const btn = $(`btn-q-${qId}`);
  btn.disabled = true; btn.innerHTML = `<div class="spinner spinner-white w-5 h-5"></div>`;
  
  try {
    // Upsert logic - verify if exists
    const { data: existing } = await db.from('extra_bets').select('id').eq('user_id', S.user.id).eq('question_id', qId).maybeSingle();
    
    if (existing) {
      const { error } = await db.from('extra_bets').update({ bet_value: val }).eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await db.from('extra_bets').insert({ user_id: S.user.id, question_id: qId, bet_value: val });
      if (error) throw error;
    }
    btn.textContent = '✓ Gespeichert'; btn.style.background = '#10b981';
    setTimeout(() => { btn.textContent = 'Speichern'; btn.style.background = ''; btn.disabled=false; }, 2000);
  } catch (e) {
    alert(e.message); btn.textContent = 'Speichern'; btn.disabled=false;
  }
}

  const initial = (p?.display_name || '?').charAt(0).toUpperCase();
  const rank  = (S.leaderboard.findIndex(x => x.id === S.user.id) + 1) || '–';
  const pts   = S.leaderboard.find(x => x.id === S.user.id)?.total_points ?? 0;

  main.innerHTML = `
    <div class="p-4 max-w-lg mx-auto space-y-4 fade-up">
      <h2 class="text-2xl font-extrabold tracking-tight">Profil</h2>
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-extrabold text-white shrink-0" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">${initial}</div>
          <div><h3 class="font-extrabold text-xl tracking-tight">${p?.display_name || 'Spieler'}</h3><p class="text-sm text-slate-400">${S.user?.email || ''}</p></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100"><div class="text-3xl font-extrabold tracking-tight mono text-blue-600">${pts}</div><div class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wide">Punkte</div></div>
          <div class="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100"><div class="text-3xl font-extrabold tracking-tight mono text-blue-600">${rank}</div><div class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wide">Platz</div></div>
        </div>
        <button onclick="db.auth.signOut()" class="w-full py-3.5 px-4 text-center text-red-500 font-bold text-sm border-2 border-red-100 rounded-2xl bg-red-50 active:bg-red-100 transition">Abmelden</button>
      </div>
    </div>`;
}

// ──────────────────────────────────────────
// BOOT — auth state listener
// ──────────────────────────────────────────
async function handleSession(session) {
  S.user = session.user;

  // Tiefgründige Lösung: Warte auf den Postgres-Trigger anstatt fehlerhaft selbst zu inserten.
  let prof = null;
  for (let i = 0; i < 4; i++) {
    const { data } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (data) { prof = data; break; }
    await new Promise(r => setTimeout(r, 400)); // Warten auf DB Trigger
  }
  S.profile = prof;

  $('auth-screen').classList.add('hidden');
  const app = $('app-screen');
  app.classList.remove('hidden'); app.classList.add('flex');
  $('header-user').textContent = `Hallo, ${(prof?.display_name || 'Du').split(' ')[0]} 👋`;

  goTo('dashboard');
  await fetchData();
}

function handleSignOut() {
  S.user = null; S.profile = null;
  $('auth-screen').classList.remove('hidden');
  const app = $('app-screen');
  app.classList.add('hidden'); app.classList.remove('flex');
}

async function initApp() {
  // 1. Initial sofort die Session aus dem LocalStorage prüfen
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await handleSession(session);
  }

  // 2. Auth State Änderungen überwachen (Login/Logout Events)
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && S.user?.id !== session?.user?.id) {
      await handleSession(session);
    } else if (event === 'SIGNED_OUT') {
      handleSignOut();
    }
  });
}

initApp();
</script>
