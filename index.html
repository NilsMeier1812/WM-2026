function renderBetting(main) {
  const currentPhase = S.bettingPhase || allPhases()[0];
  main.innerHTML=`
    <div style="max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;">
      ${renderPhaseTabsContainer(currentPhase, 'setBettingPhase')}
      <div id="betting-content" style="padding:16px;padding-bottom:32px;display:flex;flex-direction:column;gap:14px;" class="fade-up"></div>
    </div>`;
  renderBettingContent();
}

window.setBettingPhase = function(p) {
  S.bettingPhase = p;
  const main = $('main');

  // Shell + Skeleton sofort einsetzen
  main.innerHTML = `
    <div style="max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;">
      ${renderPhaseTabsContainer(p, 'setBettingPhase')}
      <div id="betting-content" style="padding:16px;padding-bottom:32px;display:flex;flex-direction:column;gap:14px;">
        ${p === 'Bonusfragen'
          ? `<div style="display:flex;justify-content:center;padding:40px 0;"><div class="spinner" style="width:22px;height:22px;border-top-color:var(--navy);border-color:var(--border);"></div></div>`
          : skeletonCards(3)}
      </div>
    </div>`;

  // Im nächsten Frame echten Inhalt rendern (lässt Skeleton kurz sichtbar werden)
  requestAnimationFrame(() => renderBettingContent());
}

function renderBettingContent() {
  const c=$('betting-content');
  if (S.bettingPhase==='Bonusfragen') { renderBonusInsideBetting(c); return; }
  const phaseMatches = S.matches.filter(m=>m.phase===S.bettingPhase);
  if (!phaseMatches.length) { c.innerHTML='<p style="text-align:center;color:var(--text-3);padding:40px 0;font-size:13px;font-weight:500;">Keine Spiele in dieser Phase.</p>'; return; }

  const groups = {};
  phaseMatches.forEach(m => {
    const dLabel = getDateLabel(m.kickoff_time);
    if (!groups[dLabel]) groups[dLabel] = [];
    groups[dLabel].push(m);
  });

  // Auto-collapse date groups where all matches are finished (only on first visit)
  Object.keys(groups).forEach(dateLabel => {
    if (S.collapsedDates[dateLabel] === undefined) {
      if (groups[dateLabel].every(m => isFinished(m.status))) S.collapsedDates[dateLabel] = true;
    }
  });

  const html = Object.keys(groups).map(dateLabel => {
    const matches = groups[dateLabel];
    const isCollapsed = S.collapsedDates[dateLabel];
    const iconRot = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
    const status = getDayTipStatus(matches); // ← NEU

    let groupHtml = `<div class="date-header${isCollapsed ? ' collapsed' : ''}" onclick="toggleDateGroup('${dateLabel}')">
      <span style="display:flex; align-items:center; gap:10px;">
        <span title="${status.label}" style="width:9px; height:9px; border-radius:50%; background:${status.color}; flex-shrink:0; box-shadow:0 0 0 2px ${status.color}22;"></span>
        <span>${dateLabel}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:${iconRot}"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>`;

    if (!isCollapsed) {
      groupHtml += `<div style="display:flex;flex-direction:column;gap:14px;">` + matches.map(betCard).join('') + `</div>`;
    }
    return groupHtml;
  }).join('');

  // In eigenen Wrapper packen, damit der gap:14 des Containers (für Bonusfragen) hier nicht greift
  c.innerHTML = `<div style="display:flex;flex-direction:column;">${html}</div>`;
}

function betCard(m) {
  const bet = S.bets[m.id], locked = isLocked(m), isLive = locked && !isFinished(m.status);
  const isBoosted = bet && bet.is_boosted === true;

  if (locked) {
    const pts = calcBetPoints(m, bet);
    const finalH = getFinalScore(m, 'home') ?? 0, finalA = getFinalScore(m, 'away') ?? 0;
    
    let extInfo = '';
    if (m.home_score_penalty !== null && m.home_score_penalty !== undefined) {
      extInfo = `<div style="font-size:10px;color:var(--text-3);font-weight:700;margin-top:4px;">(${m.home_score_penalty}:${m.away_score_penalty} n.E.)</div>`;
    } else if (m.home_score_extratime !== null && m.home_score_extratime !== undefined) {
      extInfo = `<div style="font-size:10px;color:var(--text-3);font-weight:700;margin-top:4px;">n.V.</div>`;
    }

    let headerBadge = '';
    if (isLive) headerBadge = `<span class="pill pill-live"><span class="live-dot"></span>Live</span>`;
    else headerBadge = `<span class="pill pill-done">Beendet</span>`;

    let tipLine = '<span style="color:var(--text-3);">Kein Tipp</span>';
    let ptClass = 'color:var(--text-3);';
    if (bet) {
      ptClass = pts >= 3 ? 'color:var(--green);' : pts >= 1 ? 'color:var(--accent-text);' : 'color:var(--text-2);';
      let scorerHtml = '';

      if (bet.is_goalless === true) {
        scorerHtml = `<span style="font-weight:600;color:var(--red);">🚫 Kein Tor</span>`;
        if (isFinished(m.status) && m.is_goalless === true) {
          scorerHtml = `<span style="font-weight:700;color:var(--green);">🚫 Kein Tor</span>`;
        }
      } else if (bet.first_goalscorer_id) {
        const sName = bet.goalscorer?.name || '–';
        if (m.first_goalscorer_id) {
          scorerHtml = bet.first_goalscorer_id === m.first_goalscorer_id
            ? `<span style="color:var(--green);font-weight:700;">⚽ ${sName}</span>`
            : `<span style="color:var(--red);">⚽ ${sName}</span>`;
        } else {
          if (isFinished(m.status) && m.is_goalless === true) {
            scorerHtml = `<span style="color:var(--red);">⚽ ${sName}</span>`;
          } else {
            scorerHtml = `⚽ ${sName}`;
          }
        }
      } else {
        scorerHtml = '<span style="color:var(--text-3);">–</span>';
      }
      tipLine = `<span class="mono" style="font-weight:700;">${bet.home_score ?? '-'}:${bet.away_score ?? '-'}</span> <span style="color:var(--text-3);">·</span> ${scorerHtml}`;
    }

    const betResultBg = isBoosted ? 'background:#FEF3C7; border-color:var(--accent);' : 'background:#F4F0E8; border-color:var(--border-light);';

    return `
      <div id="match-card-${m.id}" class="mc ${isLive ? 'mc-live' : ''}" style="scroll-margin-top:140px;">
        <div class="mc-header">
          <span class="mono" style="color:var(--text-2);font-size:11px;">${fmtTime(m.kickoff_time)} Uhr</span>
          ${headerBadge}
        </div>
        <div class="mc-body">
          <div class="mc-teams" style="margin-bottom:12px;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;text-align:center;">
              ${flag(m.home_team, 'w-8 h-6')}
              <span style="font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px;">${m.home_team?.name || ''}</span>
            </div>
            <div style="flex:1;text-align:center;">
              <div class="result-score ${isLive ? 'live' : ''}" style="font-size:38px;">${finalH}:${finalA}</div>
              ${extInfo}
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;text-align:center;">
              ${flag(m.away_team, 'w-8 h-6')}
              <span style="font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px;">${m.away_team?.name || ''}</span>
            </div>
          </div>
          <div class="bet-result" style="${betResultBg}">
            <div>
              <div class="bet-result-label">${isBoosted ? 'Geboosteter Tipp (2x)' : 'Dein Tipp'}</div>
              <div style="font-size:13px;font-weight:600;">${tipLine}</div>
            </div>
            <div class="bet-pts syne" style="${ptClass}">+${pts}</div>
          </div>
        </div>
      </div>`;
  }

  // Offen / Tippbar
  const curHome = bet?.home_score ?? '', curAway = bet?.away_score ?? '';
  const pending = S.pendingScorer[m.id];
  const isGetippt = bet && bet.home_score !== null && bet.away_score !== null &&
    (bet.first_goalscorer_id !== null || bet.is_goalless === true);

  let sHint = '';
  if (pending !== undefined) {
    if (pending.id) sHint = `⚽ <span style="font-weight:700;color:var(--text);">${pending.name}</span>`;
    else sHint = `🚫 <span style="font-weight:700;color:var(--red);">Kein Tor</span>`;
  } else if (bet) {
    if (bet.is_goalless === true) {
      sHint = `🚫 <span style="font-weight:700;color:var(--red);">Kein Tor</span>`;
    } else if (bet.first_goalscorer_id) {
      sHint = `⚽ <span style="font-weight:700;color:var(--text);">${bet.goalscorer?.name || '–'}</span>`;
    } else {
      sHint = `<span style="color:var(--text-3);">Wählen …</span>`;
    }
  } else {
    sHint = `<span style="color:var(--text-3);">Wählen …</span>`;
  }

  let headerBadge = isGetippt 
    ? `<span class="pill pill-getippt">✓ Getippt</span>` 
    : `<span class="pill pill-offen">Offen</span>`;
  
  const countdown = getTimeUntilLock(m.kickoff_time);
  let countdownBadge = '';
  if (countdown) {
    const cls = countdown.veryUrgent ? 'pill-countdown-urgent' 
              : countdown.urgent     ? 'pill-countdown-warn' 
              : 'pill-countdown';
    countdownBadge = `<span class="pill ${cls}" data-countdown-for="${m.id}">⏱ ${countdown.label}</span>`;
  }


  // Prüfen, ob in der Phase dieses Spiels bereits ein Boost in einem gestarteten Spiel fixiert ist
  const hasLockedBoost = Object.values(S.bets).some(b => {
    const checkMatch = S.matches.find(x => x.id === b.match_id);
    return checkMatch && checkMatch.phase === m.phase && b.is_boosted && isLocked(checkMatch);
  });

  const isBoostDisabled = hasLockedBoost && !isBoosted;

// NEU: Pending-State für Removal-Confirm berücksichtigen
  const isPendingRemoval = _pendingBoostRemoval === m.id && isBoosted;

  let boostBtnStyle = '';
  if (isPendingRemoval) {
    boostBtnStyle = 'background:#FEE9E7; color:var(--red); border-color:var(--red); font-weight:800; cursor:pointer;';
  } else if (isBoosted) {
    boostBtnStyle = 'background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:800; cursor:pointer;';
  } else if (isBoostDisabled) {
    boostBtnStyle = 'background:#F1F0EC; color:var(--text-3); border-color:transparent; font-weight:700; opacity:0.6; cursor:not-allowed;';
  } else {
    boostBtnStyle = 'background:#F4F0E8; color:var(--text-2); border-color:var(--border); font-weight:700; cursor:pointer;';
  }

  const boostText = isPendingRemoval ? 'Entfernen?' : '2x Punkte';

  return `
    <div id="match-card-${m.id}" class="mc" style="scroll-margin-top:140px;">
      <div class="mc-header">
        <span class="mono" style="color:var(--text-2);font-size:11px;">${fmtTime(m.kickoff_time)} Uhr</span>
        <div style="display:flex; gap:6px; align-items:center;">
          ${countdownBadge}
          ${headerBadge}
        </div>
      </div>
      <div class="mc-body">
        <div class="mc-teams">
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;text-align:center;">
            ${flag(m.home_team, 'w-9 h-6')}
            <span style="font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px;">${m.home_team?.name || 'Heim'}</span>
          </div>
          <div class="score-area">
            <input id="h-${m.id}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" value="${curHome}" placeholder="–"
              class="score-input"
              oninput="this.value=this.value.replace(/[^0-9]/g,'');if(this.value.length===1) document.getElementById('a-${m.id}').focus();"
              onblur="triggerAutoSave(${m.id})" />
            <span class="score-sep">:</span>
            <input id="a-${m.id}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" value="${curAway}" placeholder="–"
              class="score-input"
              oninput="this.value=this.value.replace(/[^0-9]/g,'');if(this.value.length===1){triggerAutoSave(${m.id});focusAfterScoreInput(${m.id});}"
              onblur="triggerAutoSave(${m.id})" />
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;text-align:center;">
            ${flag(m.away_team, 'w-9 h-6')}
            <span style="font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px;">${m.away_team?.name || 'Gast'}</span>
          </div>
        </div>
        
        <div style="display:flex; gap:12px; align-items:flex-start;">
          <div style="flex:1; min-width:0;">
            <div class="section-label">Erster Torschütze</div>
            <button id="sb-${m.id}" onclick="openScorer(${m.id})" class="scorer-btn">
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${sHint}</span>
              <span style="color:var(--text-3);font-size:18px;line-height:1;margin-left:4px;flex-shrink:0;">›</span>
            </button>
          </div>
          <div style="width:115px; flex-shrink:0;">
            <div class="section-label" style="text-align:right;">Boost</div>
            <button id="bb-${m.id}" ${isBoostDisabled ? 'disabled' : `onclick="toggleBoost(${m.id})"`} style="width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid transparent; font-size:13px; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:4px; ${boostBtnStyle}">
            ${boostText}
            </button>
          </div>
        </div>
      </div>
    </div>`;
}

async function triggerAutoSave(matchId, forceScorer=false) {
  const hVal=$(`h-${matchId}`)?.value;
  const aVal=$(`a-${matchId}`)?.value;
  const pending=S.pendingScorer[matchId];
  
  if (hVal!==''&&aVal!=='') {
    await performSave(matchId, parseInt(hVal), parseInt(aVal));
  } else if (forceScorer && pending) {
    const currentH=hVal!==''?parseInt(hVal):null;
    const currentA=aVal!==''?parseInt(aVal):null;
    await performSave(matchId, currentH, currentA);
  }
}

async function performSave(matchId, h, a) {
  const pending=S.pendingScorer[matchId], existing=S.bets[matchId];
  const scorerId=pending!==undefined ? (pending.id??null) : (existing?.first_goalscorer_id??null);
  const isGoalless=pending!==undefined ? (pending.is_goalless??false) : (existing?.is_goalless??null);
  const isBoosted = existing?.is_boosted ?? false;
  
  if (scorerId===null && (h===null || a===null)) return;
  
  if (existing&&existing.home_score===h&&existing.away_score===a&&existing.first_goalscorer_id===scorerId&&existing.is_goalless===isGoalless) return;

  const backup=existing?{...existing}:null;
  const newBet={
    id:existing?.id||crypto.randomUUID(),
    user_id:S.user.id, match_id:matchId,
    home_score:h, away_score:a, first_goalscorer_id:scorerId, is_goalless:isGoalless,
    goalscorer: pending !== undefined 
      ? (scorerId ? { name: pending.name, team_id: pending.team_id } : null) 
      : existing?.goalscorer,
    is_boosted: isBoosted
  };
  S.bets[matchId]=newBet;

  const btn=$(`sb-${matchId}`);
  if (btn) btn.style.opacity='.5';

  try {
    if (backup) {
      const {error}=await db.from('bets').update({home_score:h,away_score:a,first_goalscorer_id:scorerId,is_goalless:isGoalless,updated_at:new Date().toISOString()}).eq('id',backup.id);
      if (error) throw error;
    } else {
      const {error}=await db.from('bets').insert({id:newBet.id,user_id:S.user.id,match_id:matchId,home_score:h,away_score:a,first_goalscorer_id:scorerId,is_goalless:isGoalless});
      if (error) throw error;
    }
    delete S.pendingScorer[matchId];
    if (btn) btn.style.opacity='1';
    
    renderBettingContent();
    showToast('Tipp gespeichert');
  } catch(e) {
    if (backup) S.bets[matchId]=backup; else delete S.bets[matchId];
    renderBettingContent();
    showToast('Fehler beim Speichern','error');
  }
}

async function openScorer(matchId) {
  $('modal-scorer').classList.remove('hidden');
  const list=$('scorer-list');
  list.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div style="display:flex;flex-direction:column;gap:8px;">${Array(4).fill('<div class="skel" style="height:56px;border-radius:10px;"></div>').join('')}</div><div style="display:flex;flex-direction:column;gap:8px;">${Array(4).fill('<div class="skel" style="height:56px;border-radius:10px;"></div>').join('')}</div></div>`;

  const m=S.matches.find(x=>x.id===matchId);
  if (!m) return;

  const {data:lineups}=await db.from('match_lineups').select('player_id,is_starter').eq('match_id',matchId);
  const lineupMap=new Map((lineups||[]).map(l=>[l.player_id, Boolean(l.is_starter)]));

  const {data:players,error}=await db.from('players').select('id,name,position,team_id').in('team_id',[m.home_team_id,m.away_team_id]);
  if (error) { list.innerHTML=`<p style="color:var(--red);font-size:13px;text-align:center;">${error.message}</p>`; return; }

  const posMap={Goalkeeper:'TW',Defender:'ABW',Midfielder:'MF',Attacker:'ST',G:'TW',D:'ABW',M:'MF',F:'ST'};
  const posWeight={Attacker:1,Midfielder:2,Defender:3,Goalkeeper:4,F:1,M:2,D:3,G:4};
  (players||[]).forEach(p=>{S.playerCache[p.id]=p;});

  try {
    if (players && players.length > 0) {
      const {data:goalData} = await db.from('vw_player_tournament_goals')
        .select('player_id, total_goals')
        .in('team_id', [m.home_team_id, m.away_team_id]);
      
      const goalsMap = {};
      (goalData||[]).forEach(g => { goalsMap[g.player_id] = Number(g.total_goals); });
      (players||[]).forEach(p => { p.tournament_goals = goalsMap[p.id] || 0; });
    }
  } catch(e) {
    (players||[]).forEach(p => { p.tournament_goals = 0; });
  }

  // Grundsortierung nach Toren, Position, Name
  (players||[]).sort((a,b)=>{
    if ((b.tournament_goals||0)!=(a.tournament_goals||0)) return (b.tournament_goals||0)-(a.tournament_goals||0);
    const wa=posWeight[a.position]||99, wb=posWeight[b.position]||99;
    if (wa!==wb) return wa-wb;
    return a.name.localeCompare(b.name);
  });

  const homePlayers=(players||[]).filter(p=>p.team_id===m.home_team_id);
  const awayPlayers=(players||[]).filter(p=>p.team_id===m.away_team_id);

  // Fallback: letzte Startelf aus dem vorherigen Spiel des Teams laden,
  // falls für dieses Spiel noch keine Aufstellung vorhanden ist.
  async function getLastLineup(teamId, teamPlayerIds, beforeKickoff) {
    const candidates = S.matches
      .filter(x => (x.home_team_id === teamId || x.away_team_id === teamId)
        && new Date(x.kickoff_time) < new Date(beforeKickoff))
      .sort((a, b) => new Date(b.kickoff_time) - new Date(a.kickoff_time));
    if (!candidates.length) return null;
    const ids = candidates.map(c => c.id);
    const {data} = await db.from('match_lineups').select('match_id,player_id,is_starter').in('match_id', ids);
    if (!data || !data.length) return null;
    const teamSet = new Set(teamPlayerIds);
    const byMatch = new Map();
    data.forEach(r => {
      if (!teamSet.has(r.player_id)) return;
      if (!byMatch.has(r.match_id)) byMatch.set(r.match_id, []);
      byMatch.get(r.match_id).push(r);
    });
    for (const c of candidates) {
      const rows = byMatch.get(c.id);
      if (rows && rows.some(r => Boolean(r.is_starter))) {
        return new Map(rows.map(r => [r.player_id, Boolean(r.is_starter)]));
      }
    }
    return null;
  }

  const homeHasLineup = homePlayers.some(p => lineupMap.has(p.id));
  const awayHasLineup = awayPlayers.some(p => lineupMap.has(p.id));

  let homeMode = homeHasLineup ? 'current' : 'none';
  let awayMode = awayHasLineup ? 'current' : 'none';
  let homeMap = lineupMap, awayMap = lineupMap;

  if (!homeHasLineup) {
    const last = await getLastLineup(m.home_team_id, homePlayers.map(p => p.id), m.kickoff_time);
    if (last) { homeMap = last; homeMode = 'last'; }
  }
  if (!awayHasLineup) {
    const last = await getLastLineup(m.away_team_id, awayPlayers.map(p => p.id), m.kickoff_time);
    if (last) { awayMap = last; awayMode = 'last'; }
  }

  const renderP = (p, isStarter = false) => {
    const pos = posMap[p.position] || p.position || '?';
    const goals = p.tournament_goals > 0
      ? `<span style="display:flex; align-items:center; gap:3px; flex-shrink:0; line-height:1;"><span class="syne" style="font-size:16px; font-weight:800; color:var(--text);">${p.tournament_goals}</span><span style="font-size:12px;">⚽</span></span>`
      : '';
    const bg = isStarter ? '#EEF3FF' : '#fff';
    const border = isStarter ? '1.5px solid var(--navy)' : '1.5px solid var(--border-light)';
    const fw = isStarter ? 700 : 600;
    return `
      <button onclick="pickScorer(${matchId},${p.id})" style="width:100%;text-align:left;padding:9px 12px;border-radius:10px;border:${border};background:${bg};cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .12s;min-width:0;">
        <span style="display:flex; flex-direction:column; gap:3px; min-width:0;">
          <span style="font-size:11px;font-weight:${fw};color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
          <span style="font-size:9px;font-weight:700;color:var(--text-3);">${pos}</span>
        </span>
        ${goals}
      </button>`;
  };

  const renderPlayerGroup = (teamPlayers, map, mode) => {
    if (!teamPlayers.length) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:8px 0;">Keine Spieler</p>';

    if (mode === 'none') {
      return `
        <div style="font-size:10px; font-weight:800; color:var(--text-3); text-transform:uppercase; margin:8px 0 4px 4px; letter-spacing:0.05em;">Kader</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${teamPlayers.map(p => renderP(p)).join('')}
        </div>`;
    }

    const starters = teamPlayers.filter(p => map.get(p.id) === true);
    const bench = teamPlayers.filter(p => map.get(p.id) !== true);
    const starterLabel = mode === 'last' ? 'Letzte Startelf' : 'Startelf';
    // Bei aktueller Aufstellung: Rest = "Bank". Bei letzter Startelf ist die
    // damalige Bank für dieses Spiel nicht aussagekräftig → restlicher Kader.
    const benchLabel = mode === 'last' ? 'Kader' : 'Bank';

    let html = '';
    if (starters.length > 0) {
      html += `
        <div style="font-size:10px; font-weight:800; color:var(--text-3); text-transform:uppercase; margin:8px 0 4px 4px; letter-spacing:0.05em;">${starterLabel}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
          ${starters.map(p => renderP(p, true)).join('')}
        </div>`;
    }
    if (bench.length > 0) {
      html += `
        <div style="font-size:10px; font-weight:800; color:var(--text-3); text-transform:uppercase; margin:8px 0 4px 4px; letter-spacing:0.05em;">${benchLabel}</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${bench.map(p => renderP(p)).join('')}
        </div>`;
    }
    return html;
  };

  list.innerHTML=`
    <button onclick="pickScorer(${matchId},null)" style="width:100%;padding:12px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:14px;transition:background .12s;">
      🚫 &nbsp;Kein Torschütze (0:0)
    </button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;">
      <div>
        <div style="display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--border-light);">
          ${flag(m.home_team,'w-5 h-3')}
          <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.home_team?.name||'Heim'}</span>
        </div>
        ${renderPlayerGroup(homePlayers, homeMap, homeMode)}
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--border-light);">
          ${flag(m.away_team,'w-5 h-3')}
          <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.away_team?.name||'Gast'}</span>
        </div>
        ${renderPlayerGroup(awayPlayers, awayMap, awayMode)}
      </div>
    </div>`;
}

async function renderBonusOverview(cards) {
  const [qRes,bRes,sRes]=await Promise.all([
    db.from('extra_questions').select('*').order('id',{ascending:true}),
    db.from('extra_bets').select('*'),
    db.from('extra_bet_scores').select('id,points_awarded')   // berechnete Punkte (View)
  ]);
  if (qRes.error) { cards.innerHTML=`<p style="color:var(--red);padding:16px;">${qRes.error.message}</p>`; return; }
  const questions=qRes.data||[];
  if (!questions.length) { cards.innerHTML='<p style="text-align:center;color:var(--text-3);padding:40px 0;font-size:13px;">Keine Bonusfragen verfügbar.</p>'; return; }
  // Berechnete Punkte aus der View über bet.id einspielen (Fallback: vorhandenes points_awarded).
  const scoreById={};
  if (!sRes.error) (sRes.data||[]).forEach(s=>{scoreById[s.id]=s.points_awarded;});
  const byQ={};
  (bRes.data||[]).forEach(b=>{ if (!sRes.error) b.points_awarded=scoreById[b.id]??0; (byQ[b.question_id]??=[]).push(b); });

  // Spielernamen der gesetzten Lösungen (correct_player_id) leichtgewichtig per ID nachladen.
  const neededPlayerIds=[...new Set(questions.map(q=>q.correct_player_id).filter(Boolean))];
  const corrPlayers={};
  if (neededPlayerIds.length) {
    const {data:pl}=await db.from('players').select('id,name').in('id',neededPlayerIds);
    (pl||[]).forEach(p=>{corrPlayers[p.id]=p;});
  }

  const formatAnswer=(q,bet)=>{
    let ans=bet?.bet_value||'-';
    if (q.answer_type==='teams'||q.answer_type==='players'||/^group\s+/i.test(q.answer_type||'')) {
      const t=S.teams.find(x=>String(x.id)===String(bet?.bet_team_id))||S.teams.find(x=>x.name===bet?.bet_value);
      if (t?.flag_url&&!t.flag_url.startsWith('http')&&!t.flag_url.startsWith('/')&&bet?.bet_value) ans=`${t.flag_url} ${bet.bet_value}`;
    }
    return ans;
  };

  // Lösungs-/Tipp-Vergleich auf ID-Basis: Ergebnis steht in correct_player_id / correct_team_id
  // (Spieler vor Team, da Spieler-Tipps auch ein bet_team_id tragen).
  const correctKey=q=> q.correct_player_id?('p:'+q.correct_player_id)
                     : q.correct_team_id ?('t:'+q.correct_team_id) : null;
  const betKey=bet=> bet?.bet_player_id?('p:'+bet.bet_player_id)
                   : bet?.bet_team_id ?('t:'+bet.bet_team_id) : null;
  const teamFlag=t=>(t&&t.flag_url&&!t.flag_url.startsWith('http')&&!t.flag_url.startsWith('/'))?t.flag_url+' ':'';
  const correctLabel=q=>{
    if (q.correct_player_id){ const p=corrPlayers[q.correct_player_id]; return p?p.name:('Spieler #'+q.correct_player_id); }
    if (q.correct_team_id){ const t=S.teams.find(x=>String(x.id)===String(q.correct_team_id)); return t?(teamFlag(t)+t.name):('Team #'+q.correct_team_id); }
    return q.correct_answer||null; // Fallback für Textfragen ohne ID-Spalte
  };

  // Fragen mit gleichem group_key zu einer Karte zusammenfassen, Reihenfolge ab erstem Vorkommen
  const items=[]; const groupIdx={};
  questions.forEach(q=>{
    if (q.group_key) {
      if (groupIdx[q.group_key]===undefined) {
        groupIdx[q.group_key]=items.length;
        items.push({type:'group',key:q.group_key,questions:[q]});
      } else items[groupIdx[q.group_key]].questions.push(q);
    } else items.push({type:'single',q});
  });

  const renderSingleCard=(q)=>{
    const locked=new Date(q.deadline)<=new Date();
    const qBets=byQ[q.id]||[];
    let displayRows=S.leaderboard.map(player=>({player,bet:qBets.find(x=>x.user_id===player.id)}));
    displayRows.sort((a,b)=>{
      if (a.player.id===S.user.id) return -1;
      if (b.player.id===S.user.id) return 1;
      if (locked) return (b.bet?.points_awarded||0)-(a.bet?.points_awarded||0);
      const ah=!!a.bet, bh=!!b.bet;
      if (ah&&!bh) return -1; if (!ah&&bh) return 1;
      return (a.player.display_name||'').localeCompare(b.player.display_name||'');
    });

    const rows=displayRows.map(({player,bet})=>{
      const isMe=player.id===S.user.id, show=locked||isMe;
      let ans='-', ptHtml='';
      if (bet) {
        if (!show) ans='<span style="color:var(--text-3);">verdeckt</span>';
        else {
          ans=formatAnswer(q,bet);
          ptHtml=locked?`<span style="font-weight:700;color:${(bet.points_awarded||0)>0?'var(--blue)':'var(--text-2)'};">${bet.points_awarded??0}</span>`:'';
        }
      } else { ans='<span style="color:var(--text-3);">–</span>'; if (locked) ptHtml='<span style="color:var(--text-3);">0</span>'; }
      return `<div class="ov-row ${isMe?'me':''}">
        <span style="width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isMe?700:600};color:${isMe?'var(--blue)':'var(--text)'};">${player.display_name||'?'}</span>
        <span style="width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;">${ans}</span>
        <span style="width:15%;text-align:right;">${ptHtml}</span>
      </div>`;
    }).join('');

    const sol=correctLabel(q);
    let headerRight=locked
      ? (sol?`<span style="font-size:10px;color:#6EE7B7;font-weight:700;">✓ ${sol}</span>`:`<span style="font-size:10px;color:rgba(255,255,255,.4);">Ausstehend</span>`)
      : `<span class="mono" style="font-size:10px;font-weight:700;background:rgba(255,255,255,.1);padding:3px 8px;border-radius:6px;white-space:nowrap;">Frist: ${fmtDate(q.deadline)}</span>`;

    return `<div class="card" style="overflow:hidden;">
      <div style="background:var(--navy);color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span style="font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${q.question_text}</span>
        ${headerRight}
      </div>
      <div>${rows}</div>
    </div>`;
  };

  const renderGroupCard=(qs)=>{
    const firstQ=qs[0];
    const earliest=qs.reduce((min,q)=>new Date(q.deadline)<new Date(min.deadline)?q:min,qs[0]);
    const locked=new Date(earliest.deadline)<=new Date();
    const pointsPerHit=Number(firstQ.points)||0;

    const correctSet=new Set();
    qs.forEach(q=>{ const k=correctKey(q); if (k) correctSet.add(k); });
    const correctLabels=qs.map(q=>correctLabel(q)).filter(Boolean);

    const playerData=S.leaderboard.map(player=>{
      const bets=qs.map(q=>({q,bet:(byQ[q.id]||[]).find(x=>x.user_id===player.id)}));
      const picksSet=new Set();
      bets.forEach(({bet})=>{ const k=betKey(bet); if (k) picksSet.add(k); });
      let hits=0; picksSet.forEach(p=>{ if (correctSet.has(p)) hits++; });
      return { player, bets, computedPoints: hits*pointsPerHit, hasAnyBet: bets.some(x=>x.bet) };
    });

    // Solange es in dieser Gruppe noch keine Punkte gibt (nicht ausgewertet),
    // alphabetisch sortieren; sobald Punkte vergeben sind, nach Punkten (Tie: Name).
    const anyPoints = playerData.some(d => d.computedPoints > 0);
    const byName = (a,b) => (a.player.display_name||'').localeCompare(b.player.display_name||'');
    playerData.sort((a,b)=>{
      if (a.player.id===S.user.id) return -1;
      if (b.player.id===S.user.id) return 1;
      if (!anyPoints) return byName(a,b);
      return (b.computedPoints-a.computedPoints) || byName(a,b);
    });

    const rows=playerData.map(({player,bets,computedPoints,hasAnyBet})=>{
      const isMe=player.id===S.user.id, show=locked||isMe;
      let picksHtml='';
      if (!hasAnyBet) picksHtml='<span style="color:var(--text-3);">–</span>';
      else if (!show) picksHtml='<span style="color:var(--text-3);">verdeckt</span>';
      else {
        picksHtml=bets.map(({q,bet})=>{
          if (!bet) return '<span style="color:var(--text-3);font-size:11px;font-weight:500;">–</span>';
          const ans=formatAnswer(q,bet);
          const k=betKey(bet);
          const isCorrect=locked&&k&&correctSet.has(k);
          const color=isCorrect?'#059669':'var(--text)';
          const weight=isCorrect?700:500;
          return `<span style="font-size:11px;font-weight:${weight};color:${color};white-space:nowrap;">${ans}</span>`;
        }).join('');
      }
      let ptHtml='';
      if (locked) {
        if (hasAnyBet) ptHtml=`<span style="font-weight:700;color:${computedPoints>0?'var(--blue)':'var(--text-2)'};">${computedPoints}</span>`;
        else ptHtml='<span style="color:var(--text-3);">0</span>';
      }
      return `<div class="ov-row ${isMe?'me':''}">
        <span style="width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isMe?700:600};color:${isMe?'var(--blue)':'var(--text)'};">${player.display_name||'?'}</span>
        <span style="width:55%;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;">${picksHtml}</span>
        <span style="width:15%;text-align:right;">${ptHtml}</span>
      </div>`;
    }).join('');

    let headerRight=locked
      ? (correctLabels.length?`<span style="font-size:10px;color:#6EE7B7;font-weight:700;text-align:right;">✓ ${correctLabels.join(', ')}</span>`:`<span style="font-size:10px;color:rgba(255,255,255,.4);">Ausstehend</span>`)
      : `<span class="mono" style="font-size:10px;font-weight:700;background:rgba(255,255,255,.1);padding:3px 8px;border-radius:6px;white-space:nowrap;">Frist: ${fmtDate(earliest.deadline)}</span>`;

    return `<div class="card" style="overflow:hidden;">
      <div style="background:var(--navy);color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span style="font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${firstQ.question_text} <span style="color:rgba(255,255,255,.55);font-weight:600;">×${qs.length}</span></span>
        ${headerRight}
      </div>
      <div>${rows}</div>
    </div>`;
  };

  cards.innerHTML=items.map(it=>it.type==='single'?renderSingleCard(it.q):renderGroupCard(it.questions)).join('');
}

window.toggleMatchOverview = function(matchId) {
  const body = document.getElementById(`match-ov-body-${matchId}`);
  const summary = document.getElementById(`match-ov-summary-${matchId}`);
  const icon = document.getElementById(`match-ov-icon-${matchId}`);
  if (!body) return;

  const expand = body.style.display === 'none';
  if (expand) S.expandedMatches.add(matchId);     // State merken → überlebt Re-Render
  else S.expandedMatches.delete(matchId);

  body.style.display = expand ? 'block' : 'none';
  if (summary) summary.style.display = expand ? 'none' : 'block';
  if (icon) icon.style.transform = expand ? 'rotate(180deg)' : 'rotate(0deg)';
};

// Lädt die Tipps ALLER Spieler (phasenübergreifend) neu in den Übersicht-Cache,
// ohne die Ansicht zu leeren. Eine verdächtig leere Antwort ersetzt den Cache nicht.
async function refreshOverviewBets() {
  if (!S.matches.length) return;
  const { data, error } = await db.from('bets')
    .select('*, goalscorer:players!first_goalscorer_id(id,name,team_id)')
    .in('match_id', S.matches.map(m => m.id));
  if (error || !data) return;
  if (data.length === 0 && S.overviewAllBets && S.overviewAllBets.length > 0) return;
  S.overviewAllBets = data;
}

async function loadOverviewData() {
  const cards = $('ov-cards');
  if (!cards) return;

  if (S.overviewPhase === 'Bonusfragen') {
    cards.innerHTML = `<div class="card" style="height:200px;display:flex;align-items:center;justify-content:center;"><div class="spinner" style="width:24px;height:24px;border-top-color:var(--navy);border-color:var(--border);"></div></div>`;
    renderBonusOverview(cards);
    return;
  }

  const phaseMatches = S.matches.filter(m => m.phase === S.overviewPhase);
  if (!phaseMatches.length) {
    cards.innerHTML = '<p style="text-align:center;color:var(--text-3);padding:40px 0;font-size:13px;">Keine Spiele in dieser Phase.</p>';
    return;
  }

  // Cache vorhanden → sofort rendern ohne Netzwerk/Spinner (Phasenwechsel & Ein-/Ausklappen)
  if (S.overviewAllBets !== null) {
    renderOverviewContent(cards, S.overviewAllBets, phaseMatches);
    return;
  }

  cards.innerHTML = overviewSkeleton();

  // Einmalig ALLE Wetten (phasenübergreifend) laden und cachen
  const { data: allBets, error } = await db.from('bets')
    .select('*, goalscorer:players!first_goalscorer_id(id,name,team_id)')
    .in('match_id', S.matches.map(m => m.id));

  if (error) {
    cards.innerHTML = `<p style="color:var(--red);font-size:13px;padding:16px;">${error.message}</p>`;
    return;
  }

  S.overviewAllBets = allBets || [];
  renderOverviewContent(cards, S.overviewAllBets, phaseMatches);
}

function overviewSkeleton() {
  const card = `<div class="card" style="overflow:hidden;">
    <div style="background:var(--navy);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
      <div class="skel" style="width:90px;height:14px;opacity:.25;"></div>
      <div class="skel" style="width:60px;height:14px;opacity:.25;"></div>
    </div>
    <div style="padding:12px 14px;"><div class="skel" style="width:100%;height:11px;"></div></div>
  </div>`;
  return `<div class="skel" style="height:38px;border-radius:10px;"></div>
    <div style="display:flex;flex-direction:column;gap:14px;">${card}${card}${card}</div>`;
}

function buildOverviewMatchCardHTML(m, matchBets) {
  const locked = isLocked(m), isLive = locked && !isFinished(m.status);
  const fnH = getFinalScore(m, 'home'), fnA = getFinalScore(m, 'away');

  let ext = '';
  if (m.home_score_penalty !== null && m.home_score_penalty !== undefined) {
    ext = ` (${m.home_score_penalty}:${m.away_score_penalty} n.E.)`;
  } else if (m.home_score_extratime !== null && m.home_score_extratime !== undefined) {
    ext = ' n.V.';
  }

  // Underdog-Counts dieses Spiels (alle Tipps) – für Live-Bonus und Markierung.
  const udCounts = locked ? buildUnderdogCounts(matchBets) : null;
  matchBets.forEach(b => b._pts = calcBetPoints(m, b, udCounts));

  let iGotScorer = false, someoneGotScorer = false;
  const hasScorerResult = (locked && m.first_goalscorer) || (locked && isFinished(m.status) && m.is_goalless === true);
  if (hasScorerResult) {
    matchBets.forEach(b => {
      let isCorrect = false;
      if (m.is_goalless && b.is_goalless) isCorrect = true;
      if (m.first_goalscorer_id && b.first_goalscorer_id === m.first_goalscorer_id) isCorrect = true;
      if (isCorrect) {
        someoneGotScorer = true;
        if (b.user_id === S.user.id) iGotScorer = true;
      }
    });
  }

  let actualScorer = '';
  if (hasScorerResult) {
    let sName = '';
    if (m.first_goalscorer) {
      const scorerTeam = S.teams.find(x => x.id === m.first_goalscorer.team_id);
      const teamAcr = scorerTeam ? scorerTeam.name.substring(0,3).toUpperCase() : '';
      sName = teamAcr ? `⚽ ${m.first_goalscorer.name} (${teamAcr})` : `⚽ ${m.first_goalscorer.name}`;
    } else if (m.is_goalless) {
      sName = '🚫 Kein Tor';
    }
    let headerColor = '#FCA5A5';
    if (iGotScorer) headerColor = '#4ADE80';
    else if (someoneGotScorer) headerColor = '#FBBF24';
    actualScorer = `<span style="font-size:10px;color:${headerColor};font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${sName}</span>`;
  }

  let statusHtml = '';
  if (isFinished(m.status)) statusHtml = `<span class="mono">${fnH}:${fnA}${ext}</span>`;
  else if (isLive) statusHtml = `<span style="color:#FCA5A5;font-weight:800;" class="live-pulse">LIVE ${fnH ?? 0}:${fnA ?? 0}</span>`;
  else statusHtml = formatRelativeDate(m.kickoff_time);

  let displayRows = S.leaderboard.map(player => {
    const b = matchBets.find(x => x.user_id === player.id);
    return { player, bet: b, pts: b ? b._pts : 0 };
  });

  if (locked) {
    displayRows.sort((a, b) => b.pts - a.pts);
  } else {
    displayRows.sort((a, b) => {
      if (a.player.id === S.user.id) return -1;
      if (b.player.id === S.user.id) return 1;
      const ah = !!a.bet, bh = !!b.bet;
      if (ah && !bh) return -1; if (!ah && bh) return 1;
      return (a.player.display_name || '').localeCompare(b.player.display_name || '');
    });
  }

  const rows = displayRows.map(({ player, bet, pts }) => {
    const isMe = player.id === S.user.id;
    let scoreBadge = `<span style="color:var(--text-3);">–:–</span>`;
    let scorerBadge = `<span style="color:var(--text-3);">–</span>`;
    const hasBet = !!bet;
    const hasHome = hasBet && bet.home_score !== null && bet.away_score !== null;
    const isBoostedRow = (locked || isMe) && bet && bet.is_boosted === true;

    if (locked || isMe) {
      if (hasHome) {
        let bh = bet.home_score, ba = bet.away_score;
        let scoreStyle = "font-weight:800; font-family:'DM Mono', monospace; font-size:12px; display:inline-block; text-align:center; min-width:32px;";
        // Reine Textfarbe nach Punktstufe – kein Hintergrund, kein Durchstreichen.
        if (locked && fnH !== null) {
          if (bh === fnH && ba === fnA) scoreStyle += 'color:var(--score-exact);';                                   // exakt (3 P.) – dunkelgrün
          else if (bh - ba === fnH - fnA) scoreStyle += 'color:var(--score-diff);';                                  // Tordifferenz (2 P.) – hellgrün
          else if ((bh>ba && fnH>fnA) || (bh<ba && fnH<fnA) || (bh===ba && fnH===fnA)) scoreStyle += 'color:var(--score-tend);'; // Tendenz (1 P.) – gelb
          else scoreStyle += 'color:var(--score-wrong);';                                                            // falsch (0 P.) – rot
        }
        // Underdog-Marker: einziger mit dieser Tendenz → Ergebnis-Tipp unterstreichen (Textfarbe).
        if (locked && isRareTendency(bet, udCounts)) {
          scoreStyle += 'text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px;';
        }
        scoreBadge = `<span style="${scoreStyle}">${bh}:${ba}</span>`;
      }
      if (hasBet) {
        let sName = '–';
        if (bet.is_goalless) {
          sName = '🚫 Kein Tor';
        } else if (bet.goalscorer) {
          const scorerTeam = S.teams.find(x => x.id === bet.goalscorer.team_id);
          const acr = scorerTeam ? ` (${scorerTeam.name.substring(0,3).toUpperCase()})` : '';
          sName = bet.goalscorer.name + acr;
        }
        let scorerStyle = 'font-size:11px; font-weight:600; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        if (hasScorerResult) {
          let isCorrect = false;
          if (bet.is_goalless && m.is_goalless) isCorrect = true;
          if (bet.first_goalscorer_id && bet.first_goalscorer_id === m.first_goalscorer_id) isCorrect = true;
          if (isCorrect) {
            scorerStyle += 'color:var(--green); font-weight:700;';
            sName = '✓ ' + sName;
          } else {
            scorerStyle += 'color:var(--red); opacity:0.8;';
            sName = '✗ ' + sName;
          }
        } else {
          scorerStyle += 'color:var(--text-2);';
        }
        // Underdog-Marker: einziger mit diesem Torschützen → unterstreichen (Textfarbe).
        if (locked && isRareScorer(bet, udCounts)) scorerStyle += 'border-bottom:2px solid currentColor;';
        scorerBadge = `<span style="${scorerStyle}">${sName}</span>`;
      }
    } else {
      if (hasHome) scoreBadge = `<span style="font-weight:800; font-family:'DM Mono', monospace; font-size:12px;">?:?</span>`;
      if (hasBet) scorerBadge = `<span style="background:#F1F0EC;color:var(--text-3);padding:2px 6px;border-radius:4px;font-size:11px;">Verdeckt</span>`;
    }
    return `<div class="ov-row ${isMe ? 'me' : ''} ${isBoostedRow ? 'boosted-bg' : ''}">
      <span style="width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isMe?700:600};color:${isMe?'var(--blue)':'var(--text)'};">${player.display_name||'?'}</span>
      <span style="width:20%;text-align:center;">${scoreBadge}</span>
      <span style="width:40%;text-align:left;display:flex;align-items:center;min-width:0;">${scorerBadge}</span>
      <span style="width:12%;text-align:right;font-size:12px;display:flex;align-items:center;justify-content:flex-end;font-weight:700;color:${locked?'var(--text)':'var(--text-3)'};">${locked?pts:'-'}</span>
    </div>`;
  }).join('');

  let summaryHtml = '';
  if (locked) {
    const groups = {};
    displayRows.forEach(({player, pts}) => {
      if (!groups[pts]) groups[pts] = [];
      groups[pts].push((player.display_name || '?').split(' ')[0]);
    });
    summaryHtml = Object.keys(groups).sort((a,b)=>b-a).map(p =>
      `<span><strong style="color:${p > 0 ? 'var(--blue)' : 'var(--text-2)'};">${p} Pkt:</strong> <span style="color:var(--text-2);">${groups[p].join(', ')}</span></span>`
    ).join(' <span style="color:var(--border);margin:0 6px;">|</span> ');
  } else {
    const isFullBet = r => r.bet && r.bet.home_score !== null && r.bet.away_score !== null && (r.bet.first_goalscorer_id !== null || r.bet.is_goalless === true);
    const tipped = displayRows.filter(r => isFullBet(r)).map(r=>(r.player.display_name || '?').split(' ')[0]);
    const untipped = displayRows.filter(r => !isFullBet(r)).map(r=>(r.player.display_name || '?').split(' ')[0]);
    let parts = [];
    if (tipped.length) parts.push(`<span><strong style="color:var(--green);">Getippt (${tipped.length}):</strong> <span style="color:var(--text-2);">${tipped.join(', ')}</span></span>`);
    if (untipped.length) parts.push(`<span><strong style="color:var(--text-3);">Offen (${untipped.length}):</strong> <span style="color:var(--text-2);">${untipped.join(', ')}</span></span>`);
    summaryHtml = parts.join(' <span style="color:var(--border);margin:0 6px;">|</span> ');
    if (!summaryHtml) summaryHtml = '<span style="color:var(--text-3);">Noch keine Tipps</span>';
  }

  const hn = (m.home_team?.name || 'HM').substring(0,3).toUpperCase();
  const an = (m.away_team?.name || 'GS').substring(0,3).toUpperCase();

  const isExp = S.expandedMatches && S.expandedMatches.has(m.id);
  return `<div id="match-ov-card-${m.id}" class="card" style="overflow:hidden; scroll-margin-top:140px;">
    <div onclick="toggleMatchOverview(${m.id})" style="background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;">
      <div style="font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;flex-shrink:0;">
        ${flag(m.home_team,'w-4 h-3')}<span>${hn}–${an}</span>${flag(m.away_team,'w-4 h-3')}
      </div>
      <div style="display:flex;align-items:center;gap:8px;overflow:hidden;justify-content:flex-end;">
        ${actualScorer}
        <span class="mono" style="font-size:10px;font-weight:700;background:rgba(255,255,255,.1);padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;">${statusHtml}</span>
        <svg id="match-ov-icon-${m.id}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .2s;${isExp ? 'transform:rotate(180deg);' : ''}">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
    <div id="match-ov-summary-${m.id}" style="padding:12px 14px; font-size:11px; line-height:1.6;${isExp ? 'display:none;' : ''}">
      ${summaryHtml}
    </div>
    <div id="match-ov-body-${m.id}" style="display:${isExp ? 'block' : 'none'};">
      ${rows}
    </div>
  </div>`;
}

function renderOverviewContent(cards, allBets, phaseMatches) {
  // Nur Wetten der aktuellen Phase verwenden
  const phaseMatchIds = new Set(phaseMatches.map(m => m.id));
  const byMatch = {};
  (allBets || []).forEach(b => { if (phaseMatchIds.has(b.match_id)) (byMatch[b.match_id] ??= []).push(b); });

  const groups = {};
  phaseMatches.forEach(m => {
    const dLabel = getDateLabel(m.kickoff_time);
    if (!groups[dLabel]) groups[dLabel] = [];
    groups[dLabel].push(m);
  });

  // Auto-collapse date groups where all matches are finished (only on first visit)
  Object.keys(groups).forEach(dateLabel => {
    if (S.collapsedDates[dateLabel] === undefined) {
      if (groups[dateLabel].every(m => isFinished(m.status))) S.collapsedDates[dateLabel] = true;
    }
  });

  const groupedHtml = Object.keys(groups).map(dateLabel => {
    const matches = groups[dateLabel];
    const isCollapsed = S.collapsedDates[dateLabel];
    const iconRot = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
    const status = getDayTipStatus(matches); // ← NEU

    let groupHtml = `<div class="date-header${isCollapsed ? ' collapsed' : ''}" onclick="toggleDateGroup('${dateLabel}')">
      <span style="display:flex; align-items:center; gap:10px;">
        <span title="${status.label}" style="width:9px; height:9px; border-radius:50%; background:${status.color}; flex-shrink:0; box-shadow:0 0 0 2px ${status.color}22;"></span>
        <span>${dateLabel}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:${iconRot}"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>`;

    if (!isCollapsed) {
      groupHtml += `<div style="display:flex;flex-direction:column;gap:14px;">` +
        matches.map(m => buildOverviewMatchCardHTML(m, byMatch[m.id] || [])).join('') +
        `</div>`;
    }
    return groupHtml;
  }).join('');

  // In eigenen Wrapper packen, damit der gap:14 des Containers hier nicht greift
  cards.innerHTML = `<div style="display:flex;flex-direction:column;">${groupedHtml}</div>`;

  // Nach manuellem Aktualisieren: gemerkte Scroll-Position wiederherstellen
  if (S._pendingScroll != null) {
    const mainEl = $('main');
    if (mainEl) requestAnimationFrame(() => { mainEl.scrollTop = S._pendingScroll; S._pendingScroll = null; });
  }
}

function patchOverviewMatchCard(matchId) {
  const el = document.getElementById(`match-ov-card-${matchId}`);
  if (!el) return false;
  const m = S.matches.find(x => x.id === matchId);
  if (!m || m.phase !== S.overviewPhase) return false;

  // Open-State merken
  const oldBody = document.getElementById(`match-ov-body-${matchId}`);
  const wasExpanded = oldBody && oldBody.style.display === 'block';

  const matchBets = (S.overviewAllBets || []).filter(b => b.match_id === matchId);
  const newEl = htmlToElement(buildOverviewMatchCardHTML(m, matchBets));
  if (!newEl) return false;

  // Open-State wiederherstellen bevor das alte ersetzt wird
  if (wasExpanded) {
    const newBody = newEl.querySelector(`#match-ov-body-${matchId}`);
    const newSummary = newEl.querySelector(`#match-ov-summary-${matchId}`);
    const newIcon = newEl.querySelector(`#match-ov-icon-${matchId}`);
    if (newBody) newBody.style.display = 'block';
    if (newSummary) newSummary.style.display = 'none';
    if (newIcon) newIcon.style.transform = 'rotate(180deg)';
  }

  el.replaceWith(newEl);
  return true;
}

  if (!S.h2hRight || !all.find(p => p.id === S.h2hRight) || S.h2hRight === S.h2hLeft) {

  c.innerHTML = `
    <div style="padding:14px 16px 12px; display:flex; align-items:center; gap:8px;">
      ${selectBox('left', S.h2hLeft)}

      ${selectBox('right', S.h2hRight)}
    </div>
    <div id="h2h-content" style="">
      <div style="display:flex; justify-content:center; padding:60px 0;">
        <div class="spinner" style="width:22px;height:22px;border-top-color:var(--navy);border-color:var(--border);"></div>

window.setH2HSide = async function(side, userId) {
  if (side === 'left') S.h2hLeft = userId;
  else S.h2hRight = userId;
  await loadH2HInline();
}

async function loadH2HInline() {
  const container = $('h2h-content');
  if (!container) return;

  container.innerHTML = `<div style="display:flex; justify-content:center; padding:60px 0;"><div class="spinner" style="width:22px;height:22px;border-top-color:var(--navy);border-color:var(--border);"></div></div>`;

  // overviewAllBets (alle Tipps aller Spieler) sicherstellen – Basis für die
  // Underdog-Rarität pro Spiel (H2H selbst kennt nur die zwei Spieler).
  const ensureAllBets = async () => {
    if (S.overviewAllBets !== null) return;
    const { data } = await db.from('bets')
      .select('*, goalscorer:players!first_goalscorer_id(id,name,team_id)')
      .in('match_id', S.matches.map(m => m.id));
    if (data) S.overviewAllBets = data;
  };

  const [leftMap, rightMap] = await Promise.all([
    getH2HBetsMap(S.h2hLeft), getH2HBetsMap(S.h2hRight), ensureAllBets(), ensureExtraCaches()
  ]);
  if (leftMap === null || rightMap === null) {
    container.innerHTML = `<p style="color:var(--red); padding:24px; text-align:center; font-size:13px;">Tipps konnten nicht geladen werden.</p>`;
    return;
  }

  renderH2H(S.h2hLeft, S.h2hRight, leftMap, rightMap, container);
}

// Bets eines Spielers als Map (match_id -> bet); eigene aus S.bets, fremde aus Cache/DB
async function getH2HBetsMap(userId) {
  if (userId === S.user.id) return S.bets;
  if (!S.h2hCache) S.h2hCache = {};
  let bets = S.h2hCache[userId];
  if (!bets) {
    const { data, error } = await db.from('bets')
      .select('*, goalscorer:players!first_goalscorer_id(id,name,team_id)')
      .eq('user_id', userId);
    if (error) return null;
    bets = data || [];
    S.h2hCache[userId] = bets;
  }
  const map = {};
  bets.forEach(b => { map[b.match_id] = b; });
  return map;
}

async function loadTabelleData(filterType) {
  const c=$('table-content');
  if (!c) return;
  c.innerHTML=`<div style="display:flex;justify-content:center;padding:40px 0;"><div class="spinner" style="width:22px;height:22px;border-top-color:var(--navy);border-color:var(--border);"></div></div>`;

  if (!S.allBetsCache && filterType!=='total') {
    const {data,error}=await db.from('bets')
      .select('user_id,home_score,away_score,first_goalscorer_id,is_goalless,is_boosted,points_awarded,match:matches!inner(id,phase,home_score,away_score,home_score_extratime,away_score_extratime,status,kickoff_time,first_goalscorer_id,is_goalless)')
      .lte('match.kickoff_time', new Date().toISOString());
    if (error) { c.innerHTML=`<p style="color:var(--red);font-size:13px;">${error.message}</p>`; return; }
    S.allBetsCache=data||[];
  }

  if (filterType==='bonus') await ensureExtraCaches();

  let ranked=[];
  if (filterType==='total') {
    ranked=S.liveLeaderboard.map(p=>({id:p.id,display_name:p.display_name,value:p.total_points??0}));
  } else if (filterType==='inverted') {
    ranked=S.liveLeaderboard.map(p=>({id:p.id,display_name:p.display_name,value:p.total_points??0}));
    ranked.sort((a,b)=>a.value-b.value);
  } else if (filterType==='bonus') {
    const bonusBy=bonusPointsByUser();
    ranked=S.leaderboard.map(p=>({id:p.id,display_name:p.display_name,value:bonusBy[p.id]||0}));
    ranked.sort((a,b)=>b.value-a.value);
  } else {
    const scores={};
    S.leaderboard.forEach(p=>scores[p.id]={name:p.display_name,val:0});
    S.allBetsCache.forEach(b=>{
      if (!scores[b.user_id]) return;
      const m=b.match;
      const finalH=m.home_score_extratime!==null?m.home_score_extratime:m.home_score;
      const finalA=m.away_score_extratime!==null?m.away_score_extratime:m.away_score;
      const pts=calcBetPoints(m,b);
      if (filterType==='exact') {
        if (finalH!==null&&b.home_score===finalH&&b.away_score===finalA) scores[b.user_id].val++;
      } else if (filterType==='trend') {
        if (b.home_score!==finalH||b.away_score!==finalA) {
          if (finalH!==null) {
            const bd=b.home_score-b.away_score, md=finalH-finalA;
            if ((bd>0&&md>0)||(bd<0&&md<0)||(bd===0&&md===0)) scores[b.user_id].val++;
          }
        }
      } else if (filterType === 'first_scorer') {
        const fullMatch = S.matches.find(x => x.id === m.id);
        if (fullMatch && isFinished(fullMatch.status)) {
          if ((m.first_goalscorer_id && b.first_goalscorer_id === m.first_goalscorer_id) ||
              (fullMatch.is_goalless === true && b.is_goalless === true)) {
            scores[b.user_id].val++;
          }
        }
      } else if (filterType.startsWith('phase_')) {
        if (m.phase===filterType.replace('phase_','')) scores[b.user_id].val+=pts;
      }
    });
    ranked=Object.keys(scores).map(id=>({id,display_name:scores[id].name,value:scores[id].val}));
    ranked.sort((a,b)=>b.value-a.value);
  }

  const unit=filterType==='total'||filterType==='inverted'||filterType==='bonus'||filterType.startsWith('phase_')?'Pkt':'×';

  const inv = filterType === 'inverted';
  const rankAsc = (arr, idx) => {
    const v = arr[idx].value;
    let r = 1;
    for (let j = 0; j < arr.length; j++) if (j !== idx && arr[j].value < v) r++;
    return r;
  };
  c.innerHTML=`<div style="display:flex;flex-direction:column;gap:2px;">`+ranked.map((p,i)=>{
    const rn = inv ? rankAsc(ranked, i) : calculateRank(ranked, i);
    const displayRn = inv
      ? (i === 0 ? rn : (rankAsc(ranked, i - 1) === rn ? '°' : rn))
      : getDisplayRank(ranked, i);
    const isMe=p.id===S.user.id;
    const rankDisplay=displayRn==='°'?`<span style="font-weight:800;font-size:16px;color:var(--text-3);line-height:1;display:flex;align-items:center;justify-content:center;">•</span>`:`<span style="font-weight:800;font-size:13px;color:var(--text-3);">${displayRn}</span>`;
    return `<div class="lb-row ${isMe?'me':''}" data-tabelle-user="${p.id}" ${!isMe ? `onclick="openH2H('${p.id}')" style="cursor:pointer;"` : ''}>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:22px;text-align:center;font-size:16px;line-height:1;">${rankDisplay}</div>
        <div style="font-weight:${isMe?700:600};font-size:14px;color:${isMe?'var(--blue)':'var(--text)'};">${p.display_name||'?'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="syne" style="font-size:16px;font-weight:800;color:${isMe?'var(--blue)':'var(--text)'};"><span data-tabelle-val>${p.value}</span> <span style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--text-3);">${unit}</span></div>
        <span style="width:10px;text-align:center;color:var(--text-3);font-size:14px;line-height:1;display:inline-block;flex-shrink:0;">${!isMe ? '›' : ''}</span>
      </div>
    </div>`;
  }).join('')+(ranked.length===0?'<p style="text-align:center;font-size:13px;color:var(--text-3);padding:16px 0;">Keine Daten.</p>':'')+`</div>`;
}

function patchTabelleValues() {
  // Nur sinnvoll wenn Sub-View = tabelle UND Filter = total (Live-Werte)
  if (S.tabelleSubView !== 'tabelle' || S.tabelleFilter !== 'total') return;
  S.liveLeaderboard.forEach(p => {
    const row = document.querySelector(`[data-tabelle-user="${p.id}"]`);
    if (row) {
      const valEl = row.querySelector('[data-tabelle-val]');
      setText(valEl, p.total_points ?? 0);
    }
  });
}

async function renderPointsChart(container) {
  if (!container) return;

  // 1) Bets laden (falls Cache leer) — gleiche Query wie loadTabelleData
  if (!S.allBetsCache) {
    const { data, error } = await db.from('bets')
      .select('user_id,home_score,away_score,first_goalscorer_id,is_goalless,is_boosted,points_awarded,match:matches!inner(id,phase,home_score,away_score,home_score_extratime,away_score_extratime,status,kickoff_time,first_goalscorer_id,is_goalless)')
      .lte('match.kickoff_time', new Date().toISOString());
    if (error) {
      container.innerHTML = `<p style="font-size:13px;color:var(--red);text-align:center;padding:32px 0;">${error.message}</p>`;
      return;
    }
    S.allBetsCache = data || [];
  }

  // Bonus-/Extra-Punkte mitladen (zeitlich über das verknüpfte Spiel verankert)
  await ensureExtraCaches();
  const extraEvents = extraPointEvents();

  // 2) Punkte pro Tag aggregieren
  const dayMap = new Map(); // dateKey -> { userId: pointsThatDay }
  S.allBetsCache.forEach(b => {
    const m = b.match;
    if (!m) return;
    const dateKey = new Date(m.kickoff_time).toISOString().split('T')[0];
    if (!dayMap.has(dateKey)) dayMap.set(dateKey, {});
    const day = dayMap.get(dateKey);
    const pts = calcBetPoints(m, b);
    day[b.user_id] = (day[b.user_id] || 0) + pts;
  });
  // Bonus-Punkte am Anker-Tag (verknüpftes Spiel bzw. Frist) eintragen
  extraEvents.forEach(ev => {
    if (!ev.time) return;
    const dateKey = ev.time.toISOString().split('T')[0];
    if (!dayMap.has(dateKey)) dayMap.set(dateKey, {});
    const day = dayMap.get(dateKey);
    day[ev.userId] = (day[ev.userId] || 0) + ev.pts;
  });

  // 2b) Modi: Ansicht (Punkte- vs. Tabellenverlauf),
  //     X nach Spieltagen (Kalendertag) oder einzelnen Spielen,
  //     Y summiert (kumulativ) oder pro Tag/Spiel (nicht summiert; nur Punkteverlauf)
  if (S.chartView !== 'table') S.chartView = 'points';
  if (S.chartXMode !== 'matches') S.chartXMode = 'days';
  if (S.chartYMode !== 'per' && S.chartYMode !== 'diff') S.chartYMode = 'cumulative';
  const view = S.chartView, xMode = S.chartXMode, yMode = S.chartYMode;

  const fmtDate = ds => {
    const d = new Date(ds);
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
  };

  // Intervalle bilden — je Tag oder je Spiel, jeweils mit Punkte-Map pro User
  let intervals;
  if (xMode === 'matches') {
    const matchMap = new Map(); // matchId -> { kickoff, pts:{ userId: pts } }
    S.allBetsCache.forEach(b => {
      const m = b.match;
      if (!m) return;
      if (!matchMap.has(m.id)) matchMap.set(m.id, { kickoff: m.kickoff_time, pts: {} });
      const e = matchMap.get(m.id);
      e.pts[b.user_id] = (e.pts[b.user_id] || 0) + calcBetPoints(m, b);
    });
    // Bonus-Punkte dem verknüpften Spiel zuordnen; ohne Verknüpfung dem jüngsten
    // bereits gespielten Spiel-Intervall vor dem Anker-Zeitpunkt (Frist).
    const matchById = new Map(S.matches.map(m => [m.id, m]));
    extraEvents.forEach(ev => {
      let mid = ev.matchId;
      if (mid && matchById.has(mid)) {
        if (!matchMap.has(mid)) matchMap.set(mid, { kickoff: matchById.get(mid).kickoff_time, pts: {} });
      } else {
        mid = null;
        const t = ev.time ? ev.time.getTime() : Infinity;
        let bestT = -Infinity, firstT = Infinity, firstId = null;
        matchMap.forEach((e, id) => {
          const kt = new Date(e.kickoff).getTime();
          if (kt <= t && kt > bestT) { bestT = kt; mid = id; }
          if (kt < firstT) { firstT = kt; firstId = id; }
        });
        if (mid === null) mid = firstId; // kein vorheriges Spiel → frühestes Intervall
      }
      if (mid === null) return;
      const e = matchMap.get(mid);
      e.pts[ev.userId] = (e.pts[ev.userId] || 0) + ev.pts;
    });
    intervals = [...matchMap.values()]
      .sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff))
      .map(e => ({ pts: e.pts, label: fmtDate(e.kickoff) }));
  } else {
    intervals = [...dayMap.keys()].sort()
      .map(date => ({ pts: dayMap.get(date), label: fmtDate(date) }));
  }

  if (intervals.length === 0) {
    container.innerHTML = `
      <div class="syne" style="font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;">${view === 'table' ? 'Tabelle' : 'Punkte'}</div>
      <p style="text-align:center;color:var(--text-3);padding:24px 0;font-size:13px;">Noch keine beendeten Spiele.</p>`;
    return;
  }

  // 3) Spieler-Reihenfolge & Farben — nach aktuellem Rang, Ich = Blau
  const userIds = S.leaderboard.map(p => p.id);
  const COLOR_ME = '#2563EB';
  const PALETTE = ['#F0BC2C','#A78BFA','#34D399','#F87171','#FB923C','#22D3EE','#EC4899','#84CC16','#8B5CF6','#14B8A6','#E879F9','#FBBF24','#0EA5E9','#F472B6'];
  const ranked = S.liveLeaderboard.map(p => p.id).filter(uid => userIds.includes(uid));
  userIds.forEach(uid => { if (!ranked.includes(uid)) ranked.push(uid); });
  const colorOf = {};
  let pi = 0;
  ranked.forEach(uid => {
    if (uid === S.user.id) colorOf[uid] = COLOR_ME;
    else colorOf[uid] = PALETTE[pi++ % PALETTE.length];
  });

  // 4) Datenreihen pro User
  //    Punkteverlauf: Punkte — kumulativ (mit 0-Ursprung) oder pro Intervall
  //    Tabellenverlauf: Position 1..N je Intervall (aus kumulierten Punkten)
  const hasOrigin = (view === 'points' && yMode === 'cumulative');
  const series = {};
  if (view === 'table') {
    const cumPts = {};
    userIds.forEach(uid => { cumPts[uid] = 0; series[uid] = []; });
    intervals.forEach(iv => {
      userIds.forEach(uid => { cumPts[uid] += (iv.pts[uid] || 0); });
      // meiste Punkte = Position 1; kein Tiebreaker — gleiche Punkte = gleiche Position
      userIds.forEach(uid => {
        const pos = 1 + userIds.filter(o => cumPts[o] > cumPts[uid]).length;
        series[uid].push({ value: pos });
      });
    });
  } else if (yMode === 'diff') {
    // Differenz zum Durchschnitt aller Spieler je Intervall (Null-Linie = Mittel)
    const cum = {}; userIds.forEach(uid => { cum[uid] = 0; series[uid] = []; });
    intervals.forEach(iv => {
      userIds.forEach(uid => { cum[uid] += (iv.pts[uid] || 0); });
      const sum = userIds.reduce((s, uid) => s + cum[uid], 0);
      const avg = userIds.length ? sum / userIds.length : 0;
      userIds.forEach(uid => series[uid].push({ value: cum[uid] - avg }));
    });
  } else {
    userIds.forEach(uid => {
      const arr = [];
      if (yMode === 'cumulative') {
        arr.push({ value: 0 }); // Ursprung: 0 Punkte
        let total = 0;
        intervals.forEach(iv => { total += (iv.pts[uid] || 0); arr.push({ value: total }); });
      } else {
        intervals.forEach(iv => arr.push({ value: (iv.pts[uid] || 0) }));
      }
      series[uid] = arr;
    });
  }

  // Stützstellen
  const nPoints = intervals.length + (hasOrigin ? 1 : 0);
  const nSegments = Math.max(1, nPoints - 1);

  // 5) SVG-Geometrie — höher (mehr vertikaler Platz)
  const W = 600, H = 380;
  const padL = 34, padR = 14, padT = 16, padB = 28;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const xStep = chartW / nSegments;
  const xAt = i => padL + i * xStep;

  // Y-Abbildung: Punkte → Wertachse (0 unten); Tabelle → feste Rangskala (1 oben … N unten)
  //              Differenz → symmetrisch um 0 (Null-Linie in der Mitte)
  const nRanks = Math.max(1, userIds.length);
  const allVals = userIds.flatMap(uid => series[uid].map(p => p.value));
  const maxY = Math.max(1, ...allVals);
  const diffAbs = Math.max(1, ...allVals.map(v => Math.abs(v)));
  const yAt = (view === 'table')
    ? (rank => padT + ((rank - 1) / Math.max(1, nRanks - 1)) * chartH)
    : (yMode === 'diff'
        ? (v => padT + chartH / 2 - (v * (chartH / 2) / diffAbs))
        : (v => padT + chartH - (v * (chartH / maxY))));

  // Sichtbarkeits-State (welche Linien sind ausgeblendet)
  if (!S.chartHidden) S.chartHidden = new Set();
  S.chartContainer = container;

  // 6) Y-Achse: Gitterlinien + Beschriftung
  let yGrid = '';
  if (view === 'table') {
    const rankStep = Math.max(1, Math.ceil(nRanks / 10));
    for (let r = 1; r <= nRanks; r++) {
      const y = yAt(r);
      yGrid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E5DFD2" stroke-width="0.5" />`;
      if (r === 1 || r === nRanks || (r - 1) % rankStep === 0)
        yGrid += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="#9CA3AF" font-family="DM Mono">${r}.</text>`;
    }
  } else if (yMode === 'diff') {
    const yTicks = 4; // 2 oberhalb, 0-Linie, 2 unterhalb
    for (let i = -yTicks/2; i <= yTicks/2; i++) {
      const val = (diffAbs / (yTicks/2)) * i;
      const y = yAt(val);
      const isZero = i === 0;
      yGrid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${isZero ? '#9CA3AF' : '#E5DFD2'}" stroke-width="${isZero ? 1 : 0.5}" />`;
      const label = isZero ? '0' : (val > 0 ? '+' : '') + Math.round(val);
      yGrid += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="#9CA3AF" font-family="DM Mono">${label}</text>`;
    }
  } else {
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i++) {
      const y = padT + (chartH / yTicks) * i;
      const val = Math.round(maxY - (maxY / yTicks) * i);
      yGrid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E5DFD2" stroke-width="0.5" />`;
      yGrid += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="#9CA3AF" font-family="DM Mono">${val}</text>`;
    }
  }

  // 7) X-Achse: Labels (max ~6) — bei kumulativem Punkteverlauf zusätzlich 0-Ursprung
  const labelStep = Math.max(1, Math.ceil(intervals.length / 5));
  let xLabels = '';
  if (hasOrigin) {
    xLabels += `<text x="${xAt(0)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#9CA3AF" font-family="DM Mono">0</text>`;
  }
  intervals.forEach((iv, i) => {
    if (i % labelStep === 0 || i === intervals.length - 1) {
      const pointIdx = hasOrigin ? i + 1 : i;
      xLabels += `<text x="${xAt(pointIdx)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#9CA3AF" font-family="DM Mono">${iv.label}</text>`;
    }
  });

  // Zeichenreihenfolge: schlechtere Ränge zuerst, Top-Ränge darüber, Ich ganz oben
  const drawOrder = [...ranked].reverse().filter(uid => uid !== S.user.id);
  if (userIds.includes(S.user.id)) drawOrder.push(S.user.id);

  let lines = '';
  drawOrder.forEach(uid => {
    if (!series[uid] || S.chartHidden.has(uid)) return;
    const isMe = uid === S.user.id;
    const strokeColor = colorOf[uid];
    const strokeWidth = isMe ? 3 : 2;
    const opacity = isMe ? 1 : 0.85;

    const points = series[uid].map((p, i) => `${xAt(i).toFixed(1)},${yAt(p.value).toFixed(1)}`).join(' ');
    lines += `<polyline points="${points}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}" />`;

    // Endpunkt markieren
    const last = series[uid][series[uid].length - 1];
    lines += `<circle cx="${xAt(series[uid].length - 1).toFixed(1)}" cy="${yAt(last.value).toFixed(1)}" r="${isMe ? 4 : 3}" fill="${strokeColor}" stroke="#fff" stroke-width="1.5" />`;
  });

  // 8) Legende — alle Spieler, einzeln klickbar zum Ein-/Ausblenden
  const legendItems = ranked.map(uid => {
    const p = S.liveLeaderboard.find(x => x.id === uid) || S.leaderboard.find(x => x.id === uid);
    const isMe = uid === S.user.id;
    const hidden = S.chartHidden.has(uid);
    const name = isMe ? 'Du' : (p?.display_name || '?');
    // Tabelle: aktueller Platz (letzter Wert der Positionsreihe); Punkte: aktuelle Gesamtpunkte
    const suffix = (view === 'table')
      ? `${series[uid][series[uid].length - 1].value}.`
      : `${p?.total_points ?? 0}`;
    return `<div class="chart-legend-item${hidden ? ' is-hidden' : ''}" onclick="toggleChartLine('${uid}')">
      <span class="chart-legend-swatch" style="background:${colorOf[uid]};${isMe ? 'height:4px;' : ''}"></span>
      <span class="chart-legend-name"${isMe ? ' style="color:var(--blue);font-weight:700;"' : ''}>${name} · ${suffix}</span>
    </div>`;
  }).join('');

  const countLabel = xMode === 'matches'
    ? `${intervals.length} ${intervals.length === 1 ? 'Spiel' : 'Spiele'}`
    : `${intervals.length} ${intervals.length === 1 ? 'Tag' : 'Tage'}`;
  const perLabel = xMode === 'matches' ? 'Pro Spiel' : 'Pro Tag';
  const yAxisRow = (view === 'points') ? `
      <div class="chart-axis-row">
        <span class="chart-axis-label">Y Achse</span>
        <div class="chart-seg">
          <button class="chart-seg-btn${yMode === 'cumulative' ? ' is-active' : ''}" onclick="setChartYMode('cumulative')">Summiert</button>
          <button class="chart-seg-btn${yMode === 'per' ? ' is-active' : ''}" onclick="setChartYMode('per')">${perLabel}</button>
          <button class="chart-seg-btn${yMode === 'diff' ? ' is-active' : ''}" onclick="setChartYMode('diff')">Differenz</button>
        </div>
      </div>` : '';

  container.innerHTML = `
    <div class="chart-view-toggle">
      <button class="chart-view-btn${view === 'points' ? ' is-active' : ''}" onclick="setChartView('points')">Punkte</button>
      <button class="chart-view-btn${view === 'table' ? ' is-active' : ''}" onclick="setChartView('table')">Tabelle</button>
    </div>
    <div class="chart-axes">
      <div class="chart-axis-row">
        <span class="chart-axis-label">X Achse</span>
        <div class="chart-seg">
          <button class="chart-seg-btn${xMode === 'days' ? ' is-active' : ''}" onclick="setChartXMode('days')">Spieltage</button>
          <button class="chart-seg-btn${xMode === 'matches' ? ' is-active' : ''}" onclick="setChartXMode('matches')">Einzelne Spiele</button>
        </div>
      </div>${yAxisRow}
    </div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${yGrid}
      ${lines}
      ${xLabels}
    </svg>
    <div class="chart-legend-head">
      <button class="chart-legend-ctrl" onclick="setChartLines('all')">Alle</button>
      <button class="chart-legend-ctrl" onclick="setChartLines('me')">Nur ich</button>
      <span style="margin-left:auto;font-size:10px;color:var(--text-3);font-weight:600;white-space:nowrap;">${countLabel}</span>
    </div>
    <div class="chart-legend">${legendItems}</div>`;
}

window.toggleChartLine = function(uid) {
  if (!S.chartHidden) S.chartHidden = new Set();
  if (S.chartHidden.has(uid)) S.chartHidden.delete(uid);
  else S.chartHidden.add(uid);
  if (S.chartContainer) renderPointsChart(S.chartContainer);
};

window.setChartLines = function(mode) {
  S.chartHidden = new Set();
  if (mode === 'me') {
    S.leaderboard.forEach(p => { if (p.id !== S.user.id) S.chartHidden.add(p.id); });
  }
  if (S.chartContainer) renderPointsChart(S.chartContainer);
};

window.setChartXMode = function(mode) {
  S.chartXMode = (mode === 'matches') ? 'matches' : 'days';
  if (S.chartContainer) renderPointsChart(S.chartContainer);
};

window.setChartYMode = function(mode) {
  S.chartYMode = (mode === 'per' || mode === 'diff') ? mode : 'cumulative';
  if (S.chartContainer) renderPointsChart(S.chartContainer);
};

window.setChartView = function(mode) {
  S.chartView = (mode === 'table') ? 'table' : 'points';
  if (S.chartContainer) renderPointsChart(S.chartContainer);
};
