<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C1828" />
  <title>WM 2026 · Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0C1828; --bg-2:#101F33; --surface:#13233A; --surface-2:#19304D;
      --navy:#0C1828; --line:#243750; --line-2:#1B2C44;
      --text:#EAF0F7; --text-2:#9DB0C7; --text-3:#647890;
      --accent:#F0BC2C; --accent-2:#FFD45E;
      --red:#F1664F; --red-bg:#3A1C18; --green:#3FD089; --green-bg:#10301F;
      --blue:#5B9DFF; --blue-bg:#152844; --purple:#B98BFF;
    }
    *,*::before,*::after{box-sizing:border-box;}
    *{font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
    .syne{font-family:'Syne',sans-serif;}
    .mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--text);font-size:14px;}
    a{color:var(--blue);}
    ::-webkit-scrollbar{width:9px;height:9px;}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
    ::-webkit-scrollbar-track{background:transparent;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .fade{animation:fadeUp .22s ease both;}
    .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}

    /* Layout */
    .app{display:none;height:100%;grid-template-columns:232px 1fr;grid-template-rows:54px 1fr;
         grid-template-areas:"side top" "side main";}
    .topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 18px;
            background:var(--bg-2);border-bottom:1px solid var(--line-2);}
    .side{grid-area:side;background:var(--navy);border-right:1px solid var(--line-2);
          display:flex;flex-direction:column;overflow-y:auto;}
    .main{grid-area:main;overflow-y:auto;padding:22px;}
    @media(max-width:760px){
      .app{grid-template-columns:1fr;grid-template-rows:54px auto 1fr;
           grid-template-areas:"top" "side" "main";}
      .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line-2);}
      .nav-item{white-space:nowrap;}
      .main{padding:14px;}
    }

    /* Sidebar */
    .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line-2);}
    .nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
              color:var(--text-2);cursor:pointer;font-weight:600;font-size:13.5px;border:none;background:none;text-align:left;}
    .nav-item:hover{background:var(--surface);color:var(--text);}
    .nav-item.active{background:var(--surface-2);color:#fff;}
    .nav-item .ic{font-size:16px;width:20px;text-align:center;}

    /* Cards / KPI */
    .card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:16px;}
    .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
    .kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;}
    .kpi .v{font-family:'Syne';font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;}
    .kpi .l{color:var(--text-2);font-size:12px;margin-top:6px;font-weight:600;}

    /* Buttons */
    .btn{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px;
         padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
    .btn:hover{background:#21395a;}
    .btn.primary{background:var(--accent);color:#3A2B05;border-color:transparent;}
    .btn.primary:hover{background:var(--accent-2);}
    .btn.danger{background:var(--red-bg);color:var(--red);border-color:#5a261f;}
    .btn.ghost{background:none;border-color:var(--line);}
    .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px;}
    .btn:disabled{opacity:.45;cursor:not-allowed;}

    /* Inputs */
    input,select,textarea{background:var(--bg-2);color:var(--text);border:1px solid var(--line);
      border-radius:8px;padding:8px 10px;font-size:13px;outline:none;width:100%;}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);}
    label.fld{display:block;font-size:11.5px;color:var(--text-2);font-weight:700;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

    /* Table */
    .tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:12px;}
    table{border-collapse:collapse;width:100%;font-size:13px;}
    th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;}
    th{background:var(--bg-2);color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;}
    tr:hover td{background:var(--bg-2);}
    td.num,th.num{text-align:right;font-family:'DM Mono';}

    /* Badges */
    .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700;}
    .b-green{background:var(--green-bg);color:var(--green);}
    .b-red{background:var(--red-bg);color:var(--red);}
    .b-blue{background:var(--blue-bg);color:var(--blue);}
    .b-gray{background:var(--surface-2);color:var(--text-2);}
    .b-amber{background:#3A2E0E;color:var(--accent);}

    .pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
    .pagehead h1{font-family:'Syne';font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em;}
    .pagehead .sub{color:var(--text-2);font-size:12.5px;margin-top:2px;}

    /* Toast */
    #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;}
    .toast{padding:11px 15px;border-radius:11px;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .2s;}
    .toast.ok{background:var(--green);color:#04200F;}
    .toast.err{background:var(--red);color:#2A0A05;}

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(4,10,18,.74);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px;}
    .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;}
    .modal h3{font-family:'Syne';font-weight:800;font-size:18px;margin:0 0 14px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .hidden{display:none!important;}

    /* Sensitive banner */
    .sens-banner{background:linear-gradient(90deg,#3A1C18,#2A1410);border:1px solid #5a261f;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}

    /* Login */
    #login{display:flex;align-items:center;justify-content:center;height:100%;padding:18px;}
    .login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:380px;width:100%;}

    .toggle{position:relative;width:42px;height:24px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle .sl{position:absolute;inset:0;background:var(--line);border-radius:100px;transition:.2s;cursor:pointer;}
    .toggle .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
    .toggle input:checked + .sl{background:var(--red);}
    .toggle input:checked + .sl:before{transform:translateX(18px);}

    .empty{padding:40px;text-align:center;color:var(--text-3);}
    .mut{color:var(--text-2);}
    .pill-env{font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px;}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card fade">
    <div class="syne" style="font-weight:800;font-size:22px;">🛠️ WM 2026 Admin</div>
    <div class="mut" style="font-size:12.5px;margin:4px 0 20px;">Management & Debug Dashboard</div>

// ════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════
const $ = id => document.getElementById(id);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date();

function toast(msg, type='ok'){
  const t = el(`<div class="toast ${type}">${type==='ok'?'✓':'⚠'} ${esc(msg)}</div>`);
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600);
}
function fmtDT(d){ if(!d) return '–'; const x=new Date(d); return x.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fmtD(d){ if(!d) return '–'; return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function fmtT(d){ if(!d) return '–'; return new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
function fmtAgo(d){
  if(!d) return '–';
  const s=Math.floor((now()-new Date(d))/1000);
  if(s<0) return 'gerade';
  if(s<60) return 'vor '+s+' s';
  const m=Math.floor(s/60); if(m<60) return 'vor '+m+' min';
  const h=Math.floor(m/60); if(h<24) return 'vor '+h+' h';
  const t=Math.floor(h/24); if(t<30) return 'vor '+t+' Tg.';
  return fmtD(d);
}
function isOnline(d){ return d && (now()-new Date(d))<5*60*1000; }   // < 5 min = online
function isLocked(m){ return new Date(m.kickoff_time) <= now(); }                 // Spiel angestoßen
function isFinished(s){ return s && ['FINISHED','FT','AET','PEN'].includes(String(s).toUpperCase()); }
function toLocalInput(d){ if(!d) return ''; const x=new Date(d); const off=x.getTimezoneOffset(); const l=new Date(x.getTime()-off*60000); return l.toISOString().slice(0,16); }
function num(v){ return (v===null||v===undefined||v==='')?null:Number(v); }

function statusBadge(s){
  if(!s) return '<span class="badge b-gray">–</span>';
  const u=s.toUpperCase();
  if(isFinished(u)) return `<span class="badge b-gray">${esc(s)}</span>`;
  if(['IN_PLAY','LIVE','PLAYING','PAUSED','HALFTIME','HT'].includes(u)) return `<span class="badge b-red">● ${esc(s)}</span>`;
  if(['SCHEDULED','TIMED','UPCOMING'].includes(u)) return `<span class="badge b-blue">${esc(s)}</span>`;
  return `<span class="badge b-amber">${esc(s)}</span>`;
}

// ════════════════════════════════════════════
//  SUPABASE / AUTH
// ════════════════════════════════════════════
function buildClient(env){
  const c = ENVS[env];
  return supabase.createClient(c.url, c.key, { auth:{ storageKey:'admin_auth_'+env } });
}

// ── Admin-Proxy (service_role serverseitig) ───────────────────
// Schreibvorgänge laufen über die Vercel-Function /api/admin.
// Lesen bleibt auf dem Anon-Key (RLS schützt fremde Tipps).
function proxyUrl(){ return localStorage.getItem('admin_proxy_url') || '/api/admin'; }
async function adminCall(action, payload){
  const { data:{ session } } = await A.db.auth.getSession();
  if(!session) throw new Error('Keine aktive Session');
  const res = await fetch(proxyUrl(), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
    body: JSON.stringify({ env:A.env, action, ...payload })
  });
  let json=null; try{ json=await res.json(); }catch(e){}
  if(!res.ok) throw new Error((json&&json.error) || ('Proxy HTTP '+res.status+' – ist /api/admin deployed?'));
  return json;
}
// Gibt {error} zurück (wie supabase) – vereinfacht die Edit-Handler.
async function adminWrite(table, action, payload){
  try { await adminCall(action, { table, ...payload }); return {error:null}; }
  catch(e){ return {error:e}; }
}
async function proxyHealth(){
  try{ const r=await fetch(proxyUrl(),{method:'GET'}); if(!r.ok) return {ok:false}; return await r.json(); }
  catch(e){ return {ok:false, err:e.message}; }
}

async function doLogin(){
  const env = $('login-env').value;
  const email = $('login-email').value.trim();
  const pw = $('login-pw').value;
  $('login-err').textContent = '';
  if(!email||!pw){ $('login-err').textContent='E-Mail und Passwort eingeben.'; return; }
  A.env = env; localStorage.setItem('admin_env', env);
  A.db = buildClient(env);
  const { data, error } = await A.db.auth.signInWithPassword({ email, password: pw });
  if(error){ $('login-err').textContent = error.message; return; }
  A.user = data.user;
  enterApp();
}

async function doLogout(){
  if(A.db) await A.db.auth.signOut();
  A.user=null; A.cache={}; stopRealtime();
  $('app').style.display='none'; $('login').style.display='flex';
}

async function tryRestore(){
  $('login-env').value = A.env;
  A.db = buildClient(A.env);
  const { data } = await A.db.auth.getSession();
  if(data && data.session){ A.user = data.session.user; enterApp(); }
}

function enterApp(){
  $('login').style.display='none';
  $('app').style.display='grid';
  const e = ENVS[A.env];
  const pill = $('env-pill');
  pill.textContent = e.label;
  pill.style.background = A.env==='prod' ? 'var(--red-bg)' : 'var(--blue-bg)';

  $('who').textContent = A.user?.email || '';
  if(A.user && ADMIN_EMAILS.length && !ADMIN_EMAILS.includes((A.user.email||'').toLowerCase())){
    $('topbar-info').innerHTML = '<span style="color:var(--accent)">⚠ Kein Admin-Konto – Schreibrechte/Datenzugriff per RLS limitiert</span>';
  }
  buildNav();
  refreshAll();
}

// ════════════════════════════════════════════
//  DATA LOADING
// ════════════════════════════════════════════
// Supabase liefert serverseitig max. 1000 Zeilen pro Request → paginiert nachladen.
const PAGE=1000;
async function pagedSelect(table, sel='*', apply, max=Infinity){
  let from=0, all=[];
  while(from<max){
    const to=Math.min(from+PAGE, max)-1;        // range() zuletzt → gewinnt über apply
    let q=A.db.from(table).select(sel);
    if(apply) q=apply(q);
    q=q.range(from, to);
    const { data, error } = await q;
    if(error) return { data:all, error };
    all=all.concat(data||[]);
    if(!data || data.length<(to-from+1)) break;
    from=to+1;
  }
  return { data:all, error:null };
}

async function loadCore(force=false){
  if(A.cache.matches && !force) return A.cache;
  const db = A.db;
  const matchSel='*, home_team:teams!home_team_id(id,name,flag_url,group), away_team:teams!away_team_id(id,name,flag_url,group), first_goalscorer:players!first_goalscorer_id(id,name)';
  const [mRes,tRes,pRes,prRes,rRes,ssRes] = await Promise.all([
    pagedSelect('matches', matchSel, q=>q.order('kickoff_time',{ascending:true})),
    pagedSelect('teams', '*', q=>q.order('name')),
    pagedSelect('players', '*', q=>q.order('name')),
    pagedSelect('profiles', '*', q=>q.order('display_name')),
    pagedSelect('user_rankings', '*'),
    db.from('system_state').select('*').limit(1)
  ]);
  const errs=[mRes,tRes,pRes,prRes,rRes].filter(r=>r.error).map(r=>r.error.message);
  if(errs.length) toast('Ladefehler: '+errs[0],'err');
  A.cache.matches = mRes.data||[];
  A.cache.teams   = tRes.data||[];
  A.cache.players = pRes.data||[];
  A.cache.profiles= prRes.data||[];
  A.cache.rankings= rRes.data||[];
  A.cache.system  = (ssRes.data&&ssRes.data[0])||null;
  // Lookups
  A.cache.teamById  = Object.fromEntries(A.cache.teams.map(t=>[t.id,t]));
  A.cache.playerById= Object.fromEntries(A.cache.players.map(p=>[p.id,p]));
  A.cache.profById  = Object.fromEntries(A.cache.profiles.map(p=>[p.id,p]));
  A.cache.rankById  = Object.fromEntries(A.cache.rankings.map(r=>[r.user_id,r]));
  return A.cache;
}

async function refreshAll(){
  $('view').innerHTML = `<div style="display:flex;justify-content:center;padding:60px;"><div class="spinner"></div></div>`;
  await loadCore(true);
  $('topbar-info').innerHTML = `<span class="mut">Geladen: ${A.cache.matches.length} Spiele · ${A.cache.profiles.length} Nutzer · ${A.cache.teams.length} Teams · Stand ${fmtT(now())}</span>`;
  renderView();
}

function viewOverview(host){
  const c=A.cache;
  const live = c.matches.filter(m=>isLocked(m)&&!isFinished(m.status));
  const finished = c.matches.filter(m=>isFinished(m.status));
  const upcoming = c.matches.filter(m=>!isLocked(m));
  const next = upcoming[0];
  const unprocessed = c.matches.filter(m=>isFinished(m.status)&&!m.points_processed);
  const noGroup = c.teams.filter(t=>!t.group).length;
  pageHead(host,'Übersicht','Systemstatus & Kennzahlen');

  const kpis=[
    ['Spiele', c.matches.length, 'var(--text)'],
    ['Live', live.length, live.length?'var(--red)':'var(--text)'],
    ['Beendet', finished.length, 'var(--text)'],
    ['Anstehend', upcoming.length, 'var(--text)'],
    ['Nutzer', c.profiles.length, 'var(--text)'],
    ['Online', c.profiles.filter(p=>isOnline(p.last_seen_at)).length, c.profiles.some(p=>isOnline(p.last_seen_at))?'var(--green)':'var(--text)'],
    ['Teams', c.teams.length, 'var(--text)'],
    ['Spieler', c.players.length, 'var(--text)'],
    ['API-Calls', c.system?.count_calls ?? '–', 'var(--text-2)'],
  ];
  host.appendChild(el(`<div class="kpis fade" style="margin-bottom:18px;">${kpis.map(([l,v,col])=>
    `<div class="kpi"><div class="v" style="color:${col}">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`));

  // Hinweise / Health
  const warns=[];
  if(unprocessed.length) warns.push(`${unprocessed.length} beendete Spiele ohne <b>points_processed</b> – Punkte evtl. noch nicht vergeben`);
  if(noGroup) warns.push(`${noGroup} Teams ohne Gruppe`);
  const teamlessMatches = c.matches.filter(m=>!m.home_team||!m.away_team).length;
  if(teamlessMatches) warns.push(`${teamlessMatches} Spiele mit fehlendem Team-Verweis`);
  host.appendChild(el(`<div class="card fade" style="margin-bottom:16px;">
    <div class="syne" style="font-weight:800;margin-bottom:10px;">Health-Check</div>
    ${warns.length? warns.map(w=>`<div style="padding:6px 0;color:var(--accent)">⚠ ${w}</div>`).join('')
                  : '<div style="color:var(--green)">✓ Keine Auffälligkeiten</div>'}
  </div>`));

  // Live + nächstes Spiel
  let liveHtml = live.length ? live.map(m=>matchLineRow(m)).join('') : '<div class="empty">Keine laufenden Spiele</div>';
  host.appendChild(el(`<div class="card fade" style="margin-bottom:16px;">
    <div class="syne" style="font-weight:800;margin-bottom:10px;">🔴 Laufende Spiele</div>${liveHtml}</div>`));

  host.appendChild(el(`<div class="card fade">
    <div class="syne" style="font-weight:800;margin-bottom:10px;">⏭️ Nächstes Spiel</div>
    ${next? matchLineRow(next) : '<div class="empty">Kein anstehendes Spiel</div>'}</div>`));
}
function teamName(m,side){ const t=m[side+'_team']; return t?`${t.flag_url&&!t.flag_url.startsWith('http')?t.flag_url+' ':''}${esc(t.name)}`:('#'+m[side+'_team_id']); }
function matchLineRow(m){
  const sc = (m.home_score!=null)?`${m.home_score}:${m.away_score}`:'–:–';
  return `<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-2)">
    <div style="flex:1">${teamName(m,'home')} <span class="mut">vs</span> ${teamName(m,'away')}</div>
    <div class="mono" style="width:60px;text-align:center">${sc}</div>
    <div style="width:140px;text-align:right" class="mut">${fmtDT(m.kickoff_time)}</div>
    <div style="width:110px;text-align:right">${statusBadge(m.status)}</div>
  </div>`;
}

A._mFilter = {phase:'', status:'', q:''};
function viewMatches(host){
  const c=A.cache;
  const phases=[...new Set(c.matches.map(m=>m.phase))];
  pageHead(host,'Spiele', c.matches.length+' Spiele · Scores, Status, Anstoß & Torschütze bearbeiten');
  const bar = el(`<div class="card fade" style="margin-bottom:14px;">
    <div class="row">
      <div style="flex:1;min-width:160px"><label class="fld">Suche</label><input id="m-q" placeholder="Team…" value="${esc(A._mFilter.q)}"></div>
      <div style="min-width:140px"><label class="fld">Phase</label><select id="m-phase"><option value="">Alle</option>${phases.map(p=>`<option ${A._mFilter.phase===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div style="min-width:140px"><label class="fld">Status</label>
        <select id="m-status"><option value="">Alle</option>
          <option value="live" ${A._mFilter.status==='live'?'selected':''}>Live</option>
          <option value="upcoming" ${A._mFilter.status==='upcoming'?'selected':''}>Anstehend</option>
          <option value="finished" ${A._mFilter.status==='finished'?'selected':''}>Beendet</option>
          <option value="unprocessed" ${A._mFilter.status==='unprocessed'?'selected':''}>Beendet, nicht verrechnet</option>
        </select></div>
    </div></div>`);
  host.appendChild(bar);
  const tblHost = el('<div></div>'); host.appendChild(tblHost);
  const apply=()=>{
    A._mFilter={ q:$('m-q').value.toLowerCase(), phase:$('m-phase').value, status:$('m-status').value };
    drawMatches(tblHost);
  };
  $('m-q').oninput=apply; $('m-phase').onchange=apply; $('m-status').onchange=apply;
  drawMatches(tblHost);
}
function filteredMatches(){
  const f=A._mFilter;
  return A.cache.matches.filter(m=>{
    if(f.phase && m.phase!==f.phase) return false;
    if(f.q){ const s=((m.home_team?.name||'')+' '+(m.away_team?.name||'')).toLowerCase(); if(!s.includes(f.q)) return false; }
    if(f.status==='live' && !(isLocked(m)&&!isFinished(m.status))) return false;
    if(f.status==='upcoming' && isLocked(m)) return false;
    if(f.status==='finished' && !isFinished(m.status)) return false;
    if(f.status==='unprocessed' && !(isFinished(m.status)&&!m.points_processed)) return false;
    return true;
  });
}
function drawMatches(tblHost){
  const rows=filteredMatches();
  tblHost.innerHTML = `<div class="tbl-wrap fade"><table>
    <thead><tr><th>ID</th><th>Anstoß</th><th>Phase</th><th>Heim</th><th>Gast</th><th class="num">Ergebnis</th><th>Status</th><th>Torschütze</th><th>✓Pkt</th><th></th></tr></thead>
    <tbody>${rows.map(m=>{
      const sc = m.home_score!=null? `${m.home_score}:${m.away_score}` : '–';
      const et = (m.home_score_extratime!=null)?` <span class="mut">n.V. ${m.home_score_extratime}:${m.away_score_extratime}</span>`:'';
      const pen= (m.home_score_penalty!=null)?` <span class="mut">i.E. ${m.home_score_penalty}:${m.away_score_penalty}</span>`:'';
      return `<tr>
        <td class="mut mono">${m.id}</td>
        <td>${fmtDT(m.kickoff_time)}</td>
        <td><span class="badge b-gray">${esc(m.phase)}</span></td>
        <td>${teamName(m,'home')}</td>
        <td>${teamName(m,'away')}</td>
        <td class="num">${sc}${et}${pen}</td>
        <td>${statusBadge(m.status)}</td>
        <td class="mut">${m.first_goalscorer?esc(m.first_goalscorer.name):(m.is_goalless?'torlos':'–')}</td>
        <td>${m.points_processed?'<span class="badge b-green">ja</span>':'<span class="badge b-red">nein</span>'}</td>
        <td><button class="btn sm" onclick="editMatch(${m.id})">✎</button></td>
      </tr>`;
    }).join('')}</tbody></table></div>
    <div class="mut" style="margin-top:8px;font-size:12px">${rows.length} Spiele</div>`;
}

async function editMatch(id){
  const m = A.cache.matches.find(x=>x.id===id); if(!m) return;
  // Spielerliste beider Teams für Torschützen-Auswahl
  const teamPlayers = A.cache.players.filter(p=>p.team_id===m.home_team_id||p.team_id===m.away_team_id)
    .sort((a,b)=>a.name.localeCompare(b.name));
  const statusOpts = ['SCHEDULED','TIMED','IN_PLAY','PAUSED','FINISHED','AET','PEN','POSTPONED','SUSPENDED','CANCELLED'];
  const body = `
    <h3>Spiel #${m.id} bearbeiten</h3>
    <div class="mut" style="margin-bottom:12px">${teamName(m,'home')} vs ${teamName(m,'away')}</div>
    <div class="grid2">
      <div><label class="fld">Heim Tore</label><input id="e-hs" type="number" value="${m.home_score??''}"></div>
      <div><label class="fld">Gast Tore</label><input id="e-as" type="number" value="${m.away_score??''}"></div>
      <div><label class="fld">Heim n.V.</label><input id="e-het" type="number" value="${m.home_score_extratime??''}"></div>
      <div><label class="fld">Gast n.V.</label><input id="e-aet" type="number" value="${m.away_score_extratime??''}"></div>
      <div><label class="fld">Heim i.E.</label><input id="e-hp" type="number" value="${m.home_score_penalty??''}"></div>
      <div><label class="fld">Gast i.E.</label><input id="e-ap" type="number" value="${m.away_score_penalty??''}"></div>
      <div><label class="fld">Status</label><select id="e-status">${statusOpts.map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}${statusOpts.includes(m.status)?'':`<option selected>${esc(m.status)}</option>`}</select></div>
      <div><label class="fld">Phase</label><input id="e-phase" value="${esc(m.phase)}"></div>
      <div style="grid-column:1/3"><label class="fld">Anstoß</label><input id="e-ko" type="datetime-local" value="${toLocalInput(m.kickoff_time)}"></div>
      <div style="grid-column:1/3"><label class="fld">Erster Torschütze</label>
        <select id="e-scorer"><option value="">– keiner –</option>
          ${teamPlayers.map(p=>`<option value="${p.id}" ${m.first_goalscorer_id===p.id?'selected':''}>${esc(p.name)} (${A.cache.teamById[p.team_id]?.name||''})</option>`).join('')}
        </select></div>
    </div>
    <div class="row" style="margin-top:14px;gap:18px">
      <label class="row" style="gap:7px"><input type="checkbox" id="e-goalless" ${m.is_goalless?'checked':''} style="width:auto"> torlos (kein Torschütze)</label>
      <label class="row" style="gap:7px"><input type="checkbox" id="e-proc" ${m.points_processed?'checked':''} style="width:auto"> points_processed</label>
      <label class="row" style="gap:7px"><input type="checkbox" id="e-rem" ${m.reminder_sent?'checked':''} style="width:auto"> reminder_sent</label>
    </div>
  `;
  openModal(body, async ()=>{
    const patch = {
      home_score:num($('e-hs').value), away_score:num($('e-as').value),
      home_score_extratime:num($('e-het').value), away_score_extratime:num($('e-aet').value),
      home_score_penalty:num($('e-hp').value), away_score_penalty:num($('e-ap').value),
      status:$('e-status').value, phase:$('e-phase').value,
      kickoff_time: $('e-ko').value? new Date($('e-ko').value).toISOString() : m.kickoff_time,
      first_goalscorer_id: $('e-scorer').value? Number($('e-scorer').value): null,
      is_goalless: $('e-goalless').checked,
      points_processed: $('e-proc').checked,
      reminder_sent: $('e-rem').checked,
      updated_at: new Date().toISOString()
    };
    const { error } = await adminWrite('matches','update',{ id:m.id, values:patch });
    if(error){ toast(error.message,'err'); return false; }
    Object.assign(m, patch);
    if(patch.first_goalscorer_id) m.first_goalscorer={id:patch.first_goalscorer_id,name:A.cache.playerById[patch.first_goalscorer_id]?.name}; else m.first_goalscorer=null;
    toast('Spiel gespeichert'); renderView(); return true;
  }, 'Spiel speichern');
}

async function viewBets(host){
  pageHead(host,'Tipps 🔒','Eigene Tipps frei · fremde Tipps nur hinter hartem Filter');
  host.appendChild(el(sensitiveBanner()));
  const body=el(`<div><div style="display:flex;justify-content:center;padding:40px"><div class="spinner"></div></div></div>`);
  host.appendChild(body);
  const c=A.cache;

  // 1) Eigene Tipps (immer sichtbar)
  const myId=A.user.id;
  const { data:myBets } = await A.db.from('bets').select('*, goalscorer:players!first_goalscorer_id(id,name)').eq('user_id',myId);

  // 2) Aggregat: wie viele Tipps pro Spiel (NUR Zahlen, keine Werte) – über alle Spiele erlaubt
  const { data:agg } = await pagedSelect('bets','match_id');
  const countByMatch={}; (agg||[]).forEach(b=>countByMatch[b.match_id]=(countByMatch[b.match_id]||0)+1);

  // 3) Fremde Tipps – HARTER FILTER: nur angestoßene Spiele, nur wenn Schalter an
  let foreign=[];
  if(A.showSensitive){
    const lockedIds = c.matches.filter(m=>isLocked(m)).map(m=>m.id);
    if(lockedIds.length){
      const { data:fb, error } = await pagedSelect('bets',
        '*, goalscorer:players!first_goalscorer_id(id,name)',
        q=>q.in('match_id', lockedIds).neq('user_id', myId));
      if(error) toast(error.message,'err');
      foreign = fb||[];
    }
  }

  body.innerHTML='';
  const myByMatch=Object.fromEntries((myBets||[]).map(b=>[b.match_id,b]));

  // Aggregat-Übersicht (immer)
  const totalUsers=c.profiles.length;
  body.appendChild(el(`<div class="card fade" style="margin-bottom:14px">
    <div class="syne" style="font-weight:800;margin-bottom:10px">Tipp-Abdeckung (nur Zahlen)</div>
    <div class="tbl-wrap"><table><thead><tr><th>Spiel</th><th>Anstoß</th><th>Status</th><th class="num">Tipps abgegeben</th><th>Mein Tipp</th></tr></thead>
      <tbody>${c.matches.map(m=>{
        const my=myByMatch[m.id];
        const myStr = my? (my.is_goalless?'torlos':`${my.home_score??'–'}:${my.away_score??'–'}${my.is_boosted?' ⚡':''}`):'<span class="mut">–</span>';
        return `<tr><td>${teamName(m,'home')} vs ${teamName(m,'away')}</td><td class="mut">${fmtDT(m.kickoff_time)}</td>
          <td>${isLocked(m)?(isFinished(m.status)?'<span class="badge b-gray">beendet</span>':'<span class="badge b-red">angestoßen</span>'):'<span class="badge b-blue">offen</span>'}</td>
          <td class="num">${countByMatch[m.id]||0} / ${totalUsers}</td><td class="mono">${myStr}</td></tr>`;
      }).join('')}</tbody></table></div></div>`));

  // Fremde Tipps Tabelle (nur wenn aktiv)
  if(A.showSensitive){
    if(!foreign.length){
      body.appendChild(el(`<div class="card fade"><div class="empty">Keine fremden Tipps für angestoßene Spiele vorhanden.</div></div>`));
    } else {
      const matchById=Object.fromEntries(c.matches.map(m=>[m.id,m]));
      foreign.sort((a,b)=> new Date(matchById[b.match_id]?.kickoff_time||0)-new Date(matchById[a.match_id]?.kickoff_time||0));
      body.appendChild(el(`<div class="card fade">
        <div class="syne" style="font-weight:800;margin-bottom:10px">Fremde Tipps – angestoßene Spiele (${foreign.length})</div>
        <div class="tbl-wrap"><table><thead><tr><th>Nutzer</th><th>Spiel</th><th class="num">Tipp</th><th>Torschütze</th><th class="num">Punkte</th><th>⚡</th></tr></thead>
        <tbody>${foreign.map(b=>{
          const m=matchById[b.match_id];
          return `<tr><td>${esc(c.profById[b.user_id]?.display_name||b.user_id.slice(0,8))}</td>
            <td class="mut">${m?teamName(m,'home')+' vs '+teamName(m,'away'):'#'+b.match_id}</td>
            <td class="num mono">${b.is_goalless?'torlos':`${b.home_score??'–'}:${b.away_score??'–'}`}</td>
            <td class="mut">${b.goalscorer?esc(b.goalscorer.name):'–'}</td>
            <td class="num">${b.points_awarded??'–'}</td><td>${b.is_boosted?'⚡':''}</td></tr>`;
        }).join('')}</tbody></table></div></div>`));
    }
  }
}

async function editExtraQ(id){
  let q={question_text:'',points:5,answer_type:'text',correct_answer:'',deadline:''};
  if(id){ const {data}=await A.db.from('extra_questions').select('*').eq('id',id).single(); if(data) q=data; }
  openModal(`<h3>${id?'Frage #'+id:'Neue Extra-Frage'}</h3>
    <label class="fld">Fragetext</label><textarea id="q-text" rows="2" style="margin-bottom:10px">${esc(q.question_text)}</textarea>
    <div class="grid2">
      <div><label class="fld">Punkte</label><input id="q-pts" type="number" value="${q.points}"></div>
      <div><label class="fld">Antworttyp</label><select id="q-type">${['text','number','boolean','player','team'].map(t=>`<option ${q.answer_type===t?'selected':''}>${t}</option>`).join('')}${['text','number','boolean','player','team'].includes(q.answer_type)?'':`<option selected>${esc(q.answer_type)}</option>`}</select></div>
    </div>
    <label class="fld" style="margin-top:10px">Deadline</label><input id="q-dl" type="datetime-local" value="${toLocalInput(q.deadline)}" style="margin-bottom:10px">
    <label class="fld">Richtige Antwort (zum Auswerten)</label><input id="q-ans" value="${esc(q.correct_answer||'')}">`,
    async()=>{
      const patch={question_text:$('q-text').value,points:num($('q-pts').value),answer_type:$('q-type').value,
        correct_answer:$('q-ans').value||null, deadline: $('q-dl').value? new Date($('q-dl').value).toISOString():q.deadline};
      if(!patch.question_text||!patch.deadline){toast('Text & Deadline nötig','err');return false;}
      const res = id? await adminWrite('extra_questions','update',{ id, values:patch })
                    : await adminWrite('extra_questions','insert',{ values:patch });
      if(res.error){toast(res.error.message,'err');return false;}
      toast(id?'Frage gespeichert':'Frage angelegt'); renderView(); return true;
    }, undefined, id? `<button class="btn danger sm" onclick="delExtraQ(${id})">Löschen</button>`:'');
}
async function delExtraQ(id){
  if(!confirm('Frage #'+id+' wirklich löschen?')) return;
  const {error}=await adminWrite('extra_questions','delete',{ id });
  if(error){toast(error.message,'err');return;}
  closeModal(); toast('Gelöscht'); renderView();
}

async function runBrowser(){

function viewRealtime(host){
  pageHead(host,'Realtime-Monitor','Live DB-Änderungen (matches, bets …)',
    `<button class="btn ${A.rtChannel?'danger':'primary'} sm" onclick="toggleRealtime()">${A.rtChannel?'■ Stoppen':'● Starten'}</button>`);
  host.appendChild(el(`<div class="card fade"><div id="rt-status" class="mut" style="margin-bottom:10px">${A.rtChannel?'<span style="color:var(--green)">● verbunden</span>':'gestoppt'}</div>
    <div id="rt-log" style="font-family:'DM Mono';font-size:12px;max-height:60vh;overflow-y:auto">${A.rtLog.length?A.rtLog.map(rtLine).join(''):'<div class="empty">Noch keine Events</div>'}</div></div>`));
}
function rtLine(e){ return `<div style="padding:5px 0;border-bottom:1px solid var(--line-2)"><span class="mut">${e.t}</span> <span class="badge b-${e.event==='INSERT'?'green':e.event==='DELETE'?'red':'blue'}">${e.event}</span> <b>${e.table}</b> ${esc(e.summary)}</div>`; }
function toggleRealtime(){ A.rtChannel? stopRealtime() : startRealtime(); renderView(); }
function startRealtime(){
  A.rtChannel = A.db.channel('admin-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'matches'},p=>logRt('matches',p))
    .on('postgres_changes',{event:'*',schema:'public',table:'bets'},p=>logRt('bets',p))
    .on('postgres_changes',{event:'*',schema:'public',table:'match_events'},p=>logRt('match_events',p))
    .subscribe();
}
function stopRealtime(){ if(A.rtChannel){ A.db.removeChannel(A.rtChannel); A.rtChannel=null; } }
function logRt(table,p){
  const row=p.new||p.old||{};
  let summary='';
  if(table==='matches') summary=`#${row.id} ${row.home_score??'-'}:${row.away_score??'-'} ${row.status||''}`;
  else if(table==='bets') summary=`match #${row.match_id}`;          // KEINE Tipp-Werte loggen
  else summary='#'+(row.id||'');
  A.rtLog.unshift({t:fmtT(now()),event:p.eventType,table,summary});
  if(A.rtLog.length>200) A.rtLog.pop();
  if(A.view==='realtime'){ const l=$('rt-log'); if(l) l.innerHTML=A.rtLog.map(rtLine).join(''); }
}

    </div>
    <div class="row">
      <button class="btn ${A.env==='prod'?'primary':''}" onclick="switchEnv('prod')">Produktion</button>
      <button class="btn ${A.env==='dev'?'primary':''}" onclick="switchEnv('dev')">Dev / Test</button>
    </div>
    <div class="mut" style="font-size:12px;margin-top:10px">Umschalten erfordert erneutes Anmelden in der gewählten Umgebung.</div>
  </div>`));
  host.appendChild(el(`<div class="card fade" style="margin-bottom:14px">
    <div class="syne" style="font-weight:800;margin-bottom:10px">Session</div>
    <div class="mut" style="font-size:13px;line-height:1.8">
      <div>E-Mail: <b>${esc(A.user?.email||'–')}</b></div>
      <div>User-ID: <span class="mono">${esc(A.user?.id||'–')}</span></div>
      <div>Admin-Konto: ${ADMIN_EMAILS.includes((A.user?.email||'').toLowerCase())?'<span class="badge b-green">ja</span>':'<span class="badge b-amber">nein (RLS-limitiert)</span>'}</div>
    </div></div>`));
  // Admin-Proxy Status
  const proxyCard = el(`<div class="card fade" style="margin-bottom:14px">
    <div class="syne" style="font-weight:800;margin-bottom:10px">🔑 Admin-Proxy (Schreibrechte)</div>
    <div class="mut" style="font-size:13px;line-height:1.7;margin-bottom:12px">
      Schreibvorgänge (Spiele, Teams, Spieler, Nutzer, Extra-Fragen) laufen über die Vercel-Function
      <code>${esc(proxyUrl())}</code>, die den <code>service_role</code>-Key serverseitig hält.
      Lesen bleibt auf dem Anon-Key – fremde Tipps bleiben geschützt.
    </div>
    <div id="proxy-status" class="mut" style="font-size:13px;margin-bottom:12px">Status: <span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span></div>
    <label class="fld">Proxy-Endpoint (optional überschreiben)</label>
    <div class="row">
      <input id="proxy-input" value="${esc(localStorage.getItem('admin_proxy_url')||'')}" placeholder="/api/admin (Standard)">
      <button class="btn sm" onclick="(()=>{const v=$('proxy-input').value.trim(); if(v)localStorage.setItem('admin_proxy_url',v); else localStorage.removeItem('admin_proxy_url'); toast('Endpoint gespeichert'); renderView();})()">Speichern</button>
    </div>
  </div>`);
  host.appendChild(proxyCard);
  proxyHealth().then(h=>{
    const s=$('proxy-status'); if(!s) return;
    if(h && h.ok){
      const set = h.keys && h.keys[A.env];
      s.innerHTML = `Status: <span class="badge b-green">erreichbar</span> · Service-Key ${A.env.toUpperCase()}: ${set?'<span class="badge b-green">gesetzt</span>':'<span class="badge b-red">fehlt – Vercel Env setzen</span>'}`;
    } else {
      s.innerHTML = `Status: <span class="badge b-red">nicht erreichbar</span> <span class="mut">(${esc(h&&h.err||'kein /api/admin')}) – Schreiben nicht möglich, bis die Function deployed ist</span>`;
    }
  });

  host.appendChild(el(`<div class="card fade">
    <div class="syne" style="font-weight:800;margin-bottom:10px">🔒 Datenschutz-Logik</div>
    <div class="mut" style="font-size:13px;line-height:1.7">
      Fremde Tipps (<code>bets</code>) werden ausschließlich für <b>angestoßene Spiele</b> geladen, fremde Extra-Tipps nur nach <b>abgelaufener Deadline</b> – beides nur bei aktivem Schalter.
      Zusätzlich greift serverseitig die Supabase <b>RLS</b>: selbst bei manueller Abfrage liefert die DB keine offenen fremden Tipps.
      Im Realtime-Log werden bewusst <b>keine Tipp-Werte</b> protokolliert.
    </div></div>`));
}
async function switchEnv(env){
  if(env===A.env) return;
  A.env=env; localStorage.setItem('admin_env',env);
  await doLogout();
  $('login-env').value=env;
  toast('Bitte in '+ENVS[env].label+' anmelden');
}

// ════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════
let _modalSave=null;
function openModal(bodyHtml, onSave, saveLabel='Speichern', extraBtns=''){
  _modalSave=onSave;
  $('modal-host').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal fade">${bodyHtml}
      <div class="row" style="justify-content:space-between;margin-top:18px">
        <div>${extraBtns}</div>
        <div class="row"><button class="btn ghost" onclick="closeModal()">Abbrechen</button>
          ${onSave?`<button class="btn primary" id="modal-save">${saveLabel}</button>`:''}</div>
      </div></div></div>`;
  const sb=$('modal-save');
  if(sb) sb.onclick=async()=>{ sb.disabled=true; sb.textContent='…'; const ok=await _modalSave(); if(ok!==false) closeModal(); else { sb.disabled=false; sb.textContent=saveLabel; } };
}
function closeModal(){ $('modal-host').innerHTML=''; _modalSave=null; }

// ════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════
tryRestore();
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
$('login-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
