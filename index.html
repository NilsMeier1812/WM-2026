// BONUS (inside Tippen)
// ──────────────────────────────────────────
async function renderBonusInsideBetting(container) {
  container.innerHTML=`<div style="display:flex;justify-content:center;padding:40px 0;"><div class="spinner" style="width:22px;height:22px;border-top-color:var(--navy);border-color:var(--border);"></div></div>`;
  const [qRes,bRes,sRes]=await Promise.all([
    db.from('extra_questions').select('*').order('id',{ascending:true}),
    db.from('extra_bets').select('*').eq('user_id',S.user.id),
    db.from('extra_bet_scores').select('id,points_awarded').eq('user_id',S.user.id)  // berechnete Punkte (View)
  ]);
  if (qRes.error) { container.innerHTML=`<p style="color:var(--red);padding:16px;">${qRes.error.message}</p>`; return; }
  const questions=qRes.data||[];
  if (!questions.length) {
    container.innerHTML=`<div class="card" style="padding:32px 20px;text-align:center;"><p style="color:var(--text-3);font-size:13px;">Derzeit keine Bonusfragen.</p></div>`;
    return;
  }
  const scoreById={};
  if (!sRes.error) (sRes.data||[]).forEach(s=>{scoreById[s.id]=s.points_awarded;});
  const betsMap={};
  (bRes.data||[]).forEach(b=>{ if (!sRes.error) b.points_awarded=scoreById[b.id]??0; betsMap[b.question_id]=b; });

  // Spieler vorladen, falls es eine "players"-Frage gibt.
  // Paginiert laden, da Supabase pro Request serverseitig max. 1000 Zeilen liefert.
  if (questions.some(q=>q.answer_type==='players') && !S.allPlayers) {
    const all=[]; const PAGE=1000;
    for (let from=0;;from+=PAGE) {
      const {data:pl,error}=await db.from('players').select('id,name,team_id').order('name',{ascending:true}).range(from,from+PAGE-1);
      if (error) break;
      all.push(...(pl||[]));
      if (!pl || pl.length<PAGE) break;
    }
    S.allPlayers=all;
  }

  // Fragen für saveBonus zwischenspeichern (zum Ermitteln des answer_type)
  S.bonusQuestions=questions;

  const selectStyle=locked=>`width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600;outline:none;appearance:none;${locked?'opacity:.6;background:#F4F0E8;':''}cursor:${locked?'default':'pointer'};`;
  const teamFlag=t=>(!t.flag_url||t.flag_url.startsWith('http')||t.flag_url.startsWith('/'))?'':t.flag_url+' ';
  const teamOption=(t,selId)=>`<option value="${t.id}"${String(selId)===String(t.id)?' selected':''}>${teamFlag(t)}${t.name}</option>`;

  container.innerHTML=questions.map(q=>{
    const locked=new Date(q.deadline)<=new Date();
    const bet=betsMap[q.id];
    const myBet=bet?.bet_value||'';
    const ptsAw=bet?.points_awarded;

    // Team-Vorauswahl: bevorzugt bet_team_id, sonst Fallback über bet_value (Altdaten)
    const savedTeamRow=bet?(S.teams.find(t=>String(t.id)===String(bet.bet_team_id))||S.teams.find(t=>t.name===bet.bet_value)):null;
    const myTeamId=savedTeamRow?.id||'';
    const myPlayerId=bet?.bet_player_id||'';

    const groupMatch=(q.answer_type||'').match(/^group\s+(.+)$/i);

    let inputHtml='';
    if (q.answer_type==='teams') {
      const opts=S.teams.map(t=>teamOption(t,myTeamId)).join('');
      inputHtml=`<select id="q-${q.id}" ${locked?'disabled':''} style="${selectStyle(locked)}">
        <option value="" disabled${!myTeamId?' selected':''}>Bitte wählen …</option>${opts}
      </select>`;
    } else if (groupMatch) {
      const grp=groupMatch[1].trim();
      const opts=S.teams.filter(t=>String(t.group||'').trim().toLowerCase()===grp.toLowerCase()).map(t=>teamOption(t,myTeamId)).join('');
      inputHtml=`<select id="q-${q.id}" ${locked?'disabled':''} style="${selectStyle(locked)}">
        <option value="" disabled${!myTeamId?' selected':''}>Bitte wählen …</option>${opts}
      </select>`;
    } else if (q.answer_type==='players') {
      // Team & Spieler werden als IDs gespeichert -> zuverlässige Vorauswahl möglich.
      const teamOpts=S.teams.map(t=>teamOption(t,myTeamId)).join('');
      const playerOpts=myTeamId
        ? (S.allPlayers||[]).filter(p=>String(p.team_id)===String(myTeamId)).map(p=>`<option value="${p.id}"${String(myPlayerId)===String(p.id)?' selected':''}>${p.name}</option>`).join('')
        : '';
      inputHtml=`<select id="q-team-${q.id}" ${locked?'disabled':''} onchange="onBonusTeamChange(${q.id},this.value)" style="${selectStyle(locked)}margin-bottom:8px;">
        <option value="" disabled${!myTeamId?' selected':''}>Team wählen …</option>${teamOpts}
      </select>
      <select id="q-${q.id}" ${locked?'disabled':''} style="${selectStyle(locked)}">
        <option value="" disabled${!myPlayerId?' selected':''}>Spieler wählen …</option>${playerOpts}
      </select>`;
    } else {
      inputHtml=`<input id="q-${q.id}" type="text" value="${myBet}" placeholder="Deine Antwort …" ${locked?'disabled':''}
        style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:${locked?'#F4F0E8':'var(--surface)'};font-size:14px;font-weight:600;outline:none;${locked?'opacity:.6;':''}" />`;
    }

    // "ausgewertet" = Lösung gesetzt (ID-Spalten bzw. Text-Fallback) → dann zählen die berechneten Punkte
    const evaluated = q.correct_team_id!=null || q.correct_player_id!=null || (q.correct_answer!=null && q.correct_answer!=='');
    const badge=locked
      ? (evaluated
          ? `<span class="pill pill-gold">${ptsAw??0} Pkt</span>`
          : `<span class="pill pill-done">Abgelaufen</span>`)
      : `<span class="pill" style="background:#F1F0EC;color:var(--text-2);">+${q.points} Pkt</span>`;

    return `<div class="card" style="padding:18px 16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;">
        <div style="flex:1;">
          <div class="syne" style="font-size:15px;font-weight:800;letter-spacing:-.01em;">${q.question_text}</div>
          <div style="font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500;">Frist: ${fmtDate(q.deadline)}, ${fmtTime(q.deadline)}</div>
        </div>
        ${badge}
      </div>
      ${inputHtml}
      ${!locked?`<button id="btn-q-${q.id}" onclick="saveBonus(${q.id})" style="width:100%;background:var(--navy);color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;padding:13px;border-radius:10px;border:none;cursor:pointer;margin-top:12px;letter-spacing:.02em;">Speichern</button>`:''}
    </div>`;
  }).join('');
}

function onBonusTeamChange(qId, teamId) {
  const playerSel=$(`q-${qId}`);
  if (!playerSel) return;
  const players=(S.allPlayers||[]).filter(p=>String(p.team_id)===String(teamId));
  playerSel.innerHTML=`<option value="" disabled selected>Spieler wählen …</option>`+
    players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}

async function saveBonus(qId) {
  const q=(S.bonusQuestions||[]).find(x=>x.id===qId);
  const atype=q?.answer_type||'';
  const isGroup=/^group\s+/i.test(atype);

  // payload je nach Fragetyp: bet_value (Anzeige/Wertung) + IDs
  const payload={bet_value:'',bet_team_id:null,bet_player_id:null};
  if (atype==='teams'||isGroup) {
    const teamId=$(`q-${qId}`).value;
    if (!teamId) { showToast('Bitte ein Team wählen!','error'); return; }
    const team=S.teams.find(t=>String(t.id)===String(teamId));
    payload.bet_team_id=Number(teamId);
    payload.bet_value=team?.name||'';
  } else if (atype==='players') {
    const playerId=$(`q-${qId}`).value;
    if (!playerId) { showToast('Bitte einen Spieler wählen!','error'); return; }
    const player=(S.allPlayers||[]).find(p=>String(p.id)===String(playerId));
    payload.bet_player_id=Number(playerId);
    payload.bet_team_id=player?.team_id??(Number($(`q-team-${qId}`)?.value)||null);
    payload.bet_value=player?.name||'';
  } else {
    const val=$(`q-${qId}`).value.trim();
    if (!val) { showToast('Bitte etwas eintragen!','error'); return; }
    payload.bet_value=val;
  }

  const btn=$(`btn-q-${qId}`);
  btn.disabled=true; btn.innerHTML=`<div class="spinner" style="width:18px;height:18px;"></div>`;
  try {
    const {data:existing}=await db.from('extra_bets').select('id').eq('user_id',S.user.id).eq('question_id',qId).maybeSingle();
    if (existing) {
      const {error}=await db.from('extra_bets').update(payload).eq('id',existing.id);
      if (error) throw error;
    } else {
      const {error}=await db.from('extra_bets').insert({user_id:S.user.id,question_id:qId,...payload});
      if (error) throw error;
    }
    showToast('Bonustipp gespeichert');
    btn.textContent='✓ Gespeichert'; btn.style.background='var(--green)';
    setTimeout(()=>{btn.textContent='Speichern';btn.style.background='var(--navy)';btn.disabled=false;},2200);
  } catch(e) {
    showToast(e.message,'error');
    btn.textContent='Speichern'; btn.disabled=false;
  }
}



// ──────────────────────────────────────────
// Boost-Entfernung mit Confirm
// ──────────────────────────────────────────
let _pendingBoostRemoval = null;
let _pendingBoostRemovalTimer = null;

function clearPendingBoostRemoval() {
  if (_pendingBoostRemovalTimer) clearTimeout(_pendingBoostRemovalTimer);
  _pendingBoostRemoval = null;
  _pendingBoostRemovalTimer = null;
}

// ──────────────────────────────────────────
// Tipp boosten
// ──────────────────────────────────────────


async function toggleBoost(matchId) {
  const match = S.matches.find(m => m.id === matchId);
  const bet = S.bets[matchId];

  if (!bet || bet.home_score === null || bet.away_score === null) {
    showToast('Bitte tippe das Spiel zuerst, bevor du es boostest.', 'error');
    return;
  }

  if (isLocked(match)) {
    showToast('Dieses Spiel hat bereits begonnen. Boost nicht mehr möglich.', 'error');
    return;
  }

  // ─────────────────────────────────────────
  // Wenn bereits geboostet: Entfernen mit Confirm
  // ─────────────────────────────────────────
  if (bet.is_boosted) {
    if (_pendingBoostRemoval !== matchId) {
      // Erster Klick: Confirm-Modus
      clearPendingBoostRemoval();
      _pendingBoostRemoval = matchId;
      renderBettingContent();

      // Auto-Reset nach 3.5s
      _pendingBoostRemovalTimer = setTimeout(() => {
        _pendingBoostRemoval = null;
        _pendingBoostRemovalTimer = null;
        renderBettingContent();
      }, 3500);
      return;
    }

    // Zweiter Klick: tatsächlich entfernen
    clearPendingBoostRemoval();

    // Optimistic update
    S.bets[matchId].is_boosted = false;
    renderBettingContent();

    try {
      const { error } = await db.rpc('remove_bet_boost', {
        p_user_id: S.user.id,
        p_match_id: matchId
      });
      if (error) throw error;
      showToast('Boost entfernt');
    } catch (err) {
      // Rollback
      S.bets[matchId].is_boosted = true;
      renderBettingContent();
      showToast('Fehler beim Entfernen', 'error');
    }
    return;
  }

  // ─────────────────────────────────────────
  // Boost neu setzen / swappen (wie bisher)
  // ─────────────────────────────────────────
  clearPendingBoostRemoval(); // falls anderes pending war

  const hasLockedBoost = Object.values(S.bets).some(b => {
    const m = S.matches.find(x => x.id === b.match_id);
    return m && m.phase === match.phase && b.is_boosted && isLocked(m);
  });

  if (hasLockedBoost) {
    showToast('Der Boost dieser Phase ist bereits durch ein laufendes/beendetes Spiel fixiert.', 'error');
    return;
  }

  Object.values(S.bets).forEach(b => {
    const m = S.matches.find(x => x.id === b.match_id);
    if (m && m.phase === match.phase) b.is_boosted = false;
  });

  S.bets[matchId].is_boosted = true;
  renderBettingContent();

  try {
    const { error } = await db.rpc('swap_bet_boost', {
      p_user_id: S.user.id,
      p_new_match_id: matchId,
      p_phase: match.phase
    });
    if (error) throw error;
    showToast('Boost erfolgreich aktiviert!');
  } catch (err) {
    showToast('Fehler beim Boosten', 'error');
    await triggerSoftRefresh();
  }
}

async function handleSession(session) {
  S.user=session.user;
  let prof=null;
  for (let i=0;i<4;i++) {
    const {data}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if (data) { prof=data; break; }
    await new Promise(r=>setTimeout(r,400));
  }
  S.profile=prof;
  $('auth-screen').classList.add('hidden');
  const app=$('app-screen');
  app.classList.remove('hidden'); app.classList.add('flex');
  $('header-user').textContent=`${(prof?.display_name||'Du').split(' ')[0]}`;
  // Sync-Button nur für Moderatoren/Admins
  const syncBtn = $('btn-sync');
  if (syncBtn) syncBtn.style.display = (prof?.role === 'mod' || prof?.role === 'admin') ? 'inline-flex' : 'none';
  const lastSeenIso = prof?.last_seen_at || null;   // Stand vor diesem Besuch merken
  goTo('dashboard');
  await fetchData();
  setupRealtime();        // ← NEU
  _scheduleAutoReload();

  // Zusammenfassung seit letztem Besuch berechnen & Dashboard ggf. neu rendern
  try {
    await computeWelcomeSummary(lastSeenIso);
    if (S.welcomeSummary && S.view === 'dashboard') renderDashboard($('main'));
  } catch (e) { /* Summary ist optional – Fehler nicht hochreichen */ }

  // Besuchszeitpunkt aktualisieren (jetzt + beim Verlassen, damit live Gesehenes nicht doppelt auftaucht)
  _touchLastSeen();
  if (!S._lastSeenHook) {
    S._lastSeenHook = true;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') _touchLastSeen();
    });
  }
}

function _touchLastSeen() {
  if (!S.user) return;
  const nowIso = new Date().toISOString();
  db.from('profiles').update({ last_seen_at: nowIso }).eq('id', S.user.id).then(() => {}, () => {});
  if (S.profile) S.profile.last_seen_at = nowIso;
}

function handleSignOut() {
  S.user=null; S.profile=null;
  teardownRealtime();     // ← NEU
  $('auth-screen').classList.remove('hidden');
  const app=$('app-screen');
  app.classList.add('hidden'); app.classList.remove('flex');
}

// REALTIME (Live-Updates für matches)
// ──────────────────────────────────────────
let _realtimeChannel = null;
const _pendingPlayerFetches = new Set();

function setupRealtime() {
  if (_realtimeChannel) return; // schon aktiv

  _realtimeChannel = db
    .channel('matches-live')
    .on(
      'postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'matches' },
      async (payload) => {
        await handleRealtimeMatchUpdate(payload.new);
      }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        console.log('[Realtime] Verbunden — Live-Updates aktiv.');
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        console.warn('[Realtime] Verbindung verloren:', status);
      }
    });
}

function teardownRealtime() {
  if (_realtimeChannel) {
    db.removeChannel(_realtimeChannel);
    _realtimeChannel = null;
    console.log('[Realtime] Getrennt.');
  }
}

function applyRealtimeUpdate(matchId) {
  // 1. View-spezifisches Match-Update
  switch (S.view) {
    case 'tippen':
      patchBettingMatchCard(matchId);
      break;
    case 'uebersicht':
      patchOverviewMatchCard(matchId);
      break;
    case 'dashboard':
      // Dashboard zeigt mehrere Karten; Live-Match komplett zu patchen wäre aufwendig.
      // Falls eine spezifische Live-Karte sichtbar ist, fall back auf silentRender für das Match.
      // Hero + LB Werte aktualisieren funktioniert sowieso:
      patchDashboardValues();
      // Live-Match-Card im Dashboard: surgical falls vorhanden, sonst silent
      if (!patchDashboardLive(matchId)) {
        // Fallback: nur wenn das geänderte Match aktuell sichtbar ist
        if (document.getElementById(`dash-live-${matchId}`)) silentRender();
      }
      break;
    case 'tabelle':
      patchTabelleValues();
      break;
    case 'profil':
      patchProfilValues();
      break;
  }
  // 2. Smart Action Bar immer aktualisieren
  updateSmartActionBar();
}

async function handleRealtimeMatchUpdate(updated) {
  const idx = S.matches.findIndex(m => m.id === updated.id);
  if (idx < 0) return; // Match nicht in unserem State

  const existing = S.matches[idx];
  const scoreChanged   = existing.home_score !== updated.home_score || existing.away_score !== updated.away_score;
  const statusChanged  = existing.status !== updated.status;
  const scorerChanged  = existing.first_goalscorer_id !== updated.first_goalscorer_id;
  const justFinished   = !isFinished(existing.status) && isFinished(updated.status);

  // Update mergen, joined relations beibehalten
  S.matches[idx] = {
    ...existing,
    ...updated,
    home_team: existing.home_team,
    away_team: existing.away_team,
    first_goalscorer: existing.first_goalscorer
  };

  // Torschütze aufgelöst (cache oder fetch)
  if (scorerChanged) {
    if (updated.first_goalscorer_id === null) {
      S.matches[idx].first_goalscorer = null;
    } else if (S.playerCache[updated.first_goalscorer_id]) {
      S.matches[idx].first_goalscorer = S.playerCache[updated.first_goalscorer_id];
    } else if (!_pendingPlayerFetches.has(updated.first_goalscorer_id)) {
      _pendingPlayerFetches.add(updated.first_goalscorer_id);
      const { data } = await db.from('players')
        .select('id,name,team_id')
        .eq('id', updated.first_goalscorer_id)
        .single();
      _pendingPlayerFetches.delete(updated.first_goalscorer_id);
      if (data) {
        S.playerCache[data.id] = data;
        S.matches[idx].first_goalscorer = data;
      }
    }
  }

  // Live Leaderboard neu berechnen (für laufende Spiele).
  // Bei Status-Wechsel (Spiel startet/endet) erst die Live-Bets aller User auffrischen,
  // damit ein neu gestartetes Spiel sofort korrekt einfließt.
  if (statusChanged) await refreshLiveBets();
  recomputeLiveLeaderboard();

  // Re-render aktive Ansicht
  applyRealtimeUpdate(updated.id);

  // Realtime Popup (Tor / Spielende)
  const newH = updated.home_score ?? 0;
  const newA = updated.away_score ?? 0;
  if (justFinished) {
    showRealtimePopup('Spielende!', existing.home_team, newH, newA, existing.away_team);
  } else if (scoreChanged && (existing.home_score !== null || existing.away_score !== null)) {
    showRealtimePopup('Tor!', existing.home_team, newH, newA, existing.away_team);
  }

  // Bei finalisierten Spielen Daten komplett neu laden (Punkte sind dann vom Cron vergeben)
  if (justFinished) {
    setTimeout(() => fetchData(false, true), 2500);
  }
}

// Helper: Live-Leaderboard neu berechnen ohne kompletten fetchData

function patchBettingMatchCard(matchId) {
  const el = document.getElementById(`match-card-${matchId}`);
  if (!el) return false;
  const m = S.matches.find(x => x.id === matchId);
  if (!m || m.phase !== S.bettingPhase) return false;
  const newEl = htmlToElement(betCard(m));
  if (!newEl) return false;
  el.replaceWith(newEl);
  return true;
}

// Lädt die Tipps ALLER User für aktuell laufende Spiele (für Live-Punkte im Leaderboard).
// Tipps sind ab Anpfiff gesperrt → ändern sich während des Spiels nicht, nur die Spielstände.
async function refreshLiveBets() {
  const liveMatches = S.matches.filter(m => isLocked(m) && !isFinished(m.status));
  if (liveMatches.length === 0) { S.liveBets = []; S.liveUdMap = {}; return; }
  const { data, error } = await db.from('bets')
    .select('user_id,match_id,home_score,away_score,first_goalscorer_id,is_goalless,is_boosted,points_awarded')
    .in('match_id', liveMatches.map(m => m.id));
  if (!error) {
    S.liveBets = data || [];
    // Underdog-Counts pro laufendem Spiel cachen → Fallback für calcBetPoints.
    S.liveUdMap = buildUnderdogMap(S.liveBets);
  }
}

function recomputeLiveLeaderboard() {
  const livePointsMap = {};

  // Live-Punkte für ALLE User aus den gecachten Live-Bets berechnen
  (S.liveBets || []).forEach(b => {
    const m = S.matches.find(x => x.id === b.match_id);
    if (m && isLocked(m) && !isFinished(m.status) &&
        (b.points_awarded === null || b.points_awarded === undefined)) {
      const pts = calcBetPoints(m, b);
      if (pts > 0) livePointsMap[b.user_id] = (livePointsMap[b.user_id] || 0) + pts;
    }
  });

  S.liveLeaderboard = S.leaderboard.map(p => ({
    ...p,
    total_points: (p.total_points || 0) + (livePointsMap[p.id] || 0)
  })).sort((a, b) => b.total_points - a.total_points);
}

async function initApp() {
  const {data:{session}}=await db.auth.getSession();
  if (session) await handleSession(session);
  db.auth.onAuthStateChange(async(event,session)=>{
    if (event==='SIGNED_IN'&&S.user?.id!==session?.user?.id) await handleSession(session);
    else if (event==='SIGNED_OUT') handleSignOut();
  });
}

// Auto-reload: alle 5 Min wenn Tab sichtbar, sofort bei Tab-Rückkehr
let _autoReloadTimer;
function _scheduleAutoReload() {
  clearTimeout(_autoReloadTimer);
  _autoReloadTimer = setTimeout(async () => {
    if (S.user) await fetchData(false, true);
    _scheduleAutoReload();
  }, 5 * 60 * 1000);
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.user) {
    // Erst die Session rehydrieren/auffrischen, DANN laden – sonst läuft der Fetch
    // evtl. als anon und liefert keine Spiele (matches sind nur für authenticated lesbar).
    try { await db.auth.getSession(); } catch (e) {}
    fetchData(false, true);
    _scheduleAutoReload();
  } else {
    clearTimeout(_autoReloadTimer);
  }
});

setInterval(() => {
  if (S.view !== 'tippen' || !S.user) return;
  let needsRerender = false;
  document.querySelectorAll('[data-countdown-for]').forEach(el => {
    const matchId = parseInt(el.dataset.countdownFor);
    const m = S.matches.find(x => x.id === matchId);
    if (!m) return;
    const c = getTimeUntilLock(m.kickoff_time);
    if (!c) {
      needsRerender = true; // Spiel hat angefangen → re-render notwendig
    } else {
      const cls = 'pill ' + (c.veryUrgent ? 'pill-countdown-urgent' : c.urgent ? 'pill-countdown-warn' : 'pill-countdown');
      el.className = cls;
      el.textContent = `⏱ ${c.label}`;
    }
  });
  if (needsRerender) renderBettingContent();
}, 30000);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('modal-scorer').classList.contains('hidden')) {
    closeScorer();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('modal-scorer').classList.contains('hidden')) closeScorer();
});

initApp();
</script>
